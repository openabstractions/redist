name: promote verified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Verified release version (vMAJOR.MINOR.PATCH)
        type: string
        required: true
      candidate_run:
        description: Successful candidate.yml run containing the verified-release artifact
        type: string
        required: true
      resume:
        description: Resume an exact partial promotion without replacing an existing tag, draft, or asset
        type: boolean
        default: false

concurrency:
  group: redist-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: promote the verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          RELEASE_VERSION: ${{ inputs.version }}
          RESUME: ${{ inputs.resume }}
        run: |
          args=(--run "$CANDIDATE_RUN" --version "$RELEASE_VERSION" --source "$GITHUB_SHA")
          if [ "$RESUME" = true ]; then args+=(--resume); fi
          python scripts/promote.py "${args[@]}"
