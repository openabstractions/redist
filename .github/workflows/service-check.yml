name: Windows service verification
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Completed release workflow run with a successful Windows package job
        required: true
        type: string
      session_mode:
        description: Explicit logon mechanism being measured; neither creates service instances manually
        type: choice
        options:
          - Verify
          - VerifyLogon
        default: Verify
permissions:
  contents: read
  actions: read
jobs:
  service:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: identify the existing package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        shell: pwsh
        run: |
          if ($env:ARTIFACT_RUN -notmatch '^[0-9]+$') { throw 'Expected a numeric workflow run ID' }
          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:ARTIFACT_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source run' }
          if ($run.path -ne '.github/workflows/release.yml' -or $run.status -ne 'completed' -or $run.repository.full_name -ne $env:GH_REPO) { throw 'Expected a completed release workflow in this repository' }
          $jobs = gh run view $env:ARTIFACT_RUN --json jobs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source jobs' }
          if (@($jobs.jobs | Where-Object { $_.name -eq 'windows' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'Source Windows packaging did not pass' }
          "Package source: $($run.head_sha); fixture source: $env:GITHUB_SHA; source run: $env:ARTIFACT_RUN" | Tee-Object package-source.txt
          gh run download $env:ARTIFACT_RUN -n abstraction-windows-unsigned -D pkg
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $checked = @{}
          foreach ($line in Get-Content pkg/SHA256SUMS.windows) {
            if ($line -notmatch '^([a-f0-9]{64})\s+\*?(abstraction-(?:x64|arm64)\.msi)$') { throw 'Unexpected checksum entry' }
            $expected = $Matches[1]; $file = $Matches[2]
            if ((Get-FileHash "pkg/$file" -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "Checksum mismatch: $file" }
            if ($checked.ContainsKey($file)) { throw 'Duplicate checksum entry' }
            $checked[$file] = $true
          }
          if ($checked.Count -ne 2) { throw 'Expected checksums for both Windows packages' }
          exit 0
      - name: install machine scope
        id: install
        shell: pwsh
        run: |
          $msi = (Resolve-Path pkg/abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i',$msi,'/qn','/norestart','ALLUSERS=1','MSIINSTALLPERUSER=','/l*v','machine-install.log')
          if ($p.ExitCode -ne 0) { Get-Content machine-install.log -Tail 120; throw "Install exited $($p.ExitCode)" }
      - name: fresh sign-in and recovery
        timeout-minutes: 5
        shell: pwsh
        env:
          SESSION_MODE: ${{ inputs.session_mode }}
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File test_service_session.ps1 -Mode $env:SESSION_MODE -StatePath "$env:RUNNER_TEMP/oa-service-session.json"
          if ($LASTEXITCODE -ne 0) { throw "Session verification exited $LASTEXITCODE" }
          exit 0
      - name: remove installed package
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          $msi = (Resolve-Path pkg/abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/x',$msi,'/qn','/norestart','/l*v','machine-uninstall.log')
          if ($p.ExitCode -ne 0) { throw "Uninstall exited $($p.ExitCode)" }
          if (@(Get-Service -Name 'OpenAbstractionsSupervisor*' -ErrorAction SilentlyContinue).Count) { throw 'Service survived uninstall' }
      - name: remove disposable session
        if: always()
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File test_service_session.ps1 -Mode Cleanup -StatePath "$env:RUNNER_TEMP/oa-service-session.json" 2>&1 | Tee-Object service-session-cleanup.log
          if ($LASTEXITCODE -ne 0) { throw "Session cleanup exited $LASTEXITCODE" }
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: service-diagnostics
          path: |
            package-source.txt
            machine-install.log
            machine-uninstall.log
            service-session.log
            service-session-cleanup.log
