      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-pe-signed-${{ github.run_attempt }}
          path: signed/
          if-no-files-found: error
  windows:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: [candidate, windows-build, windows-pe-sign, python]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: consume exact windows-pe-signed producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-pe-sign.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-pe-sign.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-pe-sign.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-pe-signed-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: consume exact reviewed engine inputs without signing-host transit
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-build.outputs.engine-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-build.outputs.engine-artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-build.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "windows-engine-inputs-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out reviewed-engines
          for directory in engine-input pytorch-input; do
            if [ -d "reviewed-engines/$directory" ]; then cp -r "reviewed-engines/$directory" .; fi
          done
      - name: stage signed authoritative runtime inputs
        run: |
          cp -r signed/runtime/* .
          python3 windows/windows_signing.py verify-pe --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --root signed --payload windows/payload.tsv --receipt pe-verification.json
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"

      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # OA's native IPC library for applications, which the runtime ships as a
      # redistributable ships its runtime DLLs (windows/payload.tsv,
      # tools/abstraction_ipc.dll): the exact file this run's win_amd64
      # abstraction-ipc wheel carries, never a second build. A rerun takes the
      # latest attempt's wheel. Windows ARM64 has no build of it; that package
      # leaves it out and says so (IpcLibrary). The wheel must be the one its
      # artifact's SHA256SUMS.pypi.win32-x64 lists, and dist/ipc-library.json
      # records the artifact, the wheel's line and the DLL's SHA-256 for the
      # draft job to check against the wheel again.
      - name: select successful exact Windows wheel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          sys.path.insert(0, 'windows')
          from app_assets import select_windows_wheel_artifact
          from windows_signing import consume_artifact
          repository = os.environ['GITHUB_REPOSITORY']
          run = int(os.environ['GITHUB_RUN_ID'])
          def pages(path, key):
              result = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp', path]))
              return [item for page in result for item in page[key]]
          jobs = pages(f'repos/{repository}/actions/runs/{run}/jobs?filter=all&per_page=100', 'jobs')
          artifacts = pages(f'repos/{repository}/actions/runs/{run}/artifacts?per_page=100', 'artifacts')
          selected = select_windows_wheel_artifact(jobs, artifacts, run, os.environ['GITHUB_SHA'])
          attempt = int(selected['name'].rsplit('-', 1)[1])
          consume_artifact(selected['id'], selected['digest'].removeprefix('sha256:'), selected['name'],
                           os.environ['GITHUB_SHA'], run, attempt, pathlib.Path('ipc_wheels') / selected['name'])
          pathlib.Path('ipc-wheel-selection.txt').write_text(selected['name'])
          PY
      - name: take the IPC library out of this run's win_amd64 wheel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="ipc_wheels/$(cat ipc-wheel-selection.txt)"
          mkdir -p dist
          python3 - "$latest" <<'PY'
          import hashlib, json, os, pathlib, re, sys, zipfile
          folder = pathlib.Path(sys.argv[1])
          wheels = sorted(folder.glob('abstraction_ipc-*-win_amd64.whl'))
          if len(wheels) != 1:
              raise SystemExit('FAIL  expected one win_amd64 abstraction-ipc wheel in %s, found %d'
                               % (folder, len(wheels)))
          wheel = wheels[0]
          wheel_sha256 = hashlib.sha256(wheel.read_bytes()).hexdigest()
          sums = (folder / 'SHA256SUMS.pypi.win32-x64').read_text(encoding='utf-8').splitlines()
          lines = [line for line in sums if re.fullmatch(r'[0-9a-f]{64} [ *]' + re.escape(wheel.name), line)]
          if len(lines) != 1 or lines[0][:64] != wheel_sha256:
              raise SystemExit('FAIL  SHA256SUMS.pypi.win32-x64 does not list %s with its SHA-256 %s'
                               % (wheel.name, wheel_sha256))
          member = 'abstraction/ipc/_native/abstraction_ipc.dll'
          with zipfile.ZipFile(wheel) as archive:
              data = archive.read(member)
          target = pathlib.Path('ipc-library/abstraction_ipc.dll')
          target.parent.mkdir(exist_ok=True)
          target.write_bytes(data)
          receipt = {'schema': 1, 'run_id': int(os.environ['GITHUB_RUN_ID']), 'artifact': folder.name,
                     'wheel': wheel.name, 'wheel_sha256': wheel_sha256, 'wheel_sums_line': lines[0],
                     'member': member, 'library': 'tools/abstraction_ipc.dll',
                     'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          pathlib.Path('dist/ipc-library.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('ok    %s, %d bytes, sha256 %s, from %s (%s)'
                % (target, len(data), receipt['sha256'], wheel.name, folder.name))
          PY

      # windows/build.py is the packager on a workstation and it is the packager
      # here, because two assemblers cannot be kept agreeing about what the
      # package contains and abstraction.wxs installs more than tools.tsv names.
      # --bin is what lets one packager serve both routes: the programs come
      # from the published module versions installed above rather than from
      # checkouts, and a row with no source here is named and gated out, the way
      # posix/build.py does it.
      - name: package
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          version=$CANDIDATE_VERSION

          mkdir -p dist
          for arch in x64 arm64; do
            case $arch in x64) goarch=amd64 ;; *) goarch=arm64 ;; esac
            ipc=()
            [ "$arch" = x64 ] && ipc=(--src ipclibrary=ipc-library)
            for pass in a b; do
              python3 windows/build.py --arch "$arch" --version "$version" \
                --out "pkg-$pass/$arch" --bin "a/$goarch" --license LICENSE --ext "$WIX_UI_EXT" \
                --src modelhostengine=engine-input --src pytorchengine=pytorch-input "${ipc[@]}"
              if [ "$arch" = x64 ] && ! cmp -s ipc-library/abstraction_ipc.dll "pkg-$pass/x64/payload/tools/abstraction_ipc.dll"; then
                printf 'FAIL  the x64 package did not stage the IPC library that dist/ipc-library.json records\n'
                exit 1
              fi
            done
            cp "pkg-a/$arch/abstraction-$arch.msi" "dist/abstraction-$arch.msi"
            if cmp -s "pkg-a/$arch/abstraction-$arch.msi" "pkg-b/$arch/abstraction-$arch.msi"; then
              printf 'ok    abstraction-%s.msi is byte-identical across two builds\n' "$arch"
            else
              printf 'note  abstraction-%s.msi differs between two builds; its inputs do not\n' "$arch"
            fi
          done

      # sha256sum's own format, so `sha256sum -c SHA256SUMS` is the verification
      # command and we are not asking anyone to learn ours. One file per build
      # job, joined by `draft`: a digest is computed by the job that made the
      # bytes, or it describes a different build.
      - name: digests
        run: |
          n=$(ls dist/*.msi | wc -l)
          if [ "$n" -lt 2 ]; then
            printf 'FAIL  packages â€” %s inputs, and this rule cannot fail on fewer than 2\n' "$n"
            exit 1
          fi
          (cd dist && sha256sum ./*.msi | sed 's#\./##' | tee SHA256SUMS.windows)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          name: windows-msi-raw-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

  # This package has two scopes and, until today, this job exercised one of
  # them: `msiexec /i /qn` with no scope named, on a runner that is an
  # administrator. That green never reached the custom action that registers
  # the supervisor, so the machine scope shipped for days calling a `jobd` verb
  # no `jobd` had. The cheap half passing is not the package passing.
  #
  # So: each leg names its scope on the command line, and asserts what the
  # install did rather than what the package promised. A manifest is checked by
  # windows/validate.py, before anything is built; nothing below reads one.
  windows-app-msi:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: [candidate, app_comfyui]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"
      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: verify optional adopter pairs from this candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMFYUI_ARTIFACT: ${{ needs.app_comfyui.outputs.artifact }}
          COMFYUI_SOURCE_COMMIT: ${{ needs.app_comfyui.outputs.source_commit }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          mkdir -p app-inputs
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from app_assets import roster, select_producers
          outputs = {
              app: {'artifact': os.environ[app.upper() + '_ARTIFACT'],
                    'source_commit': os.environ[app.upper() + '_SOURCE_COMMIT']}
              for app in ('comfyui',)}
          for app, artifact in select_producers(roster('apps.json'), outputs):
              destination = pathlib.Path('app-inputs') / app
              destination.mkdir()
              subprocess.run(['gh', 'run', 'download', os.environ['GITHUB_RUN_ID'],
                              '-n', artifact, '-D', str(destination)], check=True)
          pathlib.Path('app-producer-outputs.json').write_text(json.dumps(outputs, sort_keys=True) + '\n',
                                                                encoding='utf-8')
          PY
          python3 scripts/app_assets.py stage --roster apps.json \
            --inputs app-inputs --dist dist --metadata "$RUNNER_TEMP/apps.json" \
            --outputs app-producer-outputs.json --candidate-source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --predecessors "$APP_PRODUCERS"

      - name: stage exact app binaries
        run: |
          mkdir -p verified-release
          find dist -maxdepth 1 -name '*.zip' -exec cp {} verified-release/ \;
      - name: application MSIs from exact app producer binaries
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys
          version = os.environ['CANDIDATE_VERSION']
          release = pathlib.Path('verified-release')
          out = pathlib.Path('setup')
          out.mkdir()
          def pin(path):
              data = path.read_bytes()
              return {'file': str(path.resolve()), 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          apps = []
          for row in json.loads(pathlib.Path('apps.json').read_text(encoding='utf-8'))['apps']:
              archive = release / row['binary_zip']
              if not archive.is_file():
                  raise SystemExit('FAIL  the verified release lacks ' + row['binary_zip'])
              manifest = pathlib.Path('windows/apps') / row['id'] / 'application-manifest.json'
              text = manifest.read_text(encoding='utf-8')
              names = sorted(set(re.findall(r'@([a-z][a-z0-9_]{0,63})@', text)))
              title = json.loads(re.sub(r'@[a-z][a-z0-9_]{0,63}@', '', text))['title']
              built = out / 'apps' / row['id']
              subprocess.run([sys.executable, 'windows/apps/build_app.py', '--app-id', row['id'],
                              '--title', title, '--publisher', 'OpenAbstractions', '--version', version,
                              '--zip', str(archive), '--zip-sha256', row['binary_sha256'],
                              '--zip-bytes', str(row['binary_bytes']), '--manifest', str(manifest),
                              '--out', str(built),
                              *[x for name in names for x in ('--define', f'{name}={row[name]}')]], check=True)
              apps.append(dict(id=row['id'], title=title, **pin(built / f"{row['id']}-{version}.msi")))
          chain = {'version': version, 'apps': apps}
          (out / 'chain.json').write_text(json.dumps(chain, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(chain, indent=2))
          PY

      - name: retain only application MSI containers and their existing chain metadata
        run: |
          mkdir app-msi-raw
          cp setup/chain.json app-msi-raw/
          for msi in setup/apps/*/*.msi; do
            if [ -f "$msi" ]; then
              app=$(basename "$(dirname "$msi")")
              mkdir -p "app-msi-raw/apps/$app"
              cp "$msi" "app-msi-raw/apps/$app/"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-app-msi-raw-${{ github.run_attempt }}
          path: app-msi-raw/
          if-no-files-found: error

  windows-msi-sign:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') && github.repository == 'openabstractions/redist' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/0.4.0' && github.actor == 'ReinisLusis' && github.triggering_actor == 'ReinisLusis' }}
    needs: [candidate, windows-pe-sign, windows, windows-app-msi]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: signing
    env:
      OA_CERTUM_SIGNING_ONLY: '1'
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      package-artifact: abstraction-windows-${{ github.run_attempt }}
      package-artifact-id: ${{ steps.packages.outputs.artifact-id }}
      package-artifact-digest: ${{ steps.packages.outputs.artifact-digest }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: consume exact windows-msi-raw producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-msi-raw-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed/core
      - name: consume exact windows-app-msi-raw producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-app-msi.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-app-msi.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-app-msi.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-app-msi-raw-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed/apps
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"
      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: admit exact windows-pe-signed bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-pe-sign.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-pe-sign.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-pe-sign.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "windows-pe-signed-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed/canonical
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: download pinned SimplySign Desktop installer
        shell: pwsh
        run: |
          $policy = Get-Content windows/certum_simplysign.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $policy.installer.url -OutFile "$env:RUNNER_TEMP/simplysign.msi"
      - name: connect exact reviewed signing identity
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: >-
          ./windows/certum_simplysign.ps1 -Mode Connect
          -InstallerPath "$env:RUNNER_TEMP/simplysign.msi"
          -SessionPath "$env:RUNNER_TEMP/signing-session.json"
      - name: sign MSI containers after payload verification
        run: python3 windows/windows_signing.py sign-msi --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --root signed --receipt signed/signatures.json
      - name: checksum final signed core packages
        run: |
          (cd signed/core && sha256sum ./*.msi | sed 's#\./##' > SHA256SUMS.windows)
          mkdir packages
          cp signed/core/* packages/
          cp signed/signatures.json packages/windows-signatures.json
          (cd packages && sha256sum ./*.msi | sed 's#\./##' > SHA256SUMS.windows)
      - name: disconnect owned signing session
        if: always()
        shell: pwsh
        run: >-
          ./windows/certum_simplysign.ps1 -Mode Disconnect
          -SessionPath "$env:RUNNER_TEMP/signing-session.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-msi-signed-${{ github.run_attempt }}
          path: signed/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: packages
        with:
          name: abstraction-windows-${{ github.run_attempt }}
          path: packages/
          if-no-files-found: error
  verify:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: [candidate, windows-msi-sign, windows-pe-sign, javascript, python]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      machine-service: ${{ steps.instance.outputs.state }}
    env:
      # The published release an upgrade is qualified from. The fixture picks
      # predecessor activation from this version.
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
      PREDECESSOR_RELEASE: v0.2.0
      PREDECESSOR_VERSION: 0.2.0
      PREDECESSOR_SHA256_EXPECTED: 274816ade8e8294be9801d2ca519c22e24d68808c1427609d161aa44dc528fd4
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - name: admit exact windows-pe-signed bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-pe-sign.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-pe-sign.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-pe-sign.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "windows-pe-signed-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out canonical
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"
      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: fetch the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_ARTIFACT: ${{ needs.windows-msi-sign.outputs.package-artifact }}
        run: gh run download "$GITHUB_RUN_ID" -n "$PACKAGE_ARTIFACT" -D pkg

      # The checksum file ships to strangers as the way to check a download, so
      # it is checked here first. A SHA256SUMS nobody validated is decoration.
      - name: the checksum file is true
        run: (cd pkg && sha256sum -c SHA256SUMS.windows)

      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: independent signed MSI and canonical payload verification
        run: python3 windows/windows_signing.py verify-msis --root pkg --canonical canonical/native/abstraction_ipc.dll --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --receipt pkg-verification.json
      # A per-user service instance is created at logon, so whether one can
      # appear here at all is a property of the runner and not of the package.
      # It is measured before anything is installed, because it decides what the
      # machine leg is allowed to conclude from an absence.
      - name: what this runner can show
        shell: pwsh
        run: |
          $me = (Get-Process -Id $PID).SessionId
          "this job runs in session $me"
          try { & query.exe session } catch { 'query.exe is not on this runner' }
          $interactive = if ($me -eq 0) { 0 } else { 1 }
          if ($interactive -eq 0) {
            'UNPROVEN here: this job runs in session 0. The service manager clones a per-user service into a session at logon, and there is no session for it to clone into. The template, its configuration and its recovery policy are provable on this runner; a running instance is not.'
          } else {
            "an interactive session exists, so a clone of the template must appear and this job holds the machine scope to it"
          }
          "interactive=$interactive" >> $env:GITHUB_ENV
          # query.exe is diagnostic; do not propagate its stale native exit code.
          exit 0

      # Per-user assertions run with the fresh standard-user token.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          path: user-fixture
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: select verified Windows Go SDK and smoke duplex pipes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 user-fixture/tools/windows_go_sdk.py --cache-dir "$RUNNER_TEMP/windows-go-sdk" --github-env --smoke-dir "$RUNNER_TEMP/windows-go-smoke" > windows-go-sdk-proof.json
          printf '\n### Verified Windows Go SDK and duplex race smoke\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat windows-go-sdk-proof.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: preserve Windows Go SDK source identity and smoke
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-go-sdk-${{ github.job }}-${{ github.run_attempt }}
          path: |
            windows-go-sdk-proof.json
            ${{ runner.temp }}/windows-go-smoke/named-pipe-race.log
            ${{ runner.temp }}/windows-go-smoke/smoke-receipt.json
          if-no-files-found: error
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: prepare pinned installed SDK clients
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" > sdk-jobs.json
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > sdk-artifacts.json
          python3 user-fixture/sdk_smokes/artifact_attempts.py --jobs sdk-jobs.json --artifacts sdk-artifacts.json \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-env "$GITHUB_ENV" --shell-env sdk-artifact-names.env
          source sdk-artifact-names.env
          gh run download "$GITHUB_RUN_ID" -n "$SDK_NPM_ARTIFACT" -D sdk-inputs/npm
          gh run download "$GITHUB_RUN_ID" -n "$SDK_PYPI_ARTIFACT" -D sdk-inputs/pypi
          gh run download "$GITHUB_RUN_ID" -n "$SDK_PROVENANCE_ARTIFACT" -D sdk-inputs/provenance
          (cd sdk-inputs/npm && sha256sum -c "SHA256SUMS.npm.win32-x64")
          (cd sdk-inputs/pypi && sha256sum -c "SHA256SUMS.pypi.win32-x64")
          python3 user-fixture/sdk_smokes/prepare.py --out sdk-smokes-ready \
            --npm sdk-inputs/npm --pypi sdk-inputs/pypi \
            --tools user-fixture/tools.tsv \
            --provenance sdk-inputs/provenance/module-provenance.json
      - name: canonical signed DLL and addon bytes in wheel and npm
        run: python3 windows/windows_signing.py verify-language --root sdk-inputs --canonical canonical/native --policy windows/certum_simplysign.json --signtool "$SIGNTOOL"
      - name: fetch reviewed predecessor package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download $env:PREDECESSOR_RELEASE --repo openabstractions/redist --pattern abstraction-x64.msi --pattern SHA256SUMS --dir predecessor
          if ($LASTEXITCODE -ne 0) { throw 'Published predecessor download failed' }
      - name: verify predecessor checksum
        shell: python
        run: |
          import hashlib, json, os, pathlib, re
          package = pathlib.Path('predecessor/abstraction-x64.msi')
          if not package.is_file() or package.stat().st_size == 0:
              raise SystemExit('Published predecessor MSI is missing or empty')
          entries = []
          for line in pathlib.Path('predecessor/SHA256SUMS').read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64}) [ *]abstraction-x64\.msi', line)
              if match:
                  entries.append(match[1])
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          if entries != [actual]:
              raise SystemExit('Published predecessor checksum is absent, duplicated or mismatched')
          if actual != os.environ['PREDECESSOR_SHA256_EXPECTED']:
              raise SystemExit('Published predecessor differs from the reviewed 0.2.0 MSI')
          release = os.environ['PREDECESSOR_RELEASE']
          if release != 'v'+os.environ['PREDECESSOR_VERSION']:
              raise SystemExit('The predecessor release and the version the fixture asserts name different versions')
          pathlib.Path('predecessor-source.json').write_text(json.dumps({'release': release, 'repository': 'openabstractions/redist', 'file': package.name, 'sha256': actual}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PREDECESSOR_SHA256='+actual+'\n')
      - name: prepare the forced-failure machine candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force failing | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode FailingCandidate -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -Output (Join-Path (Resolve-Path failing).Path 'abstraction-x64.msi')
          if ($LASTEXITCODE -ne 0) { throw "Forced-failure candidate preparation exited $LASTEXITCODE" }

      - name: configure disposable consumer MSI policy
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'MSI policy fixture requires a disposable GitHub Windows runner' }
          if ((Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).ProductType -ne 3) { throw 'MSI policy fixture requires Windows Server' }
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          $statePath = Join-Path $env:RUNNER_TEMP 'oa-msi-policy.json'
          if (Test-Path -LiteralPath $statePath -ErrorAction Stop) { throw 'MSI policy baseline already exists' }
          $keyExists = Test-Path -LiteralPath $policy -ErrorAction Stop
          $state = @{ KeyExisted=$keyExists; ValueExisted=$false; Value=$null; Restored=$false }
          if ($keyExists) {
              $key = Get-Item -LiteralPath $policy -ErrorAction Stop
              try {
                  $state.ValueExisted = $key.GetValueNames() -contains 'DisableMSI'
                  if ($state.ValueExisted) {
                      if ($key.GetValueKind('DisableMSI') -ne [Microsoft.Win32.RegistryValueKind]::DWord) { throw 'Unexpected DisableMSI registry type' }
                      $state.Value = $key.GetValue('DisableMSI')
                      if ($state.Value -notin @(0,1,2)) { throw 'Unexpected DisableMSI registry value' }
                  }
              } finally { $key.Close() }
          }
          # Persist the original state before the first mutation, including setup failures.
          $state | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8 -ErrorAction Stop
          "DisableMSI baseline: key=$keyExists present=$($state.ValueExisted) value=$($state.Value)" | Tee-Object msi-policy.log
          if (-not $keyExists) { New-Item -Path $policy -Force -ErrorAction Stop | Out-Null }
          New-ItemProperty -LiteralPath $policy -Name DisableMSI -Value 0 -PropertyType DWord -Force -ErrorAction Stop | Out-Null
          if ((Get-ItemPropertyValue -LiteralPath $policy -Name DisableMSI -ErrorAction Stop) -ne 0) { throw 'DisableMSI test configuration did not take effect' }
          'Disposable test environment: DisableMSI=0 permits standard-user unmanaged installation' | Tee-Object -Append msi-policy.log
          exit 0
      - name: private non-admin installation and cross-tool compatibility
        shell: pwsh
        timeout-minutes: 8
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -CheckTools -PythonPath (Get-Command python.exe -ErrorAction Stop).Source -NodePath (Get-Command node.exe -ErrorAction Stop).Source -SdkSmokes (Resolve-Path sdk-smokes-ready).Path -ResultDirectory user-runtime-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Per-user release verification exited $LASTEXITCODE" }
      - name: private non-admin predecessor upgrade and reinstall
        shell: pwsh
        timeout-minutes: 12
        run: |
          $version = '${{ inputs.version }}'.Substring(1)
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -PredecessorMsiPath (Resolve-Path predecessor/abstraction-x64.msi).Path -PredecessorSHA256 $env:PREDECESSOR_SHA256 -PredecessorVersion $env:PREDECESSOR_VERSION -ExpectedVersion $version -ResultDirectory user-upgrade-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Per-user upgrade verification exited $LASTEXITCODE" }

      # ----- the command nobody names a scope on -----------------------------
      #
      # `msiexec /i /qn` with no ALLUSERS or MSIINSTALLPERUSER is what a script
      # writes. The Property table carries ALLUSERS=2, and the install folder and
      # the components resolve their scope separately; if they disagree the
      # package lands half in each scope. This leg asks that of a real install.
      #
      # It runs as the disposable standard account, like the per-user checks
      # above and while their consumer MSI policy is in effect. From that account
      # the package must choose one scope and do all of it: per-user files, PATH,
      # Startup shortcut, one per-user registration and readiness, nothing of the
      # machine arm, then remove all of it.
      #
      # From an elevated administrator the same command resolves per-user, and
      # activation refuses an elevated token. The next step holds that case.
      - name: private non-admin upgrade of a predecessor in a non-default folder
        shell: pwsh
        timeout-minutes: 12
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -PredecessorMsiPath (Resolve-Path predecessor/abstraction-x64.msi).Path -PredecessorSHA256 $env:PREDECESSOR_SHA256 -PredecessorVersion $env:PREDECESSOR_VERSION -ExpectedVersion $env:CANDIDATE_VERSION -PredecessorElsewhere -ResultDirectory user-elsewhere-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Non-default-folder upgrade verification exited $LASTEXITCODE" }
      # Rollback must reactivate the predecessor's supervisor before msiexec returns.

      - name: private non-admin forced failed upgrade rolls back to the running predecessor
        shell: pwsh
        timeout-minutes: 12
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -PredecessorMsiPath (Resolve-Path predecessor/abstraction-x64.msi).Path -PredecessorSHA256 $env:PREDECESSOR_SHA256 -PredecessorVersion $env:PREDECESSOR_VERSION -ExpectedVersion $env:CANDIDATE_VERSION -FailUpgrade -ResultDirectory user-failed-upgrade-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Forced failed upgrade verification exited $LASTEXITCODE" }
      # The candidate as its own predecessor: a registered host that ran 60
      # seconds is restarted by Restart Manager when the failed transaction ends.

      - name: private non-admin same-version forced failure restarts the host
        shell: pwsh
        timeout-minutes: 12
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -FailSameVersion -ResultDirectory user-same-version-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Same-version forced failure verification exited $LASTEXITCODE" }

      - name: an unscoped install lands in one scope, not half of each
        shell: pwsh
        timeout-minutes: 8
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -Unscoped -ResultDirectory user-unscoped-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Unscoped non-admin install verification exited $LASTEXITCODE" }

      # ----- an elevated install with no scope named ------------------------
      #
      # This runner's full administrator token runs the same unscoped command.
      # ALLUSERS=2 with MSIINSTALLPERUSER=1 resolves per-user, and per-user
      # activation refuses an elevated token. 0.1.6 copied the files and then
      # failed 1722/1603. The package now refuses before costing and names both
      # remedies, so nothing is copied, registered or started.
      - name: the collected per-user logs prove the upgrade order, the formatted folder and a finished removal
        shell: pwsh
        run: |
          $upgrade = 'user-upgrade-diagnostics/user-install.log|user-elsewhere-diagnostics/user-install.log'
          $removal = 'user-runtime-diagnostics/user-uninstall.log|user-upgrade-diagnostics/user-uninstall.log|user-elsewhere-diagnostics/user-uninstall.log|user-same-version-diagnostics/same-version-uninstall.log|user-unscoped-diagnostics/user-uninstall.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode CheckLogs -UpgradeLogs $upgrade -RemovalLogs $removal | Tee-Object hosted-log-checks.txt
          if ($LASTEXITCODE -ne 0) { throw "Collected per-user log checks exited $LASTEXITCODE" }

      - name: an elevated unscoped install is refused before anything is copied
        shell: pwsh
        timeout-minutes: 5
        run: |
          $msi = (Resolve-Path pkg\abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', '/norestart', '/l*v', 'elevated-unscoped.log')
          $log = Get-Content -LiteralPath elevated-unscoped.log -Raw -Encoding Unicode
          if ($p.ExitCode -ne 1603) { throw "an elevated install with no scope named exited $($p.ExitCode); the refusal returns 1603" }
          if ($log -notmatch 'Doing action: RefuseElevatedPerUserInstall\r?\n') { throw 'the elevated per-user refusal did not run' }
          if ($log -notmatch [regex]::Escape('pass ALLUSERS=1 to install for everyone')) { throw 'the refusal did not name its remedies' }
          foreach ($action in 'CostInitialize', 'InstallValidate', 'InstallInitialize', 'InstallFiles', 'StartUserRuntime') {
            if ($log -match "Doing action: $action\r?\n") { throw "the refused install still ran $action" }
          }
          foreach ($path in @((Join-Path $env:LOCALAPPDATA 'Programs\OpenAbstractions'), (Join-Path $env:ProgramFiles 'OpenAbstractions'),
                              'HKCU:\Software\OpenAbstractions', 'HKLM:\Software\OpenAbstractions',
                              (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\Abstraction supervisor.lnk'))) {
            if (Test-Path -LiteralPath $path) { throw "the refused install left $path" }
          }
          'ok    an elevated install with no scope named was refused before costing and left nothing behind'
          exit 0
      - name: restore disposable consumer MSI policy
        if: always()
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'MSI policy fixture requires a disposable GitHub Windows runner' }
          if ((Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).ProductType -ne 3) { throw 'MSI policy fixture requires Windows Server' }
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          $statePath = Join-Path $env:RUNNER_TEMP 'oa-msi-policy.json'
          if (-not (Test-Path -LiteralPath $statePath -ErrorAction Stop)) { 'No MSI policy mutation was recorded'; exit 0 }
          $state = Get-Content -LiteralPath $statePath -Raw -ErrorAction Stop | ConvertFrom-Json
          if ($state.KeyExisted -isnot [bool] -or $state.ValueExisted -isnot [bool] -or ($state.ValueExisted -and (-not $state.KeyExisted -or $state.Value -notin @(0,1,2)))) { throw 'Invalid MSI policy baseline' }
          if ($state.ValueExisted) {
              New-ItemProperty -LiteralPath $policy -Name DisableMSI -Value $state.Value -PropertyType DWord -Force -ErrorAction Stop | Out-Null
          } elseif (Test-Path -LiteralPath $policy -ErrorAction Stop) {
              $key = Get-Item -LiteralPath $policy -ErrorAction Stop
              try { $present = $key.GetValueNames() -contains 'DisableMSI' } finally { $key.Close() }
              if ($present) { Remove-ItemProperty -LiteralPath $policy -Name DisableMSI -ErrorAction Stop }
          }
          if (Test-Path -LiteralPath $policy -ErrorAction Stop) {
              $key = Get-Item -LiteralPath $policy -ErrorAction Stop
              try {
                  $present = $key.GetValueNames() -contains 'DisableMSI'
                  if ($present -ne $state.ValueExisted) { throw 'DisableMSI presence was not restored' }
                  if ($present -and ($key.GetValueKind('DisableMSI') -ne [Microsoft.Win32.RegistryValueKind]::DWord -or $key.GetValue('DisableMSI') -ne $state.Value)) { throw 'DisableMSI value was not restored' }
                  $empty = $key.GetValueNames().Count -eq 0 -and $key.GetSubKeyNames().Count -eq 0
              } finally { $key.Close() }
              if (-not $state.KeyExisted) {
                  if (-not $empty) { throw 'Refusing to remove a policy key with unrelated values' }
                  Remove-Item -LiteralPath $policy -ErrorAction Stop
              }
          } elseif ($state.KeyExisted) { throw 'Original MSI policy key disappeared' }
          $state.Restored = $true
          $state | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8 -ErrorAction Stop
          'DisableMSI baseline restored and verified' | Tee-Object -Append msi-policy.log
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-per-user-diagnostics-${{ github.run_attempt }}
          path: |
            user-runtime-diagnostics/
            user-upgrade-diagnostics/
            user-elsewhere-diagnostics/
            user-failed-upgrade-diagnostics/
            user-same-version-diagnostics/
            user-unscoped-diagnostics/
            hosted-log-checks.txt
            predecessor-source.json
            msi-policy.log
            ${{ runner.temp }}/oa-msi-policy.json

      # ----- for everyone ----------------------------------------------------
      #
      # This is the leg that never ran. A GitHub runner is an administrator and
      # a workstation is not, which is exactly why this belongs here: the
      # machine scope cannot be proved on the machine the package is written on.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          path: session-fixture

      - name: machine forced failed upgrade rolls back to the predecessor
        id: machine-failed-upgrade
        shell: pwsh
        timeout-minutes: 20
        run: |
          $predecessor = (Resolve-Path predecessor\abstraction-x64.msi).Path
          $failing = (Resolve-Path failing\abstraction-x64.msi).Path
          # This image is bound to the pinned, checksum-verified 0.2.0 MSI.
          if ($env:PREDECESSOR_VERSION -ne '0.2.0') { throw 'Review the predecessor service image when changing the pinned MSI' }
          $predecessorImage = 'openabstractionsw.exe'
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($predecessor, 0)
          $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property``='ProductCode'")
          [void]$view.Execute(); $code = $view.Fetch().StringData(1); [void]$view.Close()
          "predecessor=$code" >> $env:GITHUB_OUTPUT
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $predecessor, '/qn', '/norestart', 'ALLUSERS=1', 'MSIINSTALLPERUSER=', '/l*v', 'machine-predecessor-install.log')
          if ($p.ExitCode -ne 0) { throw "machine predecessor install exited $($p.ExitCode)" }
          $statePath = "$env:RUNNER_TEMP/oa-predecessor-session.json"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File session-fixture/test_service_session.ps1 -Mode Verify -StatePath $statePath -ExpectedImage $predecessorImage
          if ($LASTEXITCODE -ne 0) { throw "Predecessor session fixture exited $LASTEXITCODE" }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          function Get-SessionInstances {
            @(Get-CimInstance Win32_Service -Filter "Name LIKE 'OpenAbstractionsSupervisor_%'" | Where-Object {
              $_.State -eq 'Running' -and $_.ProcessId -ne 0 -and
              @(Get-CimInstance Win32_Process -Filter "ProcessId=$($_.ProcessId)" | Where-Object SessionId -eq $state.Session).Count
            })
          }
          $before = @(Get-SessionInstances)
          if ($before.Count -ne 1) { throw "expected one running instance in the second session $($state.Session) before the failing upgrade; observed $($before.Count)" }
          "instance before the failing upgrade: $($before[0].Name) pid $($before[0].ProcessId) in session $($state.Session)"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $failing, '/qn', '/norestart', 'ALLUSERS=1', 'MSIINSTALLPERUSER=', '/l*v', 'machine-failed-upgrade.log')
          if ($p.ExitCode -ne 1603) { throw "the forced machine upgrade failure exited $($p.ExitCode); it must end with 1603" }
          $log = Get-Content -LiteralPath machine-failed-upgrade.log -Raw -Encoding Unicode
          $files = [regex]::Match($log, 'Action start [^\r\n]*: InstallFiles\.')
          $failure = [regex]::Match($log, 'Action start [^\r\n]*: ForcedUpgradeFailure\.')
          if (-not $files.Success -or -not $failure.Success -or $failure.Index -lt $files.Index) { throw 'the forced failure did not follow the new files' }
          if ([regex]::IsMatch($log, 'StopPrevious(User)?Supervisor')) { throw 'the package ran a stop action; it stops nothing' }
          if ([regex]::IsMatch($log, 'Action start [^\r\n]*: RemoveExistingProducts\.')) { throw 'the failed machine upgrade removed the predecessor; the removal must follow the commit it never reached' }
          if ($log.IndexOf('RestartPreviousSupervisor', $failure.Index) -lt 0) { throw 'rollback did not run the machine activation' }
          Select-String -LiteralPath machine-failed-upgrade.log -Encoding Unicode -Pattern 'RESTART MANAGER' | ForEach-Object Line
          if ($installer.ProductState($code) -ne 5) { throw 'rollback did not leave the machine predecessor installed' }
          & sc.exe qc OpenAbstractionsSupervisor | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "rollback did not restore the predecessor service template: sc qc exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path (Join-Path $env:ProgramFiles 'OpenAbstractions\tools') $predecessorImage))) { throw 'rollback did not restore the predecessor programs' }
          $record = Join-Path $env:ProgramData 'abstraction\upgrade-v1\exclusion.json'
          if (Test-Path -LiteralPath $record) { throw "the machine upgrade exclusion survived rollback: $record" }
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $after = @(Get-SessionInstances | Where-Object Name -eq $before[0].Name)
            if ($after.Count -eq 1) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if ($after.Count -ne 1) { throw "the predecessor instance $($before[0].Name) in session $($state.Session) is not running after rollback" }
          $restarted = [int]$after[0].ProcessId -ne [int]$before[0].ProcessId
          "instance after rollback: $($after[0].Name) pid $($after[0].ProcessId) ($(if ($restarted) { 'restarted' } else { 'the same process: Restart Manager did not stop it' }))"
          "machine-instance-restarted=$restarted" >> $env:GITHUB_STEP_SUMMARY
          'ok    a failed machine upgrade left the predecessor installed, registered, with no exclusion and its session instance running'
          exit 0

      - name: remove the predecessor test session
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          if (Test-Path session-fixture/test_service_session.ps1) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File session-fixture/test_service_session.ps1 -Mode Cleanup -StatePath "$env:RUNNER_TEMP/oa-predecessor-session.json" 2>&1 | Tee-Object predecessor-session-cleanup.log
            if ($LASTEXITCODE -ne 0) { throw "Predecessor session cleanup exited $LASTEXITCODE" }
          }
          exit 0

      - name: machine upgrade holds the exclusion, stops nothing, and removes the predecessor after the commit
        id: machine-install
        shell: pwsh
        timeout-minutes: 10
        run: |
          $msi = (Resolve-Path pkg\abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', '/norestart', 'ALLUSERS=1', 'MSIINSTALLPERUSER=', '/l*v', 'machine-install.log')
          if ($p.ExitCode -ne 0) {
            Select-String -Path machine-install.log -Pattern 'Return value 3','Error [0-9]+','CustomAction .* returned' -Context 12,4 | Out-String -Width 300 | Write-Output
            throw "machine upgrade exited $($p.ExitCode)"
          }
          $log = Get-Content -LiteralPath machine-install.log -Raw -Encoding Unicode
          $removal = [regex]::Match($log, 'Action start [^\r\n]*: RemoveExistingProducts\.')
          if (-not $removal.Success) { throw 'the machine upgrade never removed the predecessor' }
          $before = $log.Substring(0, $removal.Index)
          foreach ($action in 'BeginMachineUpgradeExclusion', 'InstallExecute') {
            if ($before -notmatch "Action ended [^\r\n]*: $action\. Return value 1\.") { throw "$action did not succeed before RemoveExistingProducts" }
          }
          # The predecessor's nested uninstall records skipped legacy actions.
          # Forbid any stop action in this transaction and any execution in either.
          if ([regex]::IsMatch($before, 'StopPrevious(User)?Supervisor') -or
              [regex]::IsMatch($log, '(?m)^Action start [^\r\n]*: StopPrevious(User)?Supervisor\.')) {
            throw 'the package ran a stop action; it stops nothing'
          }
          if ($log -notmatch 'EndMachineUpgradeExclusion') { throw 'the machine exclusion release was not scheduled' }
          # The removal follows the commit, and the predecessor's own uninstall
          # deletes the shared service name, so registration must come after it.
          $finalize = [regex]::Match($log, 'Action start [^\r\n]*: InstallFinalize\.')
          if (-not $finalize.Success -or $removal.Index -lt $finalize.Index) { throw 'the machine upgrade removed the predecessor before its own commit' }
          if ($log.Substring($removal.Index) -notmatch "Action ended [^\r\n]*: RegisterSupervisorAfterRemoval\. Return value 1\.") { throw 'the machine supervisor was not registered after the predecessor removal' }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          if ($installer.ProductState('${{ steps.machine-failed-upgrade.outputs.predecessor }}') -eq 5) { throw 'the machine predecessor is still installed after upgrade' }
          if (Test-Path -LiteralPath (Join-Path $env:ProgramData 'abstraction\upgrade-v1\exclusion.json')) { throw 'the machine upgrade exclusion survived commit' }
          'ok    the machine upgrade held its exclusion, stopped nothing itself, released the exclusion and registered the host after the removal'
          exit 0

      - name: what a per-machine install did, and what it must not have done
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'OpenAbstractions'
          $tools = Join-Path $dir 'tools'
          if (-not (Test-Path $tools)) { throw "a per-machine install did not land in $tools" }
          foreach ($f in 'openabstractions.exe','openabstractionsw.exe','Abstraction Panel.exe') {
            if (-not (Test-Path (Join-Path $tools $f))) { throw "$f was not installed" }
          }
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          if ((Get-ItemProperty $key -Name Path).Path -notlike "*$tools*") { throw "the machine PATH does not carry $tools" }
          if (-not (Test-Path 'HKLM:\Software\OpenAbstractions\Abstraction')) { throw 'the machine registry key was not written' }

          # %ProgramData% grants BUILTIN\Users create-file by inheritance, and
          # config refuses a machine file no administrator owns. The component
          # replaces the inherited ACL; if it stops doing so, the machine rung
          # becomes squattable and nothing else says so.
          $cfg = Join-Path $env:ProgramData 'abstraction'
          if (-not (Test-Path $cfg)) { throw 'the machine config folder was not created' }
          $bad = (Get-Acl $cfg).Access | Where-Object {
            $_.IdentityReference -like '*\Users' -and $_.FileSystemRights -match 'CreateFiles|Write|FullControl|Modify'
          }
          if ($bad) { $bad | Format-List; throw 'Users can write into the machine config folder, so the machine rung can be squatted' }

          # The per-user arm must not also have fired. Both arms installing is
          # the same defect as neither: the scope stopped meaning anything.
          if (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\Abstraction supervisor.lnk')) {
            throw 'a per-machine install also created the Startup shortcut, which is the per-user arm. Both arms fired, so ALLUSERS is not deciding between them.'
          }
          'ok    programs in Program Files, a machine PATH entry, a protected config folder, and no Startup shortcut'

      - name: the supervisor is registered, and registered as what it claims
        shell: pwsh
        run: |
          $qc = & sc.exe qc OpenAbstractionsSupervisor
          $qc
          if ($LASTEXITCODE -ne 0) {
            throw "sc qc exited $LASTEXITCODE. The install reported success and registered no supervisor: the Background supervisor feature promises a service for everyone, and there is none."
          }
          $text = $qc -join "`n"
          if ($text -notmatch 'TYPE\s*:\s*50\s+USER_OWN_PROCESS\s+TEMPLATE') {
            throw 'the service is not a SERVICE_USER_OWN_PROCESS template. Any other type is a service running as someone, and this design stores no password because it runs as whoever signs in.'
          }
          if ($text -notmatch 'START_TYPE\s*:\s*2\s+AUTO_START') { throw 'the template is not AUTO_START, so nothing clones it at sign-in' }
          if ($text -notmatch 'openabstractionsw\.exe" serve supervisor --service') {
            throw 'the registered image is not openabstractionsw.exe serve supervisor --service. openabstractions.exe is the console image, and the loader gives a console image a window in the session it runs in â€” a window at every sign-in is what this whole mechanism removed.'
          }

          # The restart is the entire reason this is a service and not a
          # shortcut. A template with no recovery policy is the Startup shortcut
          # with extra steps.
          $qf = (& sc.exe qfailure OpenAbstractionsSupervisor) -join "`n"
          $qf
          if ($qf -notmatch 'RESET_PERIOD[^:]*:\s*3600') { throw 'the reset period is not 3600, so three restarts are a budget for the life of the machine rather than a crash-loop brake' }
          foreach ($ms in 3000, 10000, 30000) {
            if ($qf -notmatch "RESTART -- Delay = $ms milliseconds") { throw "the $ms ms restart action is not configured" }
          }
          $qff = (& sc.exe qfailureflag OpenAbstractionsSupervisor) -join "`n"
          $qff
          if ($qff -notmatch 'FAILURE_ACTIONS_ON_NONCRASH_FAILURES\s*:\s*TRUE') {
            throw 'recovery fires only on a process that died without reporting SERVICE_STOPPED. A supervisor that reports a tidy stop after failing to open its store is the case we most want restarted.'
          }
          'ok    a USER_OWN_PROCESS template, auto-start, pointing at openabstractionsw.exe serve supervisor --service, with three restarts and the non-crash flag'

      - name: fresh interactive session and crash recovery
        id: instance
        shell: pwsh
        timeout-minutes: 5
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File session-fixture/test_service_session.ps1 -Mode Verify -StatePath "$env:RUNNER_TEMP/oa-service-session.json"
          if ($LASTEXITCODE -ne 0) { throw "Fresh logon/recovery fixture exited $LASTEXITCODE" }
          "state=proven" >> $env:GITHUB_OUTPUT
          exit 0

      # The host records its token's TokenElevation and TokenElevationType at
      # start. Kept as evidence of what token a per-user service instance runs
      # with; it decides nothing here.
      - name: the session host's startup diagnostics
        if: always()
        shell: pwsh
        run: |
          $statePath = "$env:RUNNER_TEMP/oa-service-session.json"
          if (-not (Test-Path -LiteralPath $statePath)) { 'no session was created'; exit 0 }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          $profile = @(Get-CimInstance Win32_UserProfile | Where-Object { $_.SID -eq $state.Sid } | ForEach-Object LocalPath)
          $log = if ($profile.Count -eq 1) { Join-Path $profile[0] 'AppData\Local\openabstractions\host\host.log' } else { $null }
          if (-not $log -or -not (Test-Path -LiteralPath $log)) { "host.log absent for the session account"; exit 0 }
          Copy-Item -LiteralPath $log -Destination machine-host.log
          Select-String -LiteralPath $log -Pattern 'serve supervisor start' | ForEach-Object Line
          exit 0

      - name: uninstall for everyone
        if: always() && steps.machine-install.outcome == 'success'
        shell: pwsh
        run: |
          $msi = (Resolve-Path pkg\abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/x', $msi, '/qn', '/norestart', '/l*v', 'machine-uninstall.log')
          if ($p.ExitCode -ne 0) { Get-Content machine-uninstall.log -Tail 60; throw "msiexec /x exited $($p.ExitCode)" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File user-fixture/test_user_runtime.ps1 -Mode CheckLogs -RemovalLogs machine-uninstall.log
          if ($LASTEXITCODE -ne 0) { throw "Machine removal log check exited $LASTEXITCODE" }
          & sc.exe qc OpenAbstractionsSupervisor | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'the service template survived uninstall' }
          if ($LASTEXITCODE -ne 1060) { throw "sc qc could not establish service absence: exit $LASTEXITCODE" }

          # Deleting the template does not delete the instances the service
          # manager cloned from it: the owner's own probe outlived sc delete and
          # stayed AUTO_START. An uninstall that leaves one leaks a service per
          # account that has ever signed in.
          $left = @(Get-Service -Name 'OpenAbstractionsSupervisor_*' -ErrorAction SilentlyContinue)
          if ($left.Count -ne 0) { $left | Format-List Name, Status; throw 'a per-session instance survived uninstall' }
          if (Test-Path (Join-Path $env:ProgramFiles 'OpenAbstractions')) { throw 'the install folder survived uninstall' }
          if (Test-Path 'HKLM:\Software\OpenAbstractions') { throw 'the machine registry key survived uninstall' }
          if (Test-Path (Join-Path $env:ProgramData 'abstraction')) { throw 'the machine config folder survived uninstall' }
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          if ((Get-ItemProperty $key -Name Path).Path -like '*OpenAbstractions*') { throw 'the machine PATH entry survived uninstall' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File session-fixture/test_service_session.ps1 -Mode VerifyRemoved -StatePath "$env:RUNNER_TEMP/oa-service-session.json"
          if ($LASTEXITCODE -ne 0) { throw "Runtime removal verification exited $LASTEXITCODE" }
          'ok    uninstall reversed it: no template, no instance, no folder, no key, no config folder, no PATH entry'
          exit 0

      - name: remove the machine predecessor left by a failed step
        if: always() && steps.machine-failed-upgrade.outputs.predecessor != ''
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          if ($installer.ProductState('${{ steps.machine-failed-upgrade.outputs.predecessor }}') -eq 5) {
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/x', '${{ steps.machine-failed-upgrade.outputs.predecessor }}', '/qn', '/norestart', '/l*v', 'machine-predecessor-cleanup.log')
            if ($p.ExitCode -ne 0) { throw "machine predecessor cleanup exited $($p.ExitCode)" }
          }
          exit 0

      - name: remove only the disposable test session
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          if (Test-Path session-fixture/test_service_session.ps1) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File session-fixture/test_service_session.ps1 -Mode Cleanup -StatePath "$env:RUNNER_TEMP/oa-service-session.json" 2>&1 | Tee-Object service-session-cleanup.log
            if ($LASTEXITCODE -ne 0) { throw "Session cleanup exited $LASTEXITCODE" }
          }
          exit 0

      - name: preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-logs-${{ github.run_attempt }}
          path: |
            user-install.log
            user-uninstall.log
            machine-install.log
            machine-failed-upgrade.log
            machine-predecessor-install.log
            machine-predecessor-cleanup.log
            predecessor-session-cleanup.log
            machine-host.log
            machine-uninstall.log
            service-session.log
            service-session-cleanup.log
            elevated-unscoped.log
          if-no-files-found: ignore

  linux:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: candidate
    outputs:
      package-artifact: ${{ steps.artifact-names.outputs.package }}
      package-artifact-id: ${{ steps.packages.outputs.artifact-id }}
      package-artifact-digest: ${{ steps.packages.outputs.artifact-digest }}
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
      GOTOOLCHAIN: local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - name: name this attempt's package artifact
        id: artifact-names
        run: printf 'package=abstraction-linux-unsigned-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # The same Go as the windows and macos jobs; see the windows job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          go version | tee go-version.txt
          git rev-parse HEAD

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-version-linux-${{ github.run_attempt }}
          path: go-version.txt
          if-no-files-found: error

      # The repository first, the proxy second, for the reason the windows job
      # states: a cache that never forgets cannot say whether a tag exists.
      - name: verify and record published module provenance
        run: python3 scripts/module_provenance.py --tools tools.tsv --output module-provenance.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-provenance-${{ runner.os }}-${{ github.run_attempt }}
          path: module-provenance.json
          if-no-files-found: error

      - name: native POSIX shell fixtures
        shell: bash
        run: |
          python3 posix/test_lifecycle.py

      - name: build from the published modules
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOFLAGS: -trimpath
        run: |
          python3 scripts/release_tsv_rows.py tools.tsv --output tools.rows
          root=$PWD
          for arch in amd64 arm64; do
            while IFS= read -r -d '' path && IFS= read -r -d '' module &&
                  IFS= read -r -d '' package && IFS= read -r -d '' feature &&
                  IFS= read -r -d '' subsystem; do
              if [ "$subsystem" = windows ]; then
                printf 'note  %s is a windows-subsystem image and is not in a Linux package\n' "$path"
                continue
              fi
              mod=${module%@*}
              version=${module##*@}
              case "$package" in
                .) target="$mod@$version" ;;
                *) target="$mod/$package@$version" ;;
              esac
              gobin="$(go env GOPATH)/bin"
              for pass in a b; do
                mkdir -p "$root/$pass/$arch"
                rm -rf "$gobin"
                GOARCH="$arch" go install -ldflags '-s -w -buildid=' "$target"
                built=$(find "$gobin" -type f)
                n=$(printf '%s\n' "$built" | sed '/^$/d' | wc -l)
                if [ "$n" -ne 1 ]; then
                  printf 'FAIL  %s produced %s binaries, expected 1\n' "$target" "$n"
                  exit 1
                fi
                mv "$built" "$root/$pass/$arch/${path%.exe}"
              done
              printf 'built %s %s from %s\n' "$arch" "${path%.exe}" "$target"
            done < tools.rows
          done

      - name: reproducible
        run: |
          rc=0
          n=0
          for f in a/*/*; do
            n=$((n + 1))
            if cmp -s "$f" "b/${f#a/}"; then
              printf 'ok    %s is byte-identical across two builds of one module version\n' "${f#a/}"
            else
              printf 'FAIL  %s differs between two builds of one module version\n' "${f#a/}"
              rc=1
            fi
          done
          if [ "$n" -lt 2 ]; then
            printf 'FAIL  binaries â€” %s inputs, and this rule cannot fail on fewer than 2\n' "$n"
            exit 1
          fi
          exit $rc

      # No --src. The Python packages posix/payload.tsv can also carry are
      # published on their own registry; a redistributable holding a second copy
      # of them would be one file with two homes. build.py names every row it
      # leaves out for that reason, and stops if a program is ever one of them.
      - name: package
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          version=$CANDIDATE_VERSION
          mkdir -p dist
          for arch in amd64 arm64; do
            python3 posix/build.py --platform linux --arch "$arch" --version "$version" \
              --out dist --bin "a/$arch" --license LICENSE
          done
          ls -l dist

      - name: digests
        run: |
          n=$(ls dist/*.tar.gz | wc -l)
          if [ "$n" -lt 2 ]; then
            printf 'FAIL  packages â€” %s inputs, and this rule cannot fail on fewer than 2\n' "$n"
            exit 1
          fi
          (cd dist && sha256sum ./*.tar.gz | sed 's#\./##' | tee SHA256SUMS.linux)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: packages
        with:
          name: ${{ steps.artifact-names.outputs.package }}
          path: dist/
          if-no-files-found: error

  linux-verify:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: [candidate, linux]
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - name: fetch the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_ARTIFACT: ${{ needs.linux.outputs.package-artifact }}
          ARTIFACT_ID: ${{ needs.linux.outputs.package-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.linux.outputs.package-artifact-digest }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "$PACKAGE_ARTIFACT" --source "$CANDIDATE_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --out pkg

      - name: the checksum file is true
        run: (cd pkg && sha256sum -c SHA256SUMS.linux)

      # A hosted runner has no systemd user manager, so install.sh takes its
      # documented other path and says so. That is the half a person without
      # systemd gets, and it is the half this job can prove.
      - name: install
        run: |
          tar xzf pkg/*-linux-amd64.tar.gz -C /tmp
          d=$(find /tmp -maxdepth 1 -type d -name 'abstraction-*-linux-amd64')
          "$d/install.sh"

      - name: what it installed
        run: |
          [ -x "$HOME/.local/bin/openabstractions" ] || { printf 'FAIL  openabstractions was not installed\n'; exit 1; }
          for f in jobd dl jobctl; do
            [ -e "$HOME/.local/bin/$f" ] && { printf 'FAIL  %s was removed in 0.2.0 and was installed\n' "$f"; exit 1; }
          done
          [ -f "$HOME/.local/share/abstraction/MANIFEST" ] || { printf 'FAIL  no MANIFEST, so uninstall.sh cannot know what to remove\n'; exit 1; }
          [ -x "$HOME/.local/share/abstraction/uninstall.sh" ] || { printf 'FAIL  no uninstall.sh\n'; exit 1; }
          [ -f "$HOME/.local/share/abstraction/LICENSE" ] || { printf 'FAIL  no LICENSE in the package\n'; exit 1; }
          printf 'ok    openabstractions, a MANIFEST, an uninstaller and a licence\n'
          cat "$HOME/.local/share/abstraction/MANIFEST"

      - name: uninstall
        run: |
          "$HOME/.local/share/abstraction/uninstall.sh"
          left=0
          [ -e "$HOME/.local/bin/openabstractions" ] && { printf 'FAIL  openabstractions survived uninstall\n'; left=1; }
          [ -e "$HOME/.local/share/abstraction" ] && { printf 'FAIL  the share directory survived uninstall\n'; ls -la "$HOME/.local/share/abstraction"; left=1; }
          [ -e "$HOME/.config/systemd/user/abstraction-runtime.service" ] && { printf 'FAIL  the runtime unit survived uninstall\n'; left=1; }
          [ "$left" = 0 ] || exit 1
          printf 'ok    uninstall reversed it: no program, no unit, no share directory\n'

  # Both paths assemble the same payload. The signed path seals Panel.app
  # after assembly and then signs and notarises the installer. Gatekeeper
  # refuses an unsigned, unnotarised .pkg, so attaching one is a download that
  # cannot be opened, and a platform quietly missing from a release page is the
  # defect this whole file exists to prevent. So an unsigned run keeps the
  # package as a workflow artifact and says UNPROVEN in the summary and in the
  # release notes; a signed run attaches it and says which it was.
      - name: begin disposable lifecycle evidence
        run: printf '%s\n' '{"installed_lifecycle":"pending"}' > pkg/package-verification.json

      - name: Linux disposable-account installed lifecycle
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ "${RUNNER_OS:-}" = Linux ] || { echo 'Disposable GitHub Linux runner required'; exit 1; }
          account=oa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          case "$account" in oa-ci-[0-9]*-[0-9]*) ;; *) exit 1;; esac
          if getent passwd "$account" >/dev/null; then echo 'Test account already exists'; exit 1; fi
          sudo useradd --user-group --create-home --shell /bin/sh "$account"
          uid=$(id -u "$account")
          printf '%s %s\n' "$account" "$uid" > "$RUNNER_TEMP/oa-posix-account"
          home=/home/$account
          sudo mkdir "$home/package" "$home/fixtures"
          sudo tar -xzf "pkg/abstraction-$CANDIDATE_VERSION-linux-amd64.tar.gz" -C "$home/package" --no-same-owner
          sudo cp -R posix/. "$home/fixtures/"
          sudo chown -R "$account:$account" "$home/package" "$home/fixtures"
          sudo loginctl enable-linger "$account"
          sudo systemctl start "user@$uid.service"
          user() { sudo -u "$account" env HOME="$home" XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" "$@"; }
          start_fixture_origin() {
            origin_unit="oa-candidate-origin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
            user timeout --kill-after=2s 10s systemd-run --user --quiet --collect --unit="$origin_unit" \
              python3 -m http.server 8099 --bind 127.0.0.1 --directory "$home/download-origin"
            trap stop_fixture_origin EXIT
          }
          stop_fixture_origin() {
            trap - EXIT
            [ -z "${origin_unit:-}" ] || user timeout --kill-after=2s 10s systemctl --user stop "$origin_unit"
            origin_unit=
          }
          configure_disposable_runtime_environment() {
            [ "$(id -u "$account")" = "$uid" ] || { echo 'Disposable account identity changed'; return 1; }
            expected=/run/user/$uid
            [ "$(stat -c '%F %u %a' "$expected")" = "directory $uid 700" ] || { echo 'Private account runtime directory unavailable'; return 1; }
            # Hosted Ubuntu globally exports the runner's XDG_RUNTIME_DIR (runner-images#14649).
            # Correct only this new account's manager; direct sudo env does not reach services.
            before=$(user timeout --kill-after=2s 10s systemctl --user show-environment | sed -n 's/^XDG_RUNTIME_DIR=//p') || return 1
            printf 'Disposable manager runtime directory: %s -> %s\n' "$before" "$expected"
            user timeout --kill-after=2s 10s systemctl --user set-environment "XDG_RUNTIME_DIR=$expected" || return 1
            after=$(user timeout --kill-after=2s 10s systemctl --user show-environment | sed -n 's/^XDG_RUNTIME_DIR=//p') || return 1
            [ "$after" = "$expected" ] || { echo 'Disposable manager runtime environment was not established'; return 1; }
          }
          {
            configure_disposable_runtime_environment
            user sh "$home/fixtures/test_systemd.sh" --run
            user mkdir -p "$home/.abstraction"
            user sh -c 'printf preserved > "$HOME/.abstraction/candidate-data"'
            user sh "$home/package/abstraction-$CANDIDATE_VERSION-linux-amd64/install.sh"
            user test -x "$home/.local/bin/openabstractions"
            for program in jobd dl jobctl; do user test ! -e "$home/.local/bin/$program"; done
            user "$home/.local/bin/openabstractions" status --timeout 5s
            # A download through the runtime, with no store named: the runtime
            # fetches and verifies, the command copies the result out, and jobs
            # show observes the same operation.
            user mkdir -p "$home/download-origin" "$home/download-out"
            user sh -c 'printf "bytes through the runtime" > "$HOME/download-origin/thing.bin"'
            start_fixture_origin
            for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:8099/thing.bin && break; sleep 0.2; done
            user "$home/.local/bin/openabstractions" download http://127.0.0.1:8099/thing.bin --out "$home/download-out" --json --timeout 60s > "$RUNNER_TEMP/download.json"
            stop_fixture_origin
            user cmp "$home/download-out/thing.bin" "$home/download-origin/thing.bin"
            operation=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt"]["operation_id"])' "$RUNNER_TEMP/download.json")
            [ -n "$operation" ]
            user "$home/.local/bin/openabstractions" jobs show "$operation" --json | python3 -c 'import json,sys; s=json.load(sys.stdin)["snapshot"]; sys.exit(0 if s["state"] == "complete" and s["receipt"]["operation_id"] == sys.argv[1] else 1)' "$operation"
            user sh "$home/.local/share/abstraction/uninstall.sh"
            user test ! -e "$home/.local/bin/openabstractions"
            user test ! -e "$home/.config/systemd/user/abstraction-runtime.service"
            [ "$(user cat "$home/.abstraction/candidate-data")" = preserved ]
            echo 'PASS Linux installed runtime readiness, a download through the runtime, native stop/removal and user-data preservation'
          } 2>&1 | tee pkg/linux-installed-lifecycle.log
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('pkg/package-verification.json')
          evidence = json.loads(p.read_text())
          evidence['installed_lifecycle'] = 'passed_disposable_user_systemd'
          p.write_text(json.dumps(evidence, indent=2))
          PY

      - name: capture disposable Linux runtime diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state=$RUNNER_TEMP/oa-posix-account
          [ -f "$state" ] || exit 0
          [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ "${RUNNER_OS:-}" = Linux ] || exit 1
          read -r account uid < "$state"
          [ "$account" = "oa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ] && [ "$(id -u "$account")" = "$uid" ] || exit 1
          {
            printf 'Disposable principal: '; id "$account"
            # Inspect only identity/runtime settings; never dump the full manager environment.
            sudo -u "$account" env HOME="/home/$account" XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
              timeout --kill-after=2s 10s systemctl --user show-environment | grep -E '^(HOME|USER|LOGNAME|XDG_RUNTIME_DIR)=' || true
            # Include the exact directory named by failed run 34693195412.
            for directory in "/run/user/$uid" /run/user/1001; do
              sudo stat -c '%A %u:%g %n' "$directory" "$directory/openabstractions-logging-v1.sock.lock" 2>&1 || true
            done
            # status returns nonzero for stopped/failed units; retain that diagnostic
            # without changing the preceding install step's failure conclusion.
            sudo -u "$account" env HOME="/home/$account" XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
              timeout --kill-after=2s 10s systemctl --user status abstraction-runtime.service --no-pager --full || true
            sudo timeout --kill-after=2s 10s journalctl --no-pager -n 60 "_UID=$uid" _SYSTEMD_USER_UNIT=abstraction-runtime.service
          } 2>&1 | tee pkg/linux-runtime-diagnostics.log

      - name: remove only the disposable Linux account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state=$RUNNER_TEMP/oa-posix-account
          [ -f "$state" ] || exit 0
          [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ "${RUNNER_OS:-}" = Linux ] || exit 1
          read -r account uid < "$state"
          [ "$account" = "oa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ] && [ "$(id -u "$account")" = "$uid" ] || exit 1
          {
            # Cleanup after a failed assertion is explicit containment, not lifecycle PASS.
            sudo loginctl disable-linger "$account"
            sudo systemctl stop "user@$uid.service"
            # Stopping the user manager may leave its session scope exiting for a
            # short time. Terminate only this verified disposable login, then wait
            # for the kernel's UID process inventory to drain before userdel.
            # An earlier lifecycle failure may leave no registered login; the UID
            # inventory below remains the authoritative cleanup condition.
            sudo loginctl terminate-user "$account" || true
            for _ in $(seq 1 50); do
              if ! sudo pgrep -u "$uid" >/dev/null; then break; fi
              sleep 0.2
            done
            if sudo pgrep -u "$uid" >/dev/null; then
              echo "Disposable account still owns processes after bounded shutdown:"
              sudo ps -o user:24,pid,ppid,stat,etimes,comm,args -u "$uid"
              exit 1
            fi
            sudo userdel --remove "$account"
            if getent passwd "$account" >/dev/null; then echo 'Disposable account survived cleanup'; exit 1; fi
            rm "$state"
            echo 'PASS disposable account cleanup'
          } 2>&1 | tee pkg/linux-account-cleanup.log

      - name: retain Linux lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-lifecycle-evidence-${{ github.run_attempt }}
          path: |
            pkg/*.log
            pkg/package-verification.json
          if-no-files-found: warn

  macos:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: candidate
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
      GOTOOLCHAIN: local
    runs-on: macos-latest
    outputs:
      state: ${{ steps.material.outputs.state }}
      missing: ${{ steps.material.outputs.missing }}
      package-artifact: ${{ steps.material.outputs.artifact }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      # This image carries no Go, and `go version` belongs in the state line, so
      # Go is installed before the first number rather than the state line
      # moving after the first build: state printed afterwards is the state of
      # something else. The version is the one the windows and linux jobs pin.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          go version | tee go-version.txt
          sw_vers

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-version-macos-${{ github.run_attempt }}
          path: go-version.txt
          if-no-files-found: error

      # Decided before anything is built, so every later step branches on one
      # answer rather than each re-deciding. Names are printed and values never
      # are. Some-but-not-all is its own state: it is a typo in a secret name,
      # not a deliberate unsigned release, and it must not read like one.
      - name: signing material, by name and never by value
        id: material
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          present=; missing=
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD \
                      MACOS_INSTALLER_CERTIFICATE MACOS_INSTALLER_CERTIFICATE_PASSWORD \
                      APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -n "${!name}" ]; then present="$present $name"; else missing="$missing $name"; fi
          done
          present=${present# }; missing=${missing# }
          if [ -z "$missing" ]; then state=signed
          elif [ -z "$present" ]; then state=unsigned
          else state=partial
          fi
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf 'missing=%s\n' "$missing" >> "$GITHUB_OUTPUT"
          if [ "$state" = signed ]; then package_state=signed; else package_state=unsigned-unnotarised; fi
          printf 'artifact=abstraction-macos-%s-%s\n' "$package_state" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'signing material: %s\n' "$state"
          [ -z "$missing" ] || printf 'not set: %s\n' "$missing"

      # Imported into a keychain made for this run and deleted at the end of it,
      # so nothing is added to any keychain that outlives the job. The keychain
      # password is generated here, used here and never leaves this step: after
      # unlock, securityd keeps it open for the rest of the job.
      - name: a keychain for this run only
        if: steps.material.outputs.state == 'signed'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          pw=$(openssl rand -base64 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user | tr -d ' "' > "$RUNNER_TEMP/keychains.before"
          security list-keychains -d user -s "$kc" $(cat "$RUNNER_TEMP/keychains.before")
          for pair in MACOS_CERTIFICATE:MACOS_CERTIFICATE_PASSWORD \
                      MACOS_INSTALLER_CERTIFICATE:MACOS_INSTALLER_CERTIFICATE_PASSWORD; do
            b64=${pair%%:*}; pass=${pair#*:}
            printf '%s' "${!b64}" | base64 --decode > "$RUNNER_TEMP/import.p12"
            security import "$RUNNER_TEMP/import.p12" -k "$kc" -P "${!pass}" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/import.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" > /dev/null
          printf 'SIGNING_KEYCHAIN=%s\n' "$kc" >> "$GITHUB_ENV"
          printf 'ok    two identities imported into a keychain this job will delete\n'

      - name: verify and record published module provenance
        run: python3 scripts/module_provenance.py --tools tools.tsv --output module-provenance.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-provenance-${{ runner.os }}-${{ github.run_attempt }}
          path: module-provenance.json
          if-no-files-found: error

      - name: native POSIX shell fixtures
        shell: bash
        run: |
          python3 posix/test_lifecycle.py

      - name: build from the published modules, universal
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOFLAGS: -trimpath
        run: |
          python3 scripts/release_tsv_rows.py tools.tsv --output tools.rows
          root=$PWD
          mkdir -p universal
          while IFS= read -r -d '' path && IFS= read -r -d '' module &&
                IFS= read -r -d '' package && IFS= read -r -d '' feature &&
                IFS= read -r -d '' subsystem; do
            if [ "$subsystem" = windows ]; then
              printf 'note  %s is a windows-subsystem image and is not in a macOS package\n' "$path"
              continue
            fi
            mod=${module%@*}
            version=${module##*@}
            case "$package" in
              .) target="$mod@$version" ;;
              *) target="$mod/$package@$version" ;;
            esac
            gobin="$(go env GOPATH)/bin"
            thin=""
            for arch in amd64 arm64; do
              rm -rf "$gobin"
              GOARCH="$arch" go install -ldflags '-s -w -buildid=' "$target"
              built=$(find "$gobin" -type f)
              mkdir -p "$root/thin/$arch"
              mv "$built" "$root/thin/$arch/${path%.exe}"
              thin="$thin $root/thin/$arch/${path%.exe}"
            done
            lipo -create -output "universal/${path%.exe}" $thin
            lipo -info "universal/${path%.exe}"
          done < tools.rows

      # Panel's Go and Swift programs and native icon come from the published monitor
      # module version named in tools.tsv. The redist checkout contains the
      # packaging sources; it does not contain a monitor/ source directory.
      - name: build the Panel's app-bundle programs
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -trimpath
        run: |
          root=$PWD
          panel_module=$(awk -F '\t' '$1 == "Abstraction Panel.exe" {print $2}' tools.tsv)
          case "$panel_module" in
            github.com/openabstractions/abstractions/monitor@v*) ;;
            *) printf 'FAIL  tools.tsv has no published Panel module\n'; exit 1 ;;
          esac
          module_dir=$(go mod download -json "$panel_module" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["Dir"])')
          test -f "$module_dir/macos/PanelLauncher.swift" ||
            { printf 'FAIL  published Panel module has no macOS launcher source\n'; exit 1; }
          test -f "$module_dir/icon/panel.icns" ||
            { printf 'FAIL  published Panel module has no native app icon\n'; exit 1; }
          cp "$module_dir/icon/panel.icns" universal/AppIcon.icns
          for arch in amd64 arm64; do
            mkdir -p "$root/thin/$arch"
            GOOS=darwin GOARCH="$arch" go -C "$module_dir" build -ldflags '-s -w -buildid=' \
              -o "$root/thin/$arch/panel" .
          done
          lipo -create -output universal/panel "$root/thin/amd64/panel" "$root/thin/arm64/panel"
          lipo -info universal/panel

          for arch in amd64 arm64; do
            case $arch in amd64) swiftarch=x86_64 ;; arm64) swiftarch=arm64 ;; esac
            mkdir -p "$root/thin/$arch"
            swiftc -O -target "$swiftarch-apple-macos12.0" \
              "$module_dir/macos/PanelLauncher.swift" -o "$root/thin/$arch/Abstraction Panel"
          done
          lipo -create -output "universal/Abstraction Panel" \
            "$root/thin/amd64/Abstraction Panel" "$root/thin/arm64/Abstraction Panel"
          lipo -info "universal/Abstraction Panel"

      # Each thin Go image is inspected before signing and packaging. The published
      # identity XPC transport, Keychain and native network-cost backends select
      # their Darwin implementation only when cgo is enabled.
      - name: verify native cgo in every macOS Go image
        run: |
          names=$(python3 scripts/release_tsv_rows.py tools.tsv --console-names)
          test -n "$names" || { printf 'FAIL  no macOS Go programs in tools.tsv\n'; exit 1; }
          for arch in amd64 arm64; do
            for name in $names panel; do
              image="thin/$arch/$name"
              test -f "$image" || { printf 'FAIL  missing %s\n' "$image"; exit 1; }
              info=$(go version -m "$image") || exit 1
              printf '%s\n' "$info" | grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=1$' ||
                { printf 'FAIL  %s was built without native cgo\n' "$image"; exit 1; }
              printf 'ok    %s built with native cgo\n' "$image"
            done
          done

      # Before the package, because build.py copies these bytes into the payload
      # and a signature travels in the Mach-O file. Panel.app's nested programs
      # are signed after assembly by build.py, followed by the outer bundle.
      # The identity is looked up in
      # the keychain rather than written here: this file is public and the
      # certificate's common name is a person and a team identifier.
      - name: sign the programs
        id: app_sign
        if: steps.material.outputs.state == 'signed'
        run: |
          app=$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" |
                awk '/Developer ID Application:/ {print $2}' || true)
          set -- $app
          if [ $# -ne 1 ]; then
            printf 'FAIL  %s Developer ID Application identities in the keychain, wanted 1\n' "$#"
            exit 1
          fi
          printf 'identity=%s\n' "$1" >> "$GITHUB_OUTPUT"
          for f in universal/*; do
            case "$(basename "$f")" in panel|"Abstraction Panel"|AppIcon.icns) continue ;; esac
            codesign --force --timestamp --options runtime \
              --keychain "$SIGNING_KEYCHAIN" --sign "$1" "$f"
            codesign --verify --strict --verbose=2 "$f"
            codesign -dv --verbose=4 "$f" > "$RUNNER_TEMP/dv" 2>&1
            grep -q '^Timestamp=' "$RUNNER_TEMP/dv" ||
              { printf 'FAIL  %s carries no secure timestamp\n' "$f"; cat "$RUNNER_TEMP/dv"; exit 1; }
            grep -q '^CodeDirectory .*flags=0x[0-9a-f]*([^)]*runtime' "$RUNNER_TEMP/dv" ||
              { printf 'FAIL  %s has no hardened runtime\n' "$f"; cat "$RUNNER_TEMP/dv"; exit 1; }
            printf 'ok    %s signed, hardened, timestamped\n' "$f"
          done

      - name: package
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
          SIGNING_STATE: ${{ steps.material.outputs.state }}
          APP_SIGNING_IDENTITY: ${{ steps.app_sign.outputs.identity }}
        run: |
          version=$CANDIDATE_VERSION
          mkdir -p dist
          sign=()
          if [ "$SIGNING_STATE" = signed ]; then
            [ -n "$APP_SIGNING_IDENTITY" ] && [ -n "$SIGNING_KEYCHAIN" ] ||
              { printf 'FAIL  requested Panel.app signing has no identity or keychain\n'; exit 1; }
            sign=(--sign-app-identity "$APP_SIGNING_IDENTITY" --signing-keychain "$SIGNING_KEYCHAIN")
          fi
          python3 posix/build.py --platform macos --version "$version" \
            --out dist --bin universal --license LICENSE "${sign[@]}"
          (cd dist && shasum -a 256 ./*.pkg | sed 's#\./##' | tee SHA256SUMS.macos)

      # A .pkg takes the Installer certificate, which is a different certificate
      # from the one the programs took; a .pkg signed with the Application one is
      # rejected. Apple's notary service accepts a flat installer package as it
      # stands, so nothing is zipped. The checksums are recomputed because
      # productsign and stapler both rewrite the file.
      - name: sign the package, notarise it, staple the ticket
        if: steps.material.outputs.state == 'signed'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          inst=$(security find-identity -v "$SIGNING_KEYCHAIN" |
                 awk '/Developer ID Installer:/ {print $2}' || true)
          set -- $inst
          if [ $# -ne 1 ]; then
            printf 'FAIL  %s Developer ID Installer identities in the keychain, wanted 1\n' "$#"
            exit 1
          fi
          pkg=$(ls dist/*.pkg)
          productsign --keychain "$SIGNING_KEYCHAIN" --sign "$1" "$pkg" "$pkg.signed"
          mv "$pkg.signed" "$pkg"
          pkgutil --check-signature "$pkg"

          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          xcrun notarytool submit "$pkg" --key "$key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --output-format json \
            > "$RUNNER_TEMP/notary.json" || true
          id=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")
          status=$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")
          printf 'notary status %s for submission %s\n' "${status:-none}" "${id:-none}"
          if [ "$status" != Accepted ]; then
            [ -z "$id" ] || xcrun notarytool log "$id" --key "$key" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            printf 'FAIL  the notary service did not accept the package\n'
            exit 1
          fi

          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          spctl -a -vv -t install "$pkg" > "$RUNNER_TEMP/spctl" 2>&1 || true
          cat "$RUNNER_TEMP/spctl"
          grep -q ': accepted' "$RUNNER_TEMP/spctl" ||
            { printf 'FAIL  Gatekeeper does not accept the package\n'; exit 1; }
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl" ||
            { printf 'FAIL  Gatekeeper does not see a stapled notarisation ticket\n'; exit 1; }
          (cd dist && shasum -a 256 ./*.pkg | sed 's#\./##' | tee SHA256SUMS.macos)

      # Verify the shipped bundle and its nested programs after pkg expansion.
      - name: the app bundle and programs inside the package are signed
        if: steps.material.outputs.state == 'signed'
        run: |
          pkg=$(ls dist/*.pkg)
          pkgutil --expand-full "$pkg" "$RUNNER_TEMP/expanded"
          app=$(find "$RUNNER_TEMP/expanded" -type d -name 'Abstraction Panel.app' -print -quit)
          [ -n "$app" ] || { printf 'FAIL  Panel.app is not in the package\n'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" > "$RUNNER_TEMP/app-signature" 2>&1
          grep -q '^Authority=Developer ID Application:' "$RUNNER_TEMP/app-signature" ||
            { printf 'FAIL  packaged Panel.app has no Developer ID Application signature\n'; exit 1; }
          grep -q '^Timestamp=' "$RUNNER_TEMP/app-signature" ||
            { printf 'FAIL  packaged Panel.app has no secure timestamp\n'; exit 1; }
          grep -q '^CodeDirectory .*flags=0x[0-9a-f]*([^)]*runtime' "$RUNNER_TEMP/app-signature" ||
            { printf 'FAIL  packaged Panel.app has no hardened runtime\n'; exit 1; }
          for name in openabstractions panel "Abstraction Panel"; do
            f=$(find "$RUNNER_TEMP/expanded" -type f -name "$name" | head -1)
            [ -n "$f" ] || { printf 'FAIL  %s is not in the package\n' "$name"; exit 1; }
            codesign --verify --strict --verbose=2 "$f"
            codesign -dv --verbose=4 "$f" 2>&1 | grep -q '^Timestamp=' ||
              { printf 'FAIL  %s in the package carries no secure timestamp\n' "$name"; exit 1; }
            printf 'ok    %s in the package is signed and timestamped\n' "$name"
          done

      - name: which state this run was in
        env:
          STATE: ${{ steps.material.outputs.state }}
          MISSING: ${{ steps.material.outputs.missing }}
        run: |
          {
            if [ "$STATE" = signed ]; then
              printf '\n### macOS â€” signed and notarised\n\n'
              printf 'The universal `.pkg` is **attached to the release**. Its program is\n'
              printf 'signed with a Developer ID Application certificate with the hardened\n'
              printf 'runtime enabled; the package is signed with a Developer ID Installer\n'
              printf 'certificate, notarised by Apple and stapled. `spctl -a -vv -t install`\n'
              printf 'accepted it on this runner.\n\n'
              printf -- '- Still UNPROVEN: it has never been **installed**.\n'
              printf -- '  `installer/posix/macos/postinstall`, the LaunchAgent and `uninstall.sh`\n'
              printf -- '  have run on no machine. Gatekeeper opening a package is not the same\n'
              printf -- '  claim as the package working.\n'
            else
              printf '\n### macOS â€” UNPROVEN\n\n'
              printf 'A universal `.pkg` was built here and is **not attached to the release**.\n\n'
              printf -- '- It is unsigned and unnotarised, so Gatekeeper refuses it: a person who\n'
              printf -- '  downloads it cannot open it, and a download that cannot be opened is\n'
              printf -- '  worse than a platform that says it has no package.\n'
              printf -- '- It has never been installed. `installer/posix/macos/postinstall`, the\n'
              printf -- '  LaunchAgent and `uninstall.sh` have run on no machine.\n'
              if [ "$STATE" = partial ]; then
                printf -- '- **Signing was configured and did not run.** These repository secrets\n'
                printf -- '  are empty or missing: `%s`. Nothing was signed and nothing was\n' "$MISSING"
                printf -- '  attached.\n'
              else
                printf -- '- No signing material is configured in this repository: none of the\n'
                printf -- '  seven signing secrets is set.\n'
              fi
              printf '\nUntil then the route on macOS is `go install`, which needs none of it.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.material.outputs.artifact }}
          path: |
            dist/*.pkg
            dist/SHA256SUMS.macos
          if-no-files-found: error

      # By the fixed path rather than by $SIGNING_KEYCHAIN, because the step that
      # exports that variable can fail after creating the keychain. `-s` with an
      # empty argument list empties the search list, so the restore only happens
      # when the file recording it was written.
      - name: delete the keychain this run made
        if: always()
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          [ -e "$kc" ] || exit 0
          before="$RUNNER_TEMP/keychains.before"
          if [ -s "$before" ]; then security list-keychains -d user -s $(cat "$before"); fi
          security delete-keychain "$kc"
          printf 'ok    the keychain this run made is gone\n'

  # The JavaScript client's native code ships inside its npm package, never from
  # the runtime installation (VISION.md, 2026-09-22): the library decides which
  # runtime an application trusts, and that decision cannot come from the party
  # being judged. The three platforms that build an installer here also build
  # @openabstractions/ipc-<os>-<cpu>, at this candidate's version, from the
  # published commits npm.tsv names. A platform without hardware qualification —
  # ARM64 Windows and Linux — gets no package rather than an untested one.
  #
  # Nothing here publishes. `npm publish` needs the owner's npm organization and
  # consent; the tarballs are retained as artifacts beside the installers for
  # that decision.
  javascript:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    name: javascript (${{ matrix.id }})
    needs: [candidate, windows-pe-sign]
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win32-x64
            runner: windows-latest
            platforms: win32-x64
          - id: linux-x64
            runner: ubuntu-latest
            platforms: linux-x64
          # One universal build serves both macOS platform packages, as one
          # universal .pkg serves both architectures above.
          - id: darwin
            runner: macos-latest
            platforms: darwin-arm64 darwin-x64
            architectures: x86_64;arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.23.3'

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          node --version
          npm --version
          cmake --version | head -1

      # A commit is the identity of a JavaScript directory here: these
      # directories carry no tag of their own, and a release built from a moving
      # ref is a release nobody can rebuild. Each checkout is checked against
      # the row that asked for it.
      - name: check out the published JavaScript sources
        run: |
          python3 scripts/release_tsv_rows.py npm.tsv --output npm.rows
          while IFS= read -r -d '' package && IFS= read -r -d '' repository &&
                IFS= read -r -d '' commit && IFS= read -r -d '' directory; do
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'FAIL  %s names %s, which is not a full lowercase commit\n' "$package" "$commit"
              exit 1
            fi
            name=${repository#*/}
            [ -d "sources/$name" ] || git clone --quiet "https://github.com/$repository.git" "sources/$name"
            git -C "sources/$name" checkout --quiet "$commit"
            head=$(git -C "sources/$name" rev-parse HEAD)
            if [ "$head" != "$commit" ]; then
              printf 'FAIL  %s checked out %s, not %s\n' "$repository" "$head" "$commit"
              exit 1
            fi
            if [ ! -f "sources/$name/$directory/package.json" ]; then
              printf 'FAIL  %s has no package.json in %s\n' "$repository" "$directory"
              exit 1
            fi
            printf 'ok    %s from %s %s\n' "$package" "$repository" "$commit"
          done < npm.rows

      # Exact Node-API header tarball and, on Windows, the matching official
      # Node runtime ZIP and its separately published same-version win-x64
      # import library. All three inputs are bounded and SHA-checked
      # before a compiler sees them; the archives travel with the npm artifact.
      - name: pinned Node-API and import-library build inputs
        run: |
          test "$(node --version)" = v22.23.3 || { printf 'FAIL  Node build version changed\n'; exit 1; }
          options=()
          if [ "$RUNNER_OS" = Windows ]; then options=(--windows); fi
          python3 sources/abstractions/adopters/opencode/node_build_inputs.py \
            --output-root build/node-inputs "${options[@]}"
          printf 'NODE_INCLUDE_DIR=%s\n' "$PWD/build/node-inputs/node-api-headers/include" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            printf 'NODE_IMPORT_LIBRARY=%s\n' "$PWD/build/node-inputs/node.lib" >> "$GITHUB_ENV"
          fi

      # Two builds of one source: the shared library Bun opens through bun:ffi,
      # and the static archive the Node addon links into itself. The addon's
      # CMakeLists refuses a shared package for exactly that reason.
      - name: build the shared C ABI library and the Node addon
        if: runner.os != 'Windows'
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
        run: |
          identity=sources/abstraction-identity
          arch=()
          [ -z "$ARCHITECTURES" ] || arch=(-DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURES")
          node_lib=()
          [ -z "${NODE_IMPORT_LIBRARY:-}" ] || node_lib=(-DNODE_IMPORT_LIBRARY="$NODE_IMPORT_LIBRARY")
          portable=()
          if [ "$RUNNER_OS" = Windows ]; then portable=(-DABSTRACTION_IPC_PORTABLE_WINDOWS=ON); fi
          cmake -S "$identity/cpp" -B build/shared -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DABSTRACTION_IPC_BUILD_TESTS=OFF "${arch[@]}" "${portable[@]}"
          cmake --build build/shared --config Release
          cmake -S "$identity/cpp" -B build/static -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DABSTRACTION_IPC_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix" "${arch[@]}"
          cmake --build build/static --config Release
          cmake --install build/static --config Release
          cmake -S "$identity/javascript" -B build/addon -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DNODE_INCLUDE_DIR="$NODE_INCLUDE_DIR" \
            "${node_lib[@]}" "${arch[@]}"
          cmake --build build/addon --config Release
          case "$RUNNER_OS" in
            Windows) library=abstraction_ipc.dll ;;
            Linux) library=libabstraction_ipc.so ;;
            macOS) library=libabstraction_ipc.dylib ;;
          esac
          mkdir -p native
          cp "$(find build/shared -name "$library" -type f | head -1)" "native/$library"
          cp "$(find build/addon -name oa_ipc_node.node -type f | head -1)" native/oa_ipc_node.node
          printf 'IPC_LIBRARY=%s\n' "$PWD/native/$library" >> "$GITHUB_ENV"
          printf 'IPC_ADDON=%s\n' "$PWD/native/oa_ipc_node.node" >> "$GITHUB_ENV"
          ls -l native

      - if: runner.os == 'Windows'
        name: consume exact windows-pe-signed producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-pe-sign.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-pe-sign.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-pe-sign.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-pe-signed-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed
      - name: select canonical signed Windows native bytes
        if: runner.os == 'Windows'
        run: |
          printf 'IPC_LIBRARY=%s\nIPC_ADDON=%s\n' "$PWD/signed/native/abstraction_ipc.dll" "$PWD/signed/native/oa_ipc_node.node" >> "$GITHUB_ENV"
          mkdir -p build/node-inputs
          cp signed/native/build-inputs/node-api-headers-1.9.0.tgz signed/native/build-inputs/node-v22.23.3-win-x64.zip \
            signed/native/build-inputs/node-v22.23.3-win-x64.lib signed/native/build-inputs/receipt.json build/node-inputs/

      # One script for this job and for a workstation, because two assemblers
      # cannot be kept agreeing about what a package contains. It refuses a
      # tarball that misses a file its own package.json names.
      - name: restore the OpenCode adapter's declared test dependencies
        run: |
          npm install --prefix sources/abstractions/adopters/opencode --no-save \
            --package-lock=false --ignore-scripts --omit=optional \
            @openabstractions/facade@file:../../../abstraction-facade/javascript \
            @openabstractions/inference@file:../../../abstraction-inference/javascript \
            @openabstractions/asks@file:../../../abstraction-asks/javascript \
            @openabstractions/ipc@file:../../../abstraction-identity/javascript \
            @openabstractions/logging@file:../../../abstraction-logging/javascript \
            @openabstractions/rights@file:../../../abstraction-rights/javascript \
            @openabstractions/router@file:../../../abstraction-router/javascript \
            @openabstractions/storage-content@file:../../../abstraction-storage/javascript
      - name: assemble the platform packages and pack every tarball
        env:
          PLATFORMS: ${{ matrix.platforms }}
          ARTIFACT: ${{ matrix.id }}
        run: |
          for platform in $PLATFORMS; do
            python3 scripts/npm_packages.py --version "$CANDIDATE_VERSION" --platform "$platform" \
              --library "$IPC_LIBRARY" --addon "$IPC_ADDON" --output npm \
              --ipc sources/abstraction-identity/javascript \
              --facade sources/abstraction-facade/javascript \
              --inference sources/abstraction-inference/javascript \
              --asks sources/abstraction-asks/javascript \
              --logging sources/abstraction-logging/javascript \
              --rights sources/abstraction-rights/javascript \
              --router sources/abstraction-router/javascript \
              --storage sources/abstraction-storage/javascript \
              --opencode sources/abstractions/adopters/opencode \
              --license LICENSE
          done
          digests() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd npm && digests ./*.tgz | sed 's#\./##' | tee "SHA256SUMS.npm.$ARTIFACT")

      - name: retain exact Windows addon build input archives
        if: matrix.id == 'win32-x64'
        run: |
          mkdir -p npm/build-inputs
          cp build/node-inputs/node-api-headers-1.9.0.tgz npm/build-inputs/
          cp build/node-inputs/node-v22.23.3-win-x64.zip npm/build-inputs/
          cp build/node-inputs/node-v22.23.3-win-x64.lib npm/build-inputs/
          cp build/node-inputs/receipt.json npm/build-inputs/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abstraction-npm-${{ matrix.id }}-${{ github.run_attempt }}
          path: npm/
          if-no-files-found: error

  # The Python client's native library ships inside its wheel, never from the
  # runtime installation, for the reason the javascript job above states: the
  # library decides which runtime an application trusts, and that decision
  # cannot come from the party being judged. The platforms the javascript job
  # already qualifies build one abstraction-ipc wheel per platform tag here,
  # at this candidate's version, from the shared C ABI library alone — the
  # Node addon javascript builds is not needed. A platform without hardware
  # qualification gets no wheel rather than an untested one.
  #
  # Nothing here publishes. Uploading to PyPI needs the owner's organization
  # and consent; the wheels are retained as artifacts beside the installers
  # and the npm tarballs for that decision.
  python:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '' || inputs.app_producer_only == 'comfyui') }}
    name: python (${{ matrix.id }})
    needs: [candidate, windows-pe-sign]
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win32-x64
            runner: windows-latest
            platform: win_amd64
          - id: linux-x64
            runner: ubuntu-latest
            platform: manylinux_2_28_x86_64
          - id: darwin-arm64
            runner: macos-latest
            platform: macosx_11_0_arm64
            architectures: arm64
          - id: darwin-x64
            runner: macos-latest
            platform: macosx_11_0_x86_64
            architectures: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          python3 --version
          cmake --version | head -1

      # A commit is the identity of this checkout, the same as the javascript
      # job: abstraction-identity carries no tag of its own, and a release
      # built from a moving ref is a release nobody can rebuild.
      - name: check out the published source
        run: |
          python3 scripts/release_tsv_rows.py pypi.tsv --output pypi.rows
          while IFS= read -r -d '' package && IFS= read -r -d '' repository &&
                IFS= read -r -d '' commit && IFS= read -r -d '' directory; do
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'FAIL  %s names %s, which is not a full lowercase commit\n' "$package" "$commit"
              exit 1
            fi
            name=${repository#*/}
            [ -d "sources/$name" ] || git clone --quiet "https://github.com/$repository.git" "sources/$name"
            git -C "sources/$name" checkout --quiet "$commit"
            head=$(git -C "sources/$name" rev-parse HEAD)
            if [ "$head" != "$commit" ]; then
              printf 'FAIL  %s checked out %s, not %s\n' "$repository" "$head" "$commit"
              exit 1
            fi
            if [ ! -f "sources/$name/$directory/pyproject.toml" ]; then
              printf 'FAIL  %s has no pyproject.toml in %s\n' "$repository" "$directory"
              exit 1
            fi
            printf 'ok    %s from %s %s\n' "$package" "$repository" "$commit"
          done < pypi.rows

      # Windows consumes the one signed canonical DLL from windows-pe-sign.
      # Other platforms build their shared library here. The wheel loads only
      # that library through ctypes; no Node addon enters a Python wheel.
      - name: build the shared C ABI library
        if: runner.os != 'Windows'
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
        run: |
          identity=sources/abstraction-identity
          arch=()
          [ -z "$ARCHITECTURES" ] || arch=(-DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURES")
          portable=()
          if [ "$RUNNER_OS" = Windows ]; then portable=(-DABSTRACTION_IPC_PORTABLE_WINDOWS=ON); fi
          cmake -S "$identity/cpp" -B build/shared -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DABSTRACTION_IPC_BUILD_TESTS=OFF "${arch[@]}" "${portable[@]}"
          cmake --build build/shared --config Release
          case "$RUNNER_OS" in
            Windows) library=abstraction_ipc.dll ;;
            Linux) library=libabstraction_ipc.so ;;
            macOS) library=libabstraction_ipc.dylib ;;
          esac
          mkdir -p native
          cp "$(find build/shared -name "$library" -type f | head -1)" "native/$library"
          printf 'IPC_LIBRARY=%s\n' "$PWD/native/$library" >> "$GITHUB_ENV"
          ls -l native

      - if: runner.os == 'Windows'
        name: consume exact windows-pe-signed producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-pe-sign.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-pe-sign.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-pe-sign.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-pe-signed-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed
      - name: select canonical signed Windows native bytes
        if: runner.os == 'Windows'
        run: |
          printf 'IPC_LIBRARY=%s\nIPC_ADDON=%s\n' "$PWD/signed/native/abstraction_ipc.dll" "$PWD/signed/native/oa_ipc_node.node" >> "$GITHUB_ENV"

      # scripts/py_wheels.py is the assembler for this job and for a
      # workstation, the way scripts/npm_packages.py is for the javascript
      # job above: one script for both routes, so nothing keeps two ideas of
      # what a wheel contains agreeing. --check re-reads the wheel it just
      # built rather than trusting the process that wrote it.
      - name: assemble and check the exact roster's wheels
        env:
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ matrix.id }}
        run: |
          python3 scripts/py_wheels.py --version "$CANDIDATE_VERSION" --platform "$PLATFORM" \
            --library "$IPC_LIBRARY" --output pypi \
            --package sources/abstraction-identity/py \
            --license LICENSE
          n=$(ls pypi/*.whl | wc -l)
          if [ "$n" -ne 1 ]; then
            printf 'FAIL  built %s wheels, expected 1\n' "$n"
            exit 1
          fi
          python3 scripts/py_wheels.py --check pypi/*.whl
          python3 - <<'PY'
          import pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from app_assets import python_package_pins
          pins = python_package_pins('pypi.tsv')
          for pin in pins[1:]:
              repo = pin['repository'].split('/', 1)[1]
              root = pathlib.Path('sources') / repo
              subprocess.run([sys.executable, 'scripts/py_pure_wheels.py',
                              '--source', str(root / pin['directory']),
                              '--license', str(root / 'LICENSE'), '--output', 'pypi'], check=True)
          built = sorted(pathlib.Path('pypi').glob('*.whl'))
          if len(built) != len(pins):
              raise SystemExit('Python wheel set differs from pypi.tsv')
          for wheel in built:
              if wheel.name.startswith('abstraction_ipc-'):
                  continue
              subprocess.run([sys.executable, 'scripts/py_pure_wheels.py', '--check', str(wheel)], check=True)
          PY
          digests() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd pypi && digests ./*.whl | sed 's#\./##' | tee "SHA256SUMS.pypi.$ARTIFACT")

      # What an adopter installs is this set, together: a generated client reads
      # types off the codecs of the packages it requires when it is imported
      # (asks names rights' PermissionSelection). Install every wheel built above
      # into one temporary directory with pip --no-index, resolving each wheel's
      # requirements among these wheels alone, and import every _codec module in
      # an interpreter that sees only that directory. This is the cross-package
      # Python check; no published workflow pins a sibling commit for it
      # (VISION 2026-10-08). The wheels and their sums are not changed. It runs
      # where the leg's native IPC wheel fits the runner's interpreter: the
      # darwin-x64 leg builds a macosx x86_64 wheel on an arm64 macos-latest
      # runner, whose arm64 CPython pip refuses it for; darwin-arm64 covers
      # macOS, and the pure wheels are the same files on every leg.
      - name: install the wheel set together and import every codec
        if: matrix.id != 'darwin-x64'
        run: python3 scripts/py_codec_imports.py --wheels pypi

      # The Windows adopter producer later consumes this exact retained wheel
      # set. Derive its source and byte receipt from pypi.tsv and the built
      # output; a draft-only retry can select the prior successful attempt.
      - name: record Windows Python wheel inputs
        if: matrix.id == 'win32-x64'
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from app_assets import windows_wheel_receipt
          receipt = windows_wheel_receipt(
              'pypi.tsv', 'pypi', 'sources', os.environ['CANDIDATE_SHA'],
              int(os.environ['GITHUB_RUN_ID']), int(os.environ['GITHUB_RUN_ATTEMPT']),
              os.environ['CANDIDATE_VERSION'], os.environ['IPC_LIBRARY'])
          pathlib.Path('pypi/wheel-inputs.json').write_text(
              json.dumps(receipt, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abstraction-pypi-${{ matrix.id }}-${{ github.run_attempt }}
          path: pypi/
          if-no-files-found: error

  # Both jobs are required dependencies even with an empty apps.json. An enabled
  # row needs a successful same-run app job: strict build or authenticated P consumer.
  # The runner is named here, so the reviewed workflow digest covers it; no
  # repository variable can send the candidate source to another machine.
  app_comfyui:
    needs: [candidate, python]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: needs.candidate.outputs.comfyui == 'true'
        with:
          python-version: '3.12'
      - name: verify and check out exact public app sources
        if: needs.candidate.outputs.comfyui == 'true'
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          extra = ['--producer-only'] if os.environ['APP_PRODUCER_ONLY'] == 'comfyui' else []
          if extra:
              extra += ['--adopter-commit', os.environ['COMFYUI_PRODUCER_ADOPTER_COMMIT']]
          for operation in ('pins', 'checkout'):
              subprocess.run([sys.executable, 'scripts/app_producer_inputs.py', operation,
                              '--app', 'comfyui', *extra], check=True)
          PY
      - name: refuse undersized disposable producer before asset downloads
        if: needs.candidate.outputs.comfyui == 'true' && needs.candidate.outputs.comfyui-predecessor != 'true'
        run: |
          extra=(); if [ "$APP_PRODUCER_ONLY" = "comfyui" ]; then extra=(--producer-only --adopter-commit "$COMFYUI_PRODUCER_ADOPTER_COMMIT"); fi
          python3 scripts/app_producer_inputs.py preflight --app comfyui "${extra[@]}" --minimum-free-gib 1
      - name: select this run's successful Windows Python wheel set
        if: needs.candidate.outputs.comfyui == 'true' && needs.candidate.outputs.comfyui-predecessor != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          selected = json.loads(subprocess.check_output([
              sys.executable, 'scripts/app_producer_inputs.py', 'select-wheels', '--app', 'comfyui',
              '--candidate-source', os.environ['CANDIDATE_SHA'], '--run-id', os.environ['GITHUB_RUN_ID']]))
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write('WHEEL_ARTIFACT=' + selected['artifact'] + '\n')
              output.write('WHEEL_ATTEMPT=' + str(selected['run_attempt']) + '\n')
          PY
      - name: fetch this run's successful Windows Python wheel set
        if: needs.candidate.outputs.comfyui == 'true' && needs.candidate.outputs.comfyui-predecessor != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p app-build-inputs/wheels
          gh run download "$GITHUB_RUN_ID" -n "$WHEEL_ARTIFACT" -D app-build-inputs/wheels
      - name: fetch exact ComfyUI and CPU inputs
        if: needs.candidate.outputs.comfyui == 'true' && needs.candidate.outputs.comfyui-predecessor != 'true'
        run: |
          extra=(); if [ "$APP_PRODUCER_ONLY" = "comfyui" ]; then extra=(--producer-only --adopter-commit "$COMFYUI_PRODUCER_ADOPTER_COMMIT"); fi
          python3 scripts/app_producer_inputs.py download-comfy --app comfyui "${extra[@]}"
      - name: build exact public integration and app/source pair
        if: needs.candidate.outputs.comfyui == 'true' && needs.candidate.outputs.comfyui-predecessor != 'true'
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from app_assets import optional_app_sources, roster, app_output_names
          first = os.environ['APP_PRODUCER_ONLY'] == 'comfyui'
          row = app_output_names('comfyui') if first else next(row for row in roster('apps.json') if row['id'] == 'comfyui')
          source_pin = (os.environ['COMFYUI_PRODUCER_ADOPTER_COMMIT'] if first else
                        optional_app_sources('app-sources.tsv', [row])['comfyui']['commit'])
          root = pathlib.Path('sources/abstractions')
          inputs = pathlib.Path('app-build-inputs')
          output = pathlib.Path('app-output')
          output.mkdir()
          charter = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          wheels = inputs / 'wheels'
          receipt = wheels / 'wheel-inputs.json'
          integration = inputs / 'integration.zip'
          sidecar = inputs / 'integration-producer.json'
          common = ['--redist-source-root', '.', '--redist-source-commit', os.environ['CANDIDATE_SHA'],
                    '--redist-version', os.environ['CANDIDATE_VERSION'],
                    '--run-id', os.environ['GITHUB_RUN_ID'],
                    '--run-attempt', os.environ['WHEEL_ATTEMPT']]
          subprocess.run([sys.executable, str(root / 'scripts/package_comfyui_integration.py'),
                          '--source-mode', 'public-split', '--wheel-receipt', str(receipt),
                          '--wheel-dir', str(wheels), '--public-source-root', 'sources',
                          '--adopter-source-root', 'sources/adopter-comfyui',
                          '--adopter-commit', source_pin, '--packager-source-commit', charter,
                          '--producer-receipt-output', str(sidecar), '--output', str(integration),
                          '--native-wheel-version', os.environ['CANDIDATE_VERSION'],
                          '--version', os.environ['CANDIDATE_VERSION'] + '-candidate', *common], check=True)
          integration_info = json.loads(sidecar.read_text(encoding='utf-8'))['integration']
          subprocess.run([sys.executable, str(root / 'scripts/package_comfyui_app.py'),
                          '--archive', str(inputs / 'ComfyUI_windows_portable_amd.7z'),
                          '--output', str(output / row['binary_zip']),
                          '--source-output', str(output / row['source_zip']),
                          '--frontend-checkout', str(inputs / 'upstream/ComfyUI_frontend'),
                          '--embedded-docs-checkout', str(inputs / 'upstream/embedded-docs'),
                          '--pygit2-checkout', str(inputs / 'upstream/pygit2'),
                          '--libgit2-checkout', str(inputs / 'upstream/libgit2'),
                          '--integration-archive', str(integration),
                          '--integration-public-source-root', 'sources',
                          '--integration-producer-receipt', str(sidecar),
                          '--integration-wheel-receipt', str(receipt),
                          '--integration-redist-source-commit', os.environ['CANDIDATE_SHA'],
                          '--integration-run-id', os.environ['GITHUB_RUN_ID'],
                          '--integration-run-attempt', os.environ['WHEEL_ATTEMPT'],
                          '--integration-bytes', str(integration_info['bytes']),
                          '--integration-sha256', integration_info['sha256'],
                          '--cpu-wheelhouse', str(inputs / 'cpu-wheels'),
                          '--minimum-free-gib', '1'], check=True)
          PY
      - name: bind reviewed pair to this producer attempt
        if: needs.candidate.outputs.comfyui == 'true'
        id: identity
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          selected=$(python3 -c 'import json,os; print(str("comfyui" in json.loads(os.environ["APP_PRODUCERS"])).lower())')
          if [ "$selected" = true ]; then
            python3 scripts/app_assets.py consume --roster apps.json --app comfyui \
              --directory app-output --candidate-source "$CANDIDATE_SHA" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --predecessors "$APP_PRODUCERS"
          elif [ "$APP_PRODUCER_ONLY" = comfyui ]; then
            python3 scripts/app_assets.py prepare-first --roster apps.json --app comfyui \
              --directory app-output --candidate-source "$CANDIDATE_SHA" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --candidate-version "$CANDIDATE_VERSION" --upstream-commit 40c4fcdf513a4523e39d54a9d391908af8df8171 \
              --adopter-commit "$COMFYUI_PRODUCER_ADOPTER_COMMIT"
          else
            python3 scripts/app_assets.py prepare --roster apps.json --app comfyui \
              --directory app-output --candidate-source "$CANDIDATE_SHA" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          fi
          printf 'artifact=oa-app-comfyui-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'source_commit=40c4fcdf513a4523e39d54a9d391908af8df8171\n' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.candidate.outputs.comfyui == 'true'
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: app-output/
          if-no-files-found: error

  draft:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: [candidate, windows-msi-sign, verify, linux, linux-verify, macos, app_comfyui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      # The owner's ruling, VISION.md 2026-09-10: hold the release until the
      # service passes; an explicitly incomplete preview is acceptable and a
      # fallback that happens by itself is not. A candidate whose machine
      # scope was not proved stops here
      # and says which leg was not proved. Somebody choosing to publish anyway
      # does it by name, on a run they started, and the release body says so.
      - name: the machine scope is proven, or a person asked for a preview
        env:
          MACHINE_SERVICE: ${{ needs.verify.outputs.machine-service }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ "$MACHINE_SERVICE" = proven ]; then
            printf 'ok    the machine scope registered a supervisor and an instance was running\n'
            exit 0
          fi
          printf 'UNPROVEN  the machine scope: verify reports "%s"\n' "${MACHINE_SERVICE:-nothing}"
          if [ "$PREVIEW" != true ]; then
            printf 'FAIL  this release is held. The Background supervisor feature promises a service\n'
            printf '      to everyone who installs for everyone, and no run has seen one running.\n'
            printf '      Re-run this workflow by hand with preview=true to draft it anyway; the\n'
            printf '      body will say what was not proved.\n'
            exit 1
          fi
          printf 'note  drafting anyway: preview=true was asked for by a person\n'

      - name: fetch the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MACOS_STATE: ${{ needs.macos.outputs.state }}
          WINDOWS_ARTIFACT: ${{ needs.windows-msi-sign.outputs.package-artifact }}
          LINUX_ARTIFACT: ${{ needs.linux.outputs.package-artifact }}
          MACOS_ARTIFACT: ${{ needs.macos.outputs.package-artifact }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n "$WINDOWS_ARTIFACT" -D dist
          gh run download "$GITHUB_RUN_ID" -n "$LINUX_ARTIFACT" -D dist
          if [ "$MACOS_STATE" = signed ]; then
            gh run download "$GITHUB_RUN_ID" -n "$MACOS_ARTIFACT" -D dist
          fi

      # The windows job recorded which wheel the x64 MSI's abstraction_ipc.dll
      # came from. The named artifact of this run is fetched again and the
      # wheel, its SHA256SUMS line and the DLL inside it must match the
      # receipt, which then leaves dist/: it is evidence, not a release asset.
      - name: the IPC library receipt against this run's wheel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, zipfile
          path = pathlib.Path('dist/ipc-library.json')
          receipt = json.loads(path.read_text(encoding='utf-8'))
          artifact = receipt.get('artifact', '')
          if (receipt.get('schema') != 1 or receipt.get('run_id') != int(os.environ['GITHUB_RUN_ID'])
                  or not re.fullmatch(r'abstraction-pypi-win32-x64-[1-9][0-9]*', artifact)
                  or not re.fullmatch(r'abstraction_ipc-[A-Za-z0-9_.+-]+-win_amd64\.whl', receipt.get('wheel', ''))
                  or receipt.get('member') != 'abstraction/ipc/_native/abstraction_ipc.dll'
                  or receipt.get('library') != 'tools/abstraction_ipc.dll'):
              raise SystemExit('FAIL  dist/ipc-library.json does not name a win_amd64 wheel artifact of this run')
          folder = pathlib.Path('ipc-wheel')
          subprocess.run(['gh', 'run', 'download', os.environ['GITHUB_RUN_ID'], '-n', artifact,
                          '-D', str(folder)], check=True)
          wheel = folder / receipt['wheel']
          if hashlib.sha256(wheel.read_bytes()).hexdigest() != receipt['wheel_sha256']:
              raise SystemExit('FAIL  %s is not the wheel the receipt records' % wheel.name)
          sums = (folder / 'SHA256SUMS.pypi.win32-x64').read_text(encoding='utf-8').splitlines()
          if [line for line in sums if line.endswith(wheel.name)] != [receipt['wheel_sums_line']] \
                  or receipt['wheel_sums_line'][:64] != receipt['wheel_sha256']:
              raise SystemExit('FAIL  SHA256SUMS.pypi.win32-x64 differs from the receipt for %s' % wheel.name)
          with zipfile.ZipFile(wheel) as archive:
              data = archive.read(receipt['member'])
          if (hashlib.sha256(data).hexdigest(), len(data)) != (receipt['sha256'], receipt['bytes']):
              raise SystemExit('FAIL  the DLL in %s differs from the receipt' % wheel.name)
          shutil.move(str(path), os.path.join(os.environ['RUNNER_TEMP'], 'ipc-library.json'))
          print('ok    dist/ipc-library.json matches %s in %s: abstraction_ipc.dll sha256 %s'
                % (wheel.name, artifact, receipt['sha256']))
          PY

      # Producer outputs come from successful required jobs, not downloaded
      # producer JSON. A draft-only retry may consume a prior successful app
      # attempt in this same run; the sidecar names that attempt exactly.
      - name: verify optional adopter pairs from this candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMFYUI_ARTIFACT: ${{ needs.app_comfyui.outputs.artifact }}
          COMFYUI_SOURCE_COMMIT: ${{ needs.app_comfyui.outputs.source_commit }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          mkdir -p app-inputs
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from app_assets import roster, select_producers
          outputs = {
              app: {'artifact': os.environ[app.upper() + '_ARTIFACT'],
                    'source_commit': os.environ[app.upper() + '_SOURCE_COMMIT']}
              for app in ('comfyui',)}
          for app, artifact in select_producers(roster('apps.json'), outputs):
              destination = pathlib.Path('app-inputs') / app
              destination.mkdir()
              subprocess.run(['gh', 'run', 'download', os.environ['GITHUB_RUN_ID'],
                              '-n', artifact, '-D', str(destination)], check=True)
          pathlib.Path('app-producer-outputs.json').write_text(json.dumps(outputs, sort_keys=True) + '\n',
                                                                encoding='utf-8')
          PY
          python3 scripts/app_assets.py stage --roster apps.json \
            --inputs app-inputs --dist dist --metadata "$RUNNER_TEMP/apps.json" \
            --outputs app-producer-outputs.json --candidate-source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --predecessors "$APP_PRODUCERS"

      # Each line was computed by the job that made the bytes. Joining them is
      # not recomputing them, so the file is checked once more here against what
      # is actually about to be attached.
      - name: retain exact signed Windows container proof
        run: mv dist/windows-signatures.json "$RUNNER_TEMP/windows-signatures.json"
      - name: one checksum file, checked
        run: |
          (cd dist && cat SHA256SUMS.* > SHA256SUMS && rm SHA256SUMS.[a-z]*)
          (cd dist && sha256sum -c SHA256SUMS)
          n=$(grep -c . dist/SHA256SUMS)
          attached=$(ls dist | grep -cv '^SHA256SUMS$')
          if [ "$n" != "$attached" ]; then
            printf 'FAIL  SHA256SUMS has %s lines and %s files are attached\n' "$n" "$attached"
            exit 1
          fi
          cat dist/SHA256SUMS

      # NOTES.md is what is true of every release; this step is what only the
      # run knows. One script writes both the release body and the run summary,
      # because two scripts asserting the same state drifted apart once
      # already: v0.1.3 attached a signed, notarised, stapled `.pkg` under a
      # page that said in three places that nothing here was signed and that
      # macOS had no asset. The step below is what stops that recurring.
      - name: what only this run knows
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
          MACOS_STATE: ${{ needs.macos.outputs.state }}
          MACOS_MISSING: ${{ needs.macos.outputs.missing }}
          MACHINE_SERVICE: ${{ needs.verify.outputs.machine-service }}
        run: |
          [ -f NOTES.md ] || { printf 'FAIL  NOTES.md is not in this repository, and generated notes are not what this project ships\n'; exit 1; }
          rc=0
          for phrase in 'not signed' 'unsigned' 'no asset' '## Absent from' '## Signatures'; do
            if grep -qiF -- "$phrase" NOTES.md; then
              printf 'FAIL  NOTES.md says "%s". Only the run that built the assets may say that, and it says it here.\n' "$phrase"
              rc=1
            fi
          done
          [ "$rc" = 0 ] || exit 1
          {
            printf '\n## Signatures\n\n'
            printf -- '- **Windows** â€” `abstraction-x64.msi` and `abstraction-arm64.msi` are\n'
            printf -- '  **signed** with the reviewed OpenAbstractions code-signing certificate,\n'
            printf -- '  SHA-256 Authenticode and an RFC3161 SHA-256 timestamp.\n'
            printf -- '- **Windows Setup**: `OpenAbstractions-Setup-%s.exe`, which installs\n' "$CANDIDATE_VERSION"
            printf -- '  `abstraction-x64.msi` and offers each application MSI beside it, is\n'
            printf -- '  **signed** after each MSI, then its Burn engine and outer Setup.\n'
            printf -- '- **Linux** â€” the tarballs are **not signed**. There is no signature\n'
            printf -- '  scheme for them here.\n'
            if [ "$MACOS_STATE" = signed ]; then
              printf -- '- **macOS** â€” the `.pkg` **is signed**: a Developer ID Installer\n'
              printf -- '  certificate, notarised by Apple and stapled, and `openabstractions`\n'
              printf -- '  inside it signed with a Developer ID Application certificate with the\n'
              printf -- '  hardened runtime enabled. Signing is separate from installed-package\n'
              printf -- '  acceptance; consult the retained platform evidence for its scope.\n'
              printf '\nA checksum says the bytes\n'
              printf 'did not change in transit and nothing about who made them.\n'
            else
              printf '\nWindows outputs are signed. A checksum says the bytes did not change\n'
              printf 'in transit and nothing about who made them.\n'
            fi
            printf '\n## Absent from this release\n\n'
            if [ "$MACHINE_SERVICE" != proven ]; then
              printf -- '- **The Windows machine-scope supervisor was not proved on this run.**\n'
              printf -- '  Installing for everyone registers a per-user service, and this run saw\n'
              printf -- '  the registration and its restart policy but never saw an instance\n'
              printf -- '  running: the service manager clones one into a session at sign-in and\n'
              printf -- '  the runner had no session to clone into. Installing just for you is\n'
              printf -- '  unaffected and gets a Startup shortcut, which is what it has always\n'
              printf -- '  got.\n'
            fi
            case "$MACOS_STATE" in
              signed) ;;
              partial)
                printf -- '- **macOS**: no asset. Signing is configured in this repository and did\n'
                printf -- '  not run â€” `%s` is empty or missing â€” so the\n' "$MACOS_MISSING"
                printf -- '  `.pkg` was built, left unsigned and not attached. `go install` is the\n'
                printf -- '  route on macOS.\n' ;;
              *)
                printf -- '- **macOS**: no asset. A universal `.pkg` was built and kept as a\n'
                printf -- '  workflow artifact; unsigned and unnotarised, Gatekeeper refuses it,\n'
                printf -- '  and a download that cannot be opened is worse than a platform that\n'
                printf -- '  says it has no package. `go install` is the route on macOS.\n' ;;
            esac
            printf -- '- **C++ development libraries** are not bundled in this redistributable.\n'
            printf -- '  CMake package source is available at the corresponding layer repository\n'
            printf -- '  revision, including [abstraction-cas](https://github.com/openabstractions/abstraction-cas).\n'
            printf -- '- **Language SDK packages** are not bundled in this redistributable. Python\n'
            printf -- '  wheels, Rust crates and npm packages keep independent versions and release\n'
            printf -- '  status; this release makes no registry-publication claim for them. Their\n'
            printf -- '  source is available at the corresponding layer repository revisions.\n'
            printf -- '- **`jobd`, `dl` and `jobctl`** are removed in 0.2.0 with the file-store\n'
            printf -- '  provider. `openabstractions download` and `openabstractions jobs` replace\n'
            printf -- '  them. Downloads still in flight through the old file store are abandoned.\n'
          } > "$RUNNER_TEMP/state.md"
          cat NOTES.md "$RUNNER_TEMP/state.md" > "$RUNNER_TEMP/NOTES.md"
          cat "$RUNNER_TEMP/state.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/state.md"

      # The body above is written from $MACOS_STATE; these are the questions
      # that ask whether $MACOS_STATE is what is on the disk about to be
      # uploaded. Prose is not matched, because prose gets reworded and a check
      # that silently stops matching is how the last one failed â€” except for
      # the two words the rule requires and a reworder must not lose.
      - name: the body against the files, before either is published
        env:
          MACOS_STATE: ${{ needs.macos.outputs.state }}
        run: |
          rc=0
          pkgs=0
          for f in dist/*.pkg; do
            if [ -e "$f" ]; then pkgs=$((pkgs + 1)); fi
          done
          if [ "$MACOS_STATE" = signed ] && [ "$pkgs" -ne 1 ]; then
            printf 'FAIL  the body says a signed .pkg is attached and %s are here\n' "$pkgs"
            rc=1
          fi
          if [ "$MACOS_STATE" != signed ] && [ "$pkgs" -ne 0 ]; then
            printf 'FAIL  the body says macOS has no asset and %s .pkg files are here\n' "$pkgs"
            rc=1
          fi
          n=$(grep -c 'not signed' "$RUNNER_TEMP/state.md" || true)
          n=${n:-0}
          if [ "$n" -lt 1 ]; then
            printf 'FAIL  Linux is unsigned and the body says "not signed" %s times\n' "$n"
            rc=1
          fi
          [ "$rc" = 0 ] || exit 1
          printf 'ok    the body names %s .pkg, and says "not signed" %s times for the packages that are not\n' "$pkgs" "$n"

      - name: assemble the verified release artifact
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          PREVIEW: ${{ inputs.preview }}
          MACOS_STATE: ${{ needs.macos.outputs.state }}
        run: |
          mkdir verified-release
          cp dist/abstraction-x64.msi dist/abstraction-arm64.msi \
            dist/*-linux-amd64.tar.gz dist/*-linux-arm64.tar.gz \
            dist/SHA256SUMS "$RUNNER_TEMP/NOTES.md" verified-release/
          if [ "$MACOS_STATE" = signed ]; then cp dist/*.pkg verified-release/; fi
          python3 - <<'PY'
          import json, os, pathlib, shutil
          preview = os.environ['PREVIEW'].lower()
          if preview not in ('true', 'false'):
              raise SystemExit('preview must be a boolean')
          apps = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'apps.json').read_text(encoding='utf-8'))
          for app in apps:
              for role in ('binary', 'source'):
                  name = app[role]['name']
                  shutil.copyfile(pathlib.Path('dist') / name, pathlib.Path('verified-release') / name)
          candidate = {'schema': 1, 'source': os.environ['CANDIDATE_SHA'],
              'version': os.environ['RELEASE_VERSION'], 'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'preview': preview == 'true',
              'kind': 'release-candidate', 'windows_signing': json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-signatures.json').read_bytes()),
              'macos': os.environ['MACOS_STATE'], 'apps': apps}
          pathlib.Path('verified-release/candidate.json').write_text(json.dumps(candidate, indent=2) + '\n', encoding='utf-8')
          PY
          (cd verified-release && sha256sum -c SHA256SUMS)

      - name: retain the verified release for promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ github.run_attempt }}
          path: verified-release/
          if-no-files-found: error
          retention-days: 30

  # The existing Burn owner pins already signed core/application MSIs. App
  # assembly occurs before windows-msi-sign; the public verified release binds
  # the same signed core bytes. A fresh host signs the detached engine and
  # outer Setup after this build, followed by independent Windows verification.
  # Promotion consumes that exact setup-bundle-<attempt> and its final receipt.
  bundle:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: [candidate, draft, windows-msi-sign]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: consume exact windows-msi-signed producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-msi-sign.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-msi-sign.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-msi-sign.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-msi-signed-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed-msis
      - name: fetch the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n "verified-release-$GITHUB_RUN_ATTEMPT" -D verified-release
          (cd verified-release && sha256sum -c SHA256SUMS)

      # The same checked packages as the windows job: WixToolset.Bal.wixext
      # 5.0.2 (owner consent 2026-10-06) joins the tool and the UI extension.
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"

      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: pin the signed MSI chain
        run: python3 windows/windows_signing.py prepare-chain --root signed-msis --release verified-release --out setup --policy windows/certum_simplysign.json
      - name: the bundle
        run: |
          python3 windows/apps/build_bundle.py --chain setup/chain.json --bal-ext "$WIX_BAL_EXT" --out setup/bundle
          mkdir setup-dist
          cp setup/bundle/OpenAbstractions-Setup-"$CANDIDATE_VERSION".exe setup/bundle/bundle-receipt.json setup-dist/
          for msi in setup/apps/*/*.msi; do
            if [ -e "$msi" ]; then cp "$msi" setup-dist/; fi
          done
          (cd setup-dist && sha256sum ./*.exe ./*.json $(ls ./*.msi 2>/dev/null) | sed 's#\./##' | tee SHA256SUMS.setup)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          name: setup-bundle-raw-${{ github.run_attempt }}
          path: setup-dist/
          if-no-files-found: error
  windows-bundle-sign:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') && github.repository == 'openabstractions/redist' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/0.4.0' && github.actor == 'ReinisLusis' && github.triggering_actor == 'ReinisLusis' }}
    needs: [candidate, bundle, windows-msi-sign]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: signing
    env:
      OA_CERTUM_SIGNING_ONLY: '1'
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: consume exact setup-bundle-raw producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.bundle.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.bundle.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "setup-bundle-raw-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out setup-dist
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"
      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: download pinned SimplySign Desktop installer
        shell: pwsh
        run: |
          $policy = Get-Content windows/certum_simplysign.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $policy.installer.url -OutFile "$env:RUNNER_TEMP/simplysign.msi"
      - name: connect exact reviewed signing identity
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: >-
          ./windows/certum_simplysign.ps1 -Mode Connect
          -InstallerPath "$env:RUNNER_TEMP/simplysign.msi"
          -SessionPath "$env:RUNNER_TEMP/signing-session.json"
      - name: sign and verify detached engine then attached Setup
        run: python3 windows/windows_signing.py sign-bundle --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --root setup-dist --receipt setup-dist/bundle-receipt.json
      - name: disconnect owned signing session
        if: always()
        shell: pwsh
        run: >-
          ./windows/certum_simplysign.ps1 -Mode Disconnect
          -SessionPath "$env:RUNNER_TEMP/signing-session.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: setup-bundle-${{ github.run_attempt }}
          path: setup-dist/
          if-no-files-found: error

  windows-signing-probe-build:
    if: inputs.signing_probe_only
    needs: candidate
    runs-on: windows-latest
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"
      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: fixed hello EXE and minimal MSI
        run: python3 windows/windows_signing.py smoke-build --root smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-signing-probe-raw-${{ github.run_attempt }}
          path: smoke/
          if-no-files-found: error

  windows-signing-probe:
    if: inputs.signing_probe_only && github.repository == 'openabstractions/redist' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/0.4.0' && github.actor == 'ReinisLusis' && github.triggering_actor == 'ReinisLusis'
    needs: [candidate, windows-signing-probe-build]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: signing
    env:
      OA_CERTUM_SIGNING_ONLY: '1'
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: consume exact windows-signing-probe-raw producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-signing-probe-build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-signing-probe-build.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-signing-probe-build.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-signing-probe-raw-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out smoke
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: download pinned SimplySign Desktop installer
        shell: pwsh
        run: |
          $policy = Get-Content windows/certum_simplysign.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $policy.installer.url -OutFile "$env:RUNNER_TEMP/simplysign.msi"
      - name: connect exact reviewed signing identity
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: >-
          ./windows/certum_simplysign.ps1 -Mode Connect
          -InstallerPath "$env:RUNNER_TEMP/simplysign.msi"
          -SessionPath "$env:RUNNER_TEMP/signing-session.json"
      - name: fixed signing smoke and public proof
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          OA_JOB_INTENT: ${{ inputs.oa_job_intent }}
        run: python3 windows/windows_signing.py smoke-sign --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --root smoke --receipt smoke/signatures.json
      - name: disconnect owned signing session
        if: always()
        shell: pwsh
        run: >-
          ./windows/certum_simplysign.ps1 -Mode Disconnect
          -SessionPath "$env:RUNNER_TEMP/signing-session.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-signing-probe-${{ github.run_attempt }}
          path: smoke/
          if-no-files-found: error

  windows-bundle-verify:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: [candidate, windows-bundle-sign]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: admit exact setup-bundle bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-bundle-sign.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-bundle-sign.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-bundle-sign.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" --name "setup-bundle-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out setup-dist
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"
      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: independent signed Setup engine outer and MSI chain verification
        run: python3 windows/windows_signing.py verify-bundle --root setup-dist --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --receipt setup-dist/bundle-receipt.json
