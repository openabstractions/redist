              --artifact-id "$APP_CONTEXT_ARTIFACT_ID" --artifact-name "setup-bundle-$APP_CONTEXT_ARTIFACT_ATTEMPT"
              --artifact-digest "$APP_CONTEXT_ARTIFACT_DIGEST" --artifact-attempt "$APP_CONTEXT_ARTIFACT_ATTEMPT")
          fi
          python3 windows/windows_signing.py verify-bundle --root setup-dist --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --receipt setup-dist/bundle-receipt.json \
            --installed-inputs setup-installed-inputs.json --setup-fixture test_setup_runtime.ps1 \
            --source "$CANDIDATE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --version "$CANDIDATE_VERSION" "${args[@]}"
