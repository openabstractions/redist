          python3 windows/windows_signing.py sign-pe --scope runtime-owner --retained-signatures signed/provider-signatures.json --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --root signed --payload windows/payload.tsv --receipt signed/signatures.json --native-roster pypi.tsv
      - name: disconnect owned signing session
        if: always()
