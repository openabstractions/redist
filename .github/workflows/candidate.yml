          ARTIFACT_ID: ${{ needs.windows-runtime-build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-runtime-build.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-runtime-build.outputs.artifact-attempt }}
