name: verified release candidate
run-name: candidate ${{ inputs.version }} [oa-job:${{ inputs.oa_job_intent }}]

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (vMAJOR.MINOR.PATCH); no tag or release is created
        type: string
        required: true
      signing_probe_only:
        description: Fixed Windows signing smoke before release qualification; never a release candidate
        type: boolean
        default: false
      preview:
        description: >-
          Retain a verified preview artifact when the machine scope was not proven
          on this run. An incomplete candidate is something a person asked for by
          name and never something a run decided.
        type: boolean
        default: false
      pytorch_input_release_id:
        description: Authorized exact reviewed PyTorch draft input release ID; required when tools.tsv selects pytorchd
        type: string
        required: false
        default: ''
      pytorch_input_bundle_asset_id:
        description: Exact retained reviewed input ZIP asset ID in that draft
        type: string
        required: false
        default: ''
      pytorch_input_manifest_asset_id:
        description: Exact retained same-source owner manifest asset ID in that draft
        type: string
        required: false
        default: ''
      app_producer_only:
        description: Explicit first app producer; measures artifacts without enabling Setup or drafting a release
        type: choice
        options: [none, comfyui]
        default: none
      comfyui_producer_adopter_commit:
        description: Exact approved public ComfyUI adopter commit for producer-only mode
        type: string
        default: ''
      oa_job_intent:
        description: Stable OA Job intent ID for exact dispatch recovery
        type: string
        required: false
        default: ''

concurrency:
  # One cloud-signing account is shared by every candidate version and probe.
  group: redist-candidate-signing
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  WIX_VERSION: '5.0.2'
  # C declares P here only after real producer review. Empty means the strict
  # legacy same-run path. IDs/digests/inputs and derived evidence are literal
  # reviewed source inputs, never downloaded sidecar authority.
  APP_PRODUCERS: '{}'
  APP_PRODUCER_ONLY: ${{ inputs.app_producer_only || 'none' }}
  COMFYUI_PRODUCER_ADOPTER_COMMIT: ${{ inputs.comfyui_producer_adopter_commit }}

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      comfyui: ${{ steps.optional-apps.outputs.comfyui }}
      comfyui-predecessor: ${{ steps.optional-apps.outputs.comfyui-predecessor }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
      - name: validate an untagged candidate
        id: candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'FAIL version must be vMAJOR.MINOR.PATCH'; exit 1;
          }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'FAIL source must be a full lowercase public commit SHA'; exit 1;
          }
          IFS=. read -r major minor patch <<< "${RELEASE_VERSION#v}"
          [ "$major" -le 255 ] && [ "$minor" -le 255 ] && [ "$patch" -le 65535 ] || {
            echo 'FAIL version exceeds Windows Installer limits'; exit 1;
          }
          [ "$GITHUB_REF_TYPE" != tag ] || { echo 'FAIL dispatch from a branch, not an existing tag'; exit 1; }
          sha=$(git rev-parse HEAD)
          [ "$sha" = "$GITHUB_SHA" ] || { echo 'FAIL checkout differs from dispatch commit'; exit 1; }
          # A failed lookup must not be confused with an absent tag.
          refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION")
          [ -z "$refs" ] || { echo 'FAIL release tag already exists; choose a new version'; exit 1; }
          printf 'sha=%s\nversion=%s\n' "$sha" "${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: select authored optional app producers
        id: optional-apps
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from app_assets import optional_app_sources, roster, predecessor_pins
          rows = roster('apps.json')
          optional_app_sources('app-sources.tsv', rows)
          selected = {row['id'] for row in rows}
          predecessors = predecessor_pins(os.environ['APP_PRODUCERS'])
          mode = os.environ['APP_PRODUCER_ONLY']
          if mode not in ('none', 'comfyui'):
              raise SystemExit('unknown app producer-only mode')
          if mode != 'none':
              if selected or predecessors:
                  raise SystemExit('producer-only requires empty Setup catalog and no predecessor selection')
              selected = {mode}
          elif not set(predecessors) <= selected:
              raise SystemExit('app predecessor is not declared by current catalog')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              for app in ('comfyui',):
                  output.write(f'{app}={str(app in selected).lower()}\n')
                  output.write(f'{app}-predecessor={str(app in predecessors).lower()}\n')
          PY

  # The input job only admits the reviewed retained bytes. Draft visibility with
  # this token is proved by the authorized real run, and fails closed on refusal.
  pytorch-input:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.inputs.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: select the authored PyTorch executable
        id: selected
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from release_tsv_rows import rows
          selected = [row for row in rows(pathlib.Path('tools.tsv').read_text(), 'tools.tsv')
                      if row[0] == 'pytorchd.exe']
          if selected and (not selected[0][1].startswith('github.com/openabstractions/abstraction-provider-pytorch/go@')
                           or selected[0][2:] != ('cmd/pytorchd', 'pytorchimage', 'console')):
              raise ValueError('PyTorch executable has an unexpected owning module or feature')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'enabled={str(bool(selected)).lower()}\n')
          PY
      - name: intake exact reviewed draft input assets
        if: steps.selected.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
          INPUT_RELEASE_ID: ${{ inputs.pytorch_input_release_id }}
          INPUT_BUNDLE_ID: ${{ inputs.pytorch_input_bundle_asset_id }}
          INPUT_MANIFEST_ID: ${{ inputs.pytorch_input_manifest_asset_id }}
        run: |
          python3 windows/pytorch_engine.py intake --sources windows/sources.tsv \
            --source "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" \
            --release-id "$INPUT_RELEASE_ID" --bundle-asset-id "$INPUT_BUNDLE_ID" \
            --manifest-asset-id "$INPUT_MANIFEST_ID" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --output pytorch-input
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: inputs
        if: steps.selected.outputs.enabled == 'true'
        with:
          name: abstraction-pytorch-inputs-${{ github.run_attempt }}
          path: pytorch-input/
          compression-level: 0
          if-no-files-found: error
  windows-build:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') }}
    needs: [candidate, pytorch-input]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
      GOTOOLCHAIN: local
    outputs:
      engine-artifact-id: ${{ steps.engines.outputs.artifact-id }}
      engine-artifact-digest: ${{ steps.engines.outputs.artifact-digest }}
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - name: verify and consume the exact immutable PyTorch input artifact
        if: needs.pytorch-input.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          INPUT_ARTIFACT_ID: ${{ needs.pytorch-input.outputs.artifact-id }}
          INPUT_RELEASE_ID: ${{ inputs.pytorch_input_release_id }}
          INPUT_BUNDLE_ID: ${{ inputs.pytorch_input_bundle_asset_id }}
          INPUT_MANIFEST_ID: ${{ inputs.pytorch_input_manifest_asset_id }}
        run: |
          python3 windows/pytorch_engine.py consume --sources windows/sources.tsv \
            --source "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" \
            --release-id "$INPUT_RELEASE_ID" --bundle-asset-id "$INPUT_BUNDLE_ID" \
            --manifest-asset-id "$INPUT_MANIFEST_ID" --artifact-id "$INPUT_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output pytorch-input

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.pytorch-input.outputs.artifact-id != ''
        with:
          name: abstraction-pytorch-consumption-${{ github.run_attempt }}
          path: pytorch-input/pytorch-consumer-receipt.json
          if-no-files-found: error

      # Windows uses the pinned scoped SDK with the reviewed duplex-pipe fix.
      # Its recipe/source identity and race smoke are retained below.
      # GOTOOLCHAIN=local stops a go.mod line from fetching another SDK.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: select verified Windows Go SDK and smoke duplex pipes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 tools/windows_go_sdk.py --cache-dir "$RUNNER_TEMP/windows-go-sdk" --github-env --smoke-dir "$RUNNER_TEMP/windows-go-smoke" > windows-go-sdk-proof.json
          printf '\n### Verified Windows Go SDK and duplex race smoke\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat windows-go-sdk-proof.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: preserve Windows Go SDK source identity and smoke
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-go-sdk-${{ github.job }}-${{ github.run_attempt }}
          path: |
            windows-go-sdk-proof.json
            ${{ runner.temp }}/windows-go-smoke/named-pipe-race.log
            ${{ runner.temp }}/windows-go-smoke/smoke-receipt.json
          if-no-files-found: error

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          go version | tee go-version.txt
          dotnet --version
          git rev-parse HEAD

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-version-windows-${{ github.run_attempt }}
          path: go-version.txt
          if-no-files-found: error

      # candidate.json source is this exact redist commit. Program inputs come from
      # the immutable published module versions in tools.tsv; their repository tags
      # and public proxy resolution are checked below rather than represented as
      # source commits of this redist repository.
      #
      # Every version named here must exist before anything is built. This is
      # the whole point of the repository: the package is made of our published
      # artifacts, so a tag we deleted or never pushed stops the release here,
      # by name, instead of shipping.
      #
      # The repository is asked first and it is the authority: proxy.golang.org
      # serves a deleted tag forever, and it served service-jobd v0.2.0 for a
      # repository that has never had a tag â€” a release built on that answer is
      # built out of a cache. The proxy is asked second, and answers a different
      # question: whether `go install` can reach the version a stranger is told
      # to install.
      - name: verify and record published module provenance
        run: python3 scripts/module_provenance.py --tools tools.tsv --output module-provenance.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-provenance-${{ runner.os }}-${{ github.run_attempt }}
          path: module-provenance.json
          if-no-files-found: error

      - name: build from the published modules
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOFLAGS: -trimpath
        run: |
          python3 scripts/release_tsv_rows.py tools.tsv --output tools.rows
          root=$PWD
          for arch in amd64 arm64; do
            while IFS= read -r -d '' path && IFS= read -r -d '' module &&
                  IFS= read -r -d '' package && IFS= read -r -d '' feature &&
                  IFS= read -r -d '' subsystem; do
              mod=${module%@*}
              version=${module##*@}
              case "$package" in
                .) target="$mod@$version" ;;
                *) target="$mod/$package@$version" ;;
              esac
              ld='-s -w -buildid='
              case "$subsystem" in
                windows) ld="$ld -H=windowsgui" ;;
                console) ;;
                *) printf 'FAIL  %s has subsystem %s, which is console or windows\n' \
                     "$path" "$subsystem"; exit 1 ;;
              esac
              # GOBIN refuses a cross-compiled install, so these land in
              # GOPATH/bin under a name go chooses â€” at the root for the
              # runner's own arch, in windows_arm64/ for the other. Emptying it
              # first is what makes "the one file in there" a safe way to find
              # what this install just produced.
              gobin="$(go env GOPATH)/bin"
              for pass in a b; do
                mkdir -p "$root/$pass/$arch"
                rm -rf "$gobin"
                GOARCH="$arch" go install -ldflags "$ld" "$target"
                built=$(find "$gobin" -type f -name '*.exe')
                n=$(printf '%s\n' "$built" | sed '/^$/d' | wc -l)
                if [ "$n" -ne 1 ]; then
                  printf 'FAIL  %s produced %s binaries, expected 1\n' "$target" "$n"
                  exit 1
                fi
                mv "$built" "$root/$pass/$arch/$path"
              done
              printf 'built %s %s from %s\n' "$arch" "$path" "$target"
            done < tools.rows
          done

      - name: reproducible
        run: |
          rc=0
          n=0
          for f in a/*/*; do
            n=$((n + 1))
            if cmp -s "$f" "b/${f#a/}"; then
              printf 'ok    %s is byte-identical across two builds of one module version\n' "${f#a/}"
            else
              printf 'FAIL  %s differs between two builds of one module version\n' "${f#a/}"
              rc=1
            fi
          done
          if [ "$n" -lt 2 ]; then
            printf 'FAIL  binaries â€” %s inputs, and this rule cannot fail on fewer than 2\n' "$n"
            exit 1
          fi
          exit $rc

      # The publisher ZIP is an input only. The helper uses the same-source
      # modelhostd pin to check its exact digest and each kept file, then
      # creates the separately pinned 24-file bundle; excluded RPC/CLI tools
      # never enter the MSI payload directory.
      - name: derive exact reviewed ModelHost engine bundle
        run: |
          if [ -f a/amd64/modelhostd.exe ]; then
            mkdir -p engine-input publisher-input
            a/amd64/modelhostd.exe engine pin --json > engine-input/pin.json
            python3 windows/modelhost_engine.py fetch \
              --pin engine-input/pin.json \
              --source publisher-input/llama-b10825-bin-win-vulkan-x64.zip
            python3 windows/modelhost_engine.py derive \
              --pin engine-input/pin.json \
              --source publisher-input/llama-b10825-bin-win-vulkan-x64.zip \
              --bundle engine-input/llama-b10825-oa-win-vulkan-x64.zip \
              --receipt engine-input/llama-b10825-oa-win-vulkan-x64.receipt.json
          else
            printf 'note  no qualified modelhostd binary; ModelHost is gated out of the x64 MSI\n'
          fi

      # Genuine native inputs and their reviewed artifact provenance remain a
      # release hold. This guard consumes the explicit prepared directory; it
      # does not discover personal Python/wheels or invent an artifact receipt.
      - name: require reviewed PyTorch runtime inputs
        run: |
          if [ -f a/amd64/pytorchd.exe ]; then
            bundle=pytorch-input/pytorch-2.11.0-rocm7.13.0-cpython3.12.10-gfx1151-inputs.zip
            manifest=pytorch-input/pytorch-2.11.0-rocm7.13.0-cpython3.12.10-gfx1151-inputs.manifest.json
            if [ ! -f "$bundle" ] || [ ! -f "$manifest" ] || [ ! -f pytorch-input/pytorch-consumer-receipt.json ]; then
              printf 'FAIL  PyTorch requires genuine prepared native inputs and the same-source owner manifest; input provenance remains a release hold\n'
              exit 1
            fi
            python3 windows/pytorch_engine.py verify --manifest "$manifest" --bundle "$bundle"
          else
            printf 'note  no qualified pytorchd binary; PyTorchImage is gated out of the MSI\n'
          fi

      # windows/wix_packages.py fetches wix.5.0.2.nupkg and the extension
      # packages from nuget.org and refuses any whose size or SHA-256 differs
      # from its record; the tool installs through a nuget.config whose only
      # source is that checked folder (<clear/> drops nuget.org), and the
      # extension DLLs are passed by path.
      - name: retain only runtime build and reviewed engine inputs
        run: |
          mkdir raw-windows
          cp -r a raw-windows/
          mkdir windows-engine-inputs
          printf 'Reviewed optional engine inputs from this Windows build.\n' > windows-engine-inputs/README.txt
          for directory in engine-input pytorch-input; do
            if [ -d "$directory" ]; then cp -r "$directory" windows-engine-inputs/; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-raw-${{ github.run_attempt }}
          path: raw-windows/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: engines
        with:
          name: windows-engine-inputs-${{ github.run_attempt }}
          path: windows-engine-inputs/
          if-no-files-found: error
  windows-native-build:
    if: ${{ !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '' || inputs.app_producer_only == 'comfyui') }}
    needs: candidate
    runs-on: windows-latest
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.23.3'

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          node --version
          npm --version
          cmake --version | head -1

      # A commit is the identity of a JavaScript directory here: these
      # directories carry no tag of their own, and a release built from a moving
      # ref is a release nobody can rebuild. Each checkout is checked against
      # the row that asked for it.
      - name: check out the published JavaScript sources
        run: |
          python3 scripts/release_tsv_rows.py npm.tsv --output npm.rows
          while IFS= read -r -d '' package && IFS= read -r -d '' repository &&
                IFS= read -r -d '' commit && IFS= read -r -d '' directory; do
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'FAIL  %s names %s, which is not a full lowercase commit\n' "$package" "$commit"
              exit 1
            fi
            name=${repository#*/}
            [ -d "sources/$name" ] || git clone --quiet "https://github.com/$repository.git" "sources/$name"
            git -C "sources/$name" checkout --quiet "$commit"
            head=$(git -C "sources/$name" rev-parse HEAD)
            if [ "$head" != "$commit" ]; then
              printf 'FAIL  %s checked out %s, not %s\n' "$repository" "$head" "$commit"
              exit 1
            fi
            if [ ! -f "sources/$name/$directory/package.json" ]; then
              printf 'FAIL  %s has no package.json in %s\n' "$repository" "$directory"
              exit 1
            fi
            printf 'ok    %s from %s %s\n' "$package" "$repository" "$commit"
          done < npm.rows

      # Exact Node-API header tarball and, on Windows, the matching official
      # Node runtime ZIP and its separately published same-version win-x64
      # import library. All three inputs are bounded and SHA-checked
      # before a compiler sees them; the archives travel with the npm artifact.
      - name: pinned Node-API and import-library build inputs
        run: |
          test "$(node --version)" = v22.23.3 || { printf 'FAIL  Node build version changed\n'; exit 1; }
          options=()
          if [ "$RUNNER_OS" = Windows ]; then options=(--windows); fi
          python3 sources/abstractions/adopters/opencode/node_build_inputs.py \
            --output-root build/node-inputs "${options[@]}"
          printf 'NODE_INCLUDE_DIR=%s\n' "$PWD/build/node-inputs/node-api-headers/include" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            printf 'NODE_IMPORT_LIBRARY=%s\n' "$PWD/build/node-inputs/node.lib" >> "$GITHUB_ENV"
          fi

      # Two builds of one source: the shared library Bun opens through bun:ffi,
      # and the static archive the Node addon links into itself. The addon's
      # CMakeLists refuses a shared package for exactly that reason.
      - name: build the shared C ABI library and the Node addon
        env:
          ARCHITECTURES: ''
        run: |
          identity=sources/abstraction-identity
          arch=()
          [ -z "$ARCHITECTURES" ] || arch=(-DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURES")
          node_lib=()
          [ -z "${NODE_IMPORT_LIBRARY:-}" ] || node_lib=(-DNODE_IMPORT_LIBRARY="$NODE_IMPORT_LIBRARY")
          portable=()
          if [ "$RUNNER_OS" = Windows ]; then portable=(-DABSTRACTION_IPC_PORTABLE_WINDOWS=ON); fi
          cmake -S "$identity/cpp" -B build/shared -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DABSTRACTION_IPC_BUILD_TESTS=OFF "${arch[@]}" "${portable[@]}"
          cmake --build build/shared --config Release
          cmake -S "$identity/cpp" -B build/static -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DABSTRACTION_IPC_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix" "${arch[@]}"
          cmake --build build/static --config Release
          cmake --install build/static --config Release
          cmake -S "$identity/javascript" -B build/addon -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DNODE_INCLUDE_DIR="$NODE_INCLUDE_DIR" \
            "${node_lib[@]}" "${arch[@]}"
          cmake --build build/addon --config Release
          case "$RUNNER_OS" in
            Windows) library=abstraction_ipc.dll ;;
            Linux) library=libabstraction_ipc.so ;;
            macOS) library=libabstraction_ipc.dylib ;;
          esac
          mkdir -p native
          cp "$(find build/shared -name "$library" -type f | head -1)" "native/$library"
          cp "$(find build/addon -name oa_ipc_node.node -type f | head -1)" native/oa_ipc_node.node
          printf 'IPC_LIBRARY=%s\n' "$PWD/native/$library" >> "$GITHUB_ENV"
          printf 'IPC_ADDON=%s\n' "$PWD/native/oa_ipc_node.node" >> "$GITHUB_ENV"
          ls -l native

      - name: bind the canonical DLL to the Python and npm source pins
        run: |
          python3 windows/windows_signing.py check-native-source --pypi pypi.tsv --npm npm.tsv
          mkdir -p native/build-inputs
          cp build/node-inputs/node-api-headers-1.9.0.tgz build/node-inputs/node-v22.23.3-win-x64.zip \
            build/node-inputs/node-v22.23.3-win-x64.lib build/node-inputs/receipt.json native/build-inputs/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-native-raw-${{ github.run_attempt }}
          path: native/
          if-no-files-found: error

  windows-pe-sign:
    if: ${{ always() && !inputs.signing_probe_only && needs.windows-native-build.result == 'success' && (needs.windows-build.result == 'success' || (inputs.app_producer_only == 'comfyui' && needs.windows-build.result == 'skipped')) && github.repository == 'openabstractions/redist' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/0.4.0' && github.actor == 'ReinisLusis' && github.triggering_actor == 'ReinisLusis' }}
    needs: [candidate, windows-build, windows-native-build]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: signing
    env:
      OA_CERTUM_SIGNING_ONLY: '1'
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - if: needs.windows-build.result == 'success'
        name: consume exact windows-raw producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-build.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-build.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-raw-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed/runtime
      - name: consume exact windows-native-raw producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-native-build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-native-build.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.windows-native-build.outputs.artifact-attempt }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST" \
            --name "windows-native-raw-$ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out signed/native
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: download pinned SimplySign Desktop installer
        shell: pwsh
        run: |
          $policy = Get-Content windows/certum_simplysign.json -Raw | ConvertFrom-Json
