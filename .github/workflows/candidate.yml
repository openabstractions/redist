    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (!inputs.core_only && !inputs.diagnostic_host_sign_only && (always() && needs.candidate.result == 'success' && inputs.producer_mode == 'train' && !inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '') && (needs.candidate.outputs.required-products == '[]' || (needs.javascript.result == 'success' && needs.python.result == 'success' && needs.windows-sdk-sign.result == 'success' && (needs.app_comfyui.result == 'success' || (needs.candidate.outputs.native-comfyui != 'true' && needs.app_comfyui.result == 'skipped'))))))) }}
