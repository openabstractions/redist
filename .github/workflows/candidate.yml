          $inputs = Get-Content -LiteralPath setup-installed-inputs.json -Raw | ConvertFrom-Json
          $bundle = Join-Path (Resolve-Path setup-dist).Path $inputs.bundle.name
          $fixture = (Resolve-Path test_setup_runtime.ps1).Path
          $result = Join-Path $PWD 'setup-installed-diagnostics'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $fixture -HostedElevated -BundlePath $bundle -BundleSha256 $inputs.bundle.sha256 -ExpectedRuntimeSha256 $inputs.runtime.sha256 -FixtureSha256 $inputs.fixture.sha256 -ModuleSha256 $inputs.module.sha256 -ArtifactSource $env:CANDIDATE_SHA -AcceptanceTool $env:CANDIDATE_SHA -Version $env:CANDIDATE_VERSION -ResultDirectory $result
