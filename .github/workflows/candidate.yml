        run: |
          cp -r signed/runtime/* .
          python3 windows/windows_signing.py verify-pe --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --root signed --payload windows/payload.tsv --receipt pe-verification.json --native-roster pypi.tsv --github-env "$GITHUB_ENV"
          for arch in x64 arm64; do
            python3 windows/windows_signing.py verify-pe --policy windows/certum_simplysign.json --signtool "$SIGNTOOL" --root signed --payload windows/payload.tsv --receipt "pe-verification-$arch.json" --native-roster pypi.tsv \
                --program-architecture "$arch" --runtime-build-attempt "${{ needs.windows-runtime-build.outputs.artifact-attempt }}" \
                --program-tools tools.tsv --program-graph public-go-graph.json --program-archive public-go-graph.zip
