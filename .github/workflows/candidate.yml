          path: signed/
          if-no-files-found: error
  windows:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (!cancelled() && needs.python.result == 'success' && (inputs.producer_mode == 'train' && needs.windows-runtime-sign.result == 'success') && inputs.app_delivery_only != 'comfyui' && (!inputs.diagnostic_host_sign_only && (inputs.producer_mode != 'train-graph' && (!inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '')))))) }}
    needs: [source-guard, candidate, windows-build, windows-pe-sign, windows-runtime-build, windows-runtime-sign, python]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
