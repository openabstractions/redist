        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: pinned WiX packages
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"
      - name: wix
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: fixed hello EXE and minimal MSI
        run: python3 windows/windows_signing.py smoke-build --root smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-signing-probe-raw-${{ github.run_attempt }}
          path: smoke/
          if-no-files-found: error

  windows-signing-probe:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (inputs.app_delivery_only != 'comfyui' && (!inputs.diagnostic_host_sign_only && (inputs.producer_mode != 'train-graph' && (inputs.signing_probe_only && github.repository == 'openabstractions/redist' && github.event_name == 'workflow_dispatch' && (inputs.producer_mode == 'train' && github.ref == format('refs/heads/release/{0}', needs.candidate.outputs.version)) && github.actor == 'ReinisLusis' && github.triggering_actor == 'ReinisLusis'))))) }}
    needs: [source-guard, candidate, windows-signing-probe-build]
    runs-on: windows-latest
