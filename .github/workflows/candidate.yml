name: Windows runtime candidate
on:
  workflow_dispatch:
    inputs:
      redist_sha:
        description: Exact redist commit containing this workflow and the installer fixture
        required: true
        type: string
      charter_sha:
        description: Published abstractions commit containing the central runtime and status command
        required: true
        type: string
      download_sha:
        description: Published abstraction-download commit the central command's download module must resolve to
        required: true
        type: string
      job_sha:
        description: Published abstraction-job commit the central command's job module must resolve to
        required: true
        type: string
      version:
        description: MSI test version in MAJOR.MINOR.PATCH form; no tag or release is created
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly -trimpath'
      CGO_ENABLED: '0'
      REDIST_SHA: ${{ inputs.redist_sha }}
      CHARTER_SHA: ${{ inputs.charter_sha }}
      DOWNLOAD_SHA: ${{ inputs.download_sha }}
      JOB_SHA: ${{ inputs.job_sha }}
      CANDIDATE_VERSION: ${{ inputs.version }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: validate immutable inputs
        shell: python
        run: |
          import os, re, subprocess
          for key in ('REDIST_SHA', 'CHARTER_SHA', 'DOWNLOAD_SHA', 'JOB_SHA'):
              if not re.fullmatch('[0-9a-f]{40}', os.environ[key]):
                  raise SystemExit(f'{key} must be a full lowercase public commit SHA')
          if os.environ['REDIST_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Dispatched redist commit differs from redist_sha')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['REDIST_SHA']:
              raise SystemExit('Redist checkout differs from requested commit')
          version = os.environ['CANDIDATE_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('MSI version must be MAJOR.MINOR.PATCH')
          if any(int(n) > bound for n, bound in zip(version.split('.'), (255, 255, 65535))):
              raise SystemExit('MSI version exceeds Windows Installer limits')
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstractions
          ref: ${{ inputs.charter_sha }}
          path: source-charter
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-download
          ref: ${{ inputs.download_sha }}
          path: source-download
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-job
          ref: ${{ inputs.job_sha }}
          path: source-job
          persist-credentials: false
      # The release workflow's Go, so a candidate's programs are the bytes a
      # release of the same sources builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: record the Go toolchain
        shell: bash
        run: go version | tee go-version.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-version-windows
          path: go-version.txt
          if-no-files-found: error
      - name: verify source and dependency provenance
        shell: python
        run: |
          import json, os, pathlib, subprocess
          sources = {'source-charter': 'CHARTER_SHA', 'source-download': 'DOWNLOAD_SHA', 'source-job': 'JOB_SHA'}
          evidence = {'redist': os.environ['REDIST_SHA'], 'sources': {}, 'dependencies': {}}
          for directory, key in sources.items():
              actual = subprocess.check_output(['git', '-C', directory, 'rev-parse', 'HEAD'], text=True).strip()
              if actual != os.environ[key]:
                  raise SystemExit(f'{directory} checkout differs from requested commit')
              evidence['sources'][directory] = actual
          def modules(raw):
              decoder = json.JSONDecoder()
              while raw.strip():
                  value, end = decoder.raw_decode(raw.lstrip())
                  yield value
                  raw = raw.lstrip()[end:]
          expected = {'github.com/openabstractions/abstraction-download/go': os.environ['DOWNLOAD_SHA'],
                      'github.com/openabstractions/abstraction-job/go': os.environ['JOB_SHA']}
          for directory in ('source-charter/serve', 'source-charter/monitor', 'source-download/go', 'source-job/go'):
              selected = list(modules(subprocess.check_output(['go', 'list', '-m', '-json', 'all'], cwd=directory, text=True)))
              if not selected or sum(bool(item.get('Main')) for item in selected) != 1:
                  raise SystemExit(f'{directory} must select one main module')
              if directory == 'source-charter/serve' and 'github.com/openabstractions/abstraction-download/go' not in {item.get('Path') for item in selected}:
                  raise SystemExit(f'{directory} is missing its required download dependency')
              closure = []
              for item in selected:
                  if item.get('Replace') or item.get('Error'):
                      raise SystemExit(f'{directory} has a replaced or unresolved module: {item.get("Path")}')
                  if item.get('Main'):
                      closure.append(item)
                      continue
                  if not item.get('Path') or not item.get('Version'):
                      raise SystemExit(f'{directory} dependency lacks an immutable module version')
                  downloaded = json.loads(subprocess.check_output(['go', 'mod', 'download', '-json', item['Path']+'@'+item['Version']], cwd=directory, text=True))
                  if downloaded.get('Replace') or downloaded.get('Error') or not downloaded.get('Sum') or not downloaded.get('GoModSum'):
                      raise SystemExit(f'{directory} dependency lacks verified downloaded content: {item["Path"]}')
                  if item['Path'] in expected and downloaded.get('Origin', {}).get('Hash') != expected[item['Path']]:
                      raise SystemExit(f'{directory} dependency does not identify the requested source SHA: {item["Path"]}')
                  closure.append({'selected': item, 'download': downloaded})
              evidence['dependencies'][directory] = closure
          pathlib.Path('dist').mkdir()
          pathlib.Path('dist/source-provenance.json').write_text(json.dumps(evidence, indent=2))
          pathlib.Path('dist/tools.tsv').write_bytes(pathlib.Path('tools.tsv').read_bytes())
      - name: build Windows programs from pinned public sources
        shell: python
        run: |
          import json, os, pathlib, subprocess
          # The Panel filename contains spaces; columns are separated by tabs.
          rows = [[part.strip() for part in line.split('\t') if part.strip()] for line in pathlib.Path('tools.tsv').read_text().splitlines() if line.strip() and not line.startswith('>')][1:]
          overrides = {'openabstractions.exe': ('source-charter/serve', '.'), 'openabstractionsw.exe': ('source-charter/serve', '.'), 'Abstraction Panel.exe': ('source-charter/monitor', '.')}
          names = [row[0] for row in rows]
          if len(names) != len(set(names)) or set(names) != set(overrides):
              raise SystemExit('tools.tsv must contain each required runtime program exactly once')
          for arch in ('amd64', 'arm64'):
              output = pathlib.Path('binaries', arch).resolve()
              output.mkdir(parents=True)
              env = dict(os.environ, GOOS='windows', GOARCH=arch)
              for name, module_version, package, feature, subsystem in rows:
                  if pathlib.PureWindowsPath(name).name != name or subsystem not in ('console', 'windows'):
                      raise SystemExit('Invalid program filename or subsystem')
                  flags = '-s -w -buildid=' + (' -H=windowsgui' if subsystem == 'windows' else '')
                  directory, target = overrides[name]
                  subprocess.run(['go', 'build', '-ldflags='+flags, '-o', str(output/name), target], cwd=directory, env=env, check=True)
          evidence_path = pathlib.Path('dist/source-provenance.json')
          evidence = json.loads(evidence_path.read_text())
          evidence['programs'] = {name: {'directory': directory, 'package': target} for name, (directory, target) in overrides.items()}
          evidence_path.write_text(json.dumps(evidence, indent=2))
      - name: assemble unsigned Windows packages
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension failed' }
          foreach ($arch in @('x64','arm64')) {
            $goarch = if ($arch -eq 'x64') { 'amd64' } else { 'arm64' }
            python windows/build.py --arch $arch --version $env:CANDIDATE_VERSION --out "package-$arch" --bin "binaries/$goarch" --license LICENSE
            if ($LASTEXITCODE -ne 0) { throw "Package $arch failed" }
            python windows/validate.py "package-$arch/abstraction-$arch.msi"
            if ($LASTEXITCODE -ne 0) { throw "Package $arch validation failed" }
            Copy-Item "package-$arch/abstraction-$arch.msi" dist/
          }
          $lines = foreach ($arch in @('x64','arm64')) {
            $name = "abstraction-$arch.msi"
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: abstraction-windows-unsigned
          path: dist/
          if-no-files-found: error

  # Every Windows assertion that needs a hosted runner, against the package the
  # job above built. One dispatch of this workflow qualifies the candidate:
  # per-user fresh, upgrade, non-default-folder upgrade, forced failed upgrade
  # with the predecessor running again, same-version forced failure restarted by
  # Restart Manager, unscoped non-admin, elevated refusal, machine forced failed
  # upgrade with an instance in a second session, machine upgrade, registration,
  # fresh session and removal.
  windows-qualification:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      # The published release an upgrade is qualified from, in one place: the
      # download, the recorded provenance and the version the fixture asserts
      # all read it. v0.1.7's Startup shortcut runs `jobdw start --runtime`, and
      # from 0.1.8 it runs `openabstractionsw serve host`; the fixture picks the
      # activation from the version it is given.
      PREDECESSOR_RELEASE: v0.1.7
      PREDECESSOR_VERSION: 0.1.7
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: fetch the candidate package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID -n abstraction-windows-unsigned -D pkg
          if ($LASTEXITCODE -ne 0) { throw 'Candidate package download failed' }
          $checked = @{}
          foreach ($line in Get-Content pkg/SHA256SUMS.windows) {
            if ($line -notmatch '^([a-f0-9]{64})\s+\*?(abstraction-(?:x64|arm64)\.msi)$') { throw 'Unexpected checksum entry' }
            $expected = $Matches[1]; $file = $Matches[2]
            if ((Get-FileHash "pkg/$file" -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "Checksum mismatch: $file" }
            if ($checked.ContainsKey($file)) { throw 'Duplicate checksum entry' }
            $checked[$file] = $true
          }
          if ($checked.Count -ne 2) { throw 'Expected checksums for both Windows packages' }
          exit 0
      - name: fetch reviewed predecessor package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download $env:PREDECESSOR_RELEASE --repo openabstractions/redist --pattern abstraction-x64.msi --pattern SHA256SUMS --dir predecessor
          if ($LASTEXITCODE -ne 0) { throw 'Published predecessor download failed' }
      - name: verify predecessor checksum
        shell: python
        run: |
          import hashlib, json, os, pathlib, re
          package = pathlib.Path('predecessor/abstraction-x64.msi')
          if not package.is_file() or package.stat().st_size == 0:
              raise SystemExit('Published predecessor MSI is missing or empty')
          entries = []
          for line in pathlib.Path('predecessor/SHA256SUMS').read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64}) [ *]abstraction-x64\.msi', line)
              if match:
                  entries.append(match[1])
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          if entries != [actual]:
              raise SystemExit('Published predecessor checksum is absent, duplicated or mismatched')
          release = os.environ['PREDECESSOR_RELEASE']
          if release != 'v'+os.environ['PREDECESSOR_VERSION']:
              raise SystemExit('The predecessor release and the version the fixture asserts name different versions')
          pathlib.Path('predecessor-source.json').write_text(json.dumps({'release': release, 'repository': 'openabstractions/redist', 'file': package.name, 'sha256': actual}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PREDECESSOR_SHA256='+actual+'\n')
      - name: prepare the forced-failure machine candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force failing | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode FailingCandidate -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -Output (Join-Path (Resolve-Path failing).Path 'abstraction-x64.msi')
          if ($LASTEXITCODE -ne 0) { throw "Forced-failure candidate preparation exited $LASTEXITCODE" }
      - name: what this runner can show
        shell: pwsh
        run: |
          $me = (Get-Process -Id $PID).SessionId
          "this job runs in session $me"
          try { & query.exe session } catch { 'query.exe is not on this runner' }
          "interactive=$(if ($me -eq 0) { 0 } else { 1 })" >> $env:GITHUB_ENV
          exit 0
      - name: configure disposable consumer MSI policy
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'MSI policy fixture requires a disposable GitHub Windows runner' }
          if ((Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).ProductType -ne 3) { throw 'MSI policy fixture requires Windows Server' }
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          $statePath = Join-Path $env:RUNNER_TEMP 'oa-msi-policy.json'
          if (Test-Path -LiteralPath $statePath -ErrorAction Stop) { throw 'MSI policy baseline already exists' }
          $keyExists = Test-Path -LiteralPath $policy -ErrorAction Stop
          $state = @{ KeyExisted=$keyExists; ValueExisted=$false; Value=$null; Restored=$false }
          if ($keyExists) {
              $key = Get-Item -LiteralPath $policy -ErrorAction Stop
              try {
                  $state.ValueExisted = $key.GetValueNames() -contains 'DisableMSI'
                  if ($state.ValueExisted) {
                      if ($key.GetValueKind('DisableMSI') -ne [Microsoft.Win32.RegistryValueKind]::DWord) { throw 'Unexpected DisableMSI registry type' }
                      $state.Value = $key.GetValue('DisableMSI')
                      if ($state.Value -notin @(0,1,2)) { throw 'Unexpected DisableMSI registry value' }
                  }
              } finally { $key.Close() }
          }
          # Persist the original state before the first mutation, including setup failures.
          $state | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8 -ErrorAction Stop
          "DisableMSI baseline: key=$keyExists present=$($state.ValueExisted) value=$($state.Value)" | Tee-Object msi-policy.log
          if (-not $keyExists) { New-Item -Path $policy -Force -ErrorAction Stop | Out-Null }
          New-ItemProperty -LiteralPath $policy -Name DisableMSI -Value 0 -PropertyType DWord -Force -ErrorAction Stop | Out-Null
          if ((Get-ItemPropertyValue -LiteralPath $policy -Name DisableMSI -ErrorAction Stop) -ne 0) { throw 'DisableMSI test configuration did not take effect' }
          'Disposable test environment: DisableMSI=0 permits standard-user unmanaged installation' | Tee-Object -Append msi-policy.log
          exit 0
      - name: private non-admin installation and cross-tool compatibility
        shell: pwsh
        timeout-minutes: 8
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -CheckTools -PythonPath (Get-Command python.exe -ErrorAction Stop).Source -ResultDirectory user-runtime-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Per-user verification exited $LASTEXITCODE" }
      - name: private non-admin predecessor upgrade and reinstall
        shell: pwsh
        timeout-minutes: 12
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -PredecessorMsiPath (Resolve-Path predecessor/abstraction-x64.msi).Path -PredecessorSHA256 $env:PREDECESSOR_SHA256 -PredecessorVersion $env:PREDECESSOR_VERSION -ExpectedVersion $env:CANDIDATE_VERSION -ResultDirectory user-upgrade-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Per-user upgrade verification exited $LASTEXITCODE" }
      - name: private non-admin upgrade of a predecessor in a non-default folder
        shell: pwsh
        timeout-minutes: 12
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -PredecessorMsiPath (Resolve-Path predecessor/abstraction-x64.msi).Path -PredecessorSHA256 $env:PREDECESSOR_SHA256 -PredecessorVersion $env:PREDECESSOR_VERSION -ExpectedVersion $env:CANDIDATE_VERSION -PredecessorElsewhere -ResultDirectory user-elsewhere-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Non-default-folder upgrade verification exited $LASTEXITCODE" }
      # The rollback activation must leave the predecessor's supervisor running
      # again before msiexec returns: the 0.1.7 known issue this release fixes.
      - name: private non-admin forced failed upgrade rolls back to the running predecessor
        shell: pwsh
        timeout-minutes: 12
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -PredecessorMsiPath (Resolve-Path predecessor/abstraction-x64.msi).Path -PredecessorSHA256 $env:PREDECESSOR_SHA256 -PredecessorVersion $env:PREDECESSOR_VERSION -ExpectedVersion $env:CANDIDATE_VERSION -FailUpgrade -ResultDirectory user-failed-upgrade-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Forced failed upgrade verification exited $LASTEXITCODE" }
      # The candidate as its own predecessor: a registered host that ran 60
      # seconds is restarted by Restart Manager when the failed transaction ends.
      - name: private non-admin same-version forced failure restarts the host
        shell: pwsh
        timeout-minutes: 12
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -FailSameVersion -ResultDirectory user-same-version-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Same-version forced failure verification exited $LASTEXITCODE" }
      - name: an unscoped non-admin install lands in one scope
        shell: pwsh
        timeout-minutes: 8
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode Verify -MsiPath (Resolve-Path pkg/abstraction-x64.msi).Path -Unscoped -ResultDirectory user-unscoped-diagnostics
          if ($LASTEXITCODE -ne 0) { throw "Unscoped non-admin install verification exited $LASTEXITCODE" }
      # Each fixture run checked its own logs inside the disposable account.
      # This step reads the logs the runner collected from those accounts and
      # refuses mutated copies of each, so the checks are shown to bite on the
      # hosted log format: the upgrade exclusion order and its formatted folder,
      # and removals that finished with no reboot pending.
      - name: the collected per-user logs prove the upgrade order, the formatted folder and a finished removal
        shell: pwsh
        run: |
          $upgrade = 'user-upgrade-diagnostics/user-install.log|user-elsewhere-diagnostics/user-install.log'
          $removal = 'user-runtime-diagnostics/user-uninstall.log|user-upgrade-diagnostics/user-uninstall.log|user-elsewhere-diagnostics/user-uninstall.log|user-same-version-diagnostics/same-version-uninstall.log|user-unscoped-diagnostics/user-uninstall.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode CheckLogs -UpgradeLogs $upgrade -RemovalLogs $removal | Tee-Object hosted-log-checks.txt
          if ($LASTEXITCODE -ne 0) { throw "Collected per-user log checks exited $LASTEXITCODE" }
      - name: an elevated unscoped install is refused before anything is copied
        shell: pwsh
        timeout-minutes: 5
        run: |
          $msi = (Resolve-Path pkg\abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', '/norestart', '/l*v', 'elevated-unscoped.log')
          $log = Get-Content -LiteralPath elevated-unscoped.log -Raw -Encoding Unicode
          if ($p.ExitCode -ne 1603) { throw "an elevated install with no scope named exited $($p.ExitCode); the refusal returns 1603" }
          if ($log -notmatch 'Doing action: RefuseElevatedPerUserInstall\r?\n') { throw 'the elevated per-user refusal did not run' }
          if ($log -notmatch [regex]::Escape('pass ALLUSERS=1 to install for everyone')) { throw 'the refusal did not name its remedies' }
          foreach ($action in 'CostInitialize', 'InstallValidate', 'InstallInitialize', 'InstallFiles', 'StartUserRuntime') {
            if ($log -match "Doing action: $action\r?\n") { throw "the refused install still ran $action" }
          }
          foreach ($path in @((Join-Path $env:LOCALAPPDATA 'Programs\OpenAbstractions'), (Join-Path $env:ProgramFiles 'OpenAbstractions'),
                              'HKCU:\Software\OpenAbstractions', 'HKLM:\Software\OpenAbstractions',
                              (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\Abstraction supervisor.lnk'))) {
            if (Test-Path -LiteralPath $path) { throw "the refused install left $path" }
          }
          'ok    an elevated install with no scope named was refused before costing and left nothing behind'
          exit 0
      - name: restore disposable consumer MSI policy
        if: always()
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'MSI policy fixture requires a disposable GitHub Windows runner' }
          if ((Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).ProductType -ne 3) { throw 'MSI policy fixture requires Windows Server' }
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          $statePath = Join-Path $env:RUNNER_TEMP 'oa-msi-policy.json'
          if (-not (Test-Path -LiteralPath $statePath -ErrorAction Stop)) { 'No MSI policy mutation was recorded'; exit 0 }
          $state = Get-Content -LiteralPath $statePath -Raw -ErrorAction Stop | ConvertFrom-Json
          if ($state.KeyExisted -isnot [bool] -or $state.ValueExisted -isnot [bool] -or ($state.ValueExisted -and (-not $state.KeyExisted -or $state.Value -notin @(0,1,2)))) { throw 'Invalid MSI policy baseline' }
          if ($state.ValueExisted) {
              New-ItemProperty -LiteralPath $policy -Name DisableMSI -Value $state.Value -PropertyType DWord -Force -ErrorAction Stop | Out-Null
          } elseif (Test-Path -LiteralPath $policy -ErrorAction Stop) {
              $key = Get-Item -LiteralPath $policy -ErrorAction Stop
              try { $present = $key.GetValueNames() -contains 'DisableMSI' } finally { $key.Close() }
              if ($present) { Remove-ItemProperty -LiteralPath $policy -Name DisableMSI -ErrorAction Stop }
          }
          if (Test-Path -LiteralPath $policy -ErrorAction Stop) {
              $key = Get-Item -LiteralPath $policy -ErrorAction Stop
              try {
                  $present = $key.GetValueNames() -contains 'DisableMSI'
                  if ($present -ne $state.ValueExisted) { throw 'DisableMSI presence was not restored' }
                  if ($present -and ($key.GetValueKind('DisableMSI') -ne [Microsoft.Win32.RegistryValueKind]::DWord -or $key.GetValue('DisableMSI') -ne $state.Value)) { throw 'DisableMSI value was not restored' }
                  $empty = $key.GetValueNames().Count -eq 0 -and $key.GetSubKeyNames().Count -eq 0
              } finally { $key.Close() }
              if (-not $state.KeyExisted) {
                  if (-not $empty) { throw 'Refusing to remove a policy key with unrelated values' }
                  Remove-Item -LiteralPath $policy -ErrorAction Stop
              }
          } elseif ($state.KeyExisted) { throw 'Original MSI policy key disappeared' }
          $state.Restored = $true
          $state | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8 -ErrorAction Stop
          'DisableMSI baseline restored and verified' | Tee-Object -Append msi-policy.log
          exit 0
      # The machine predecessor is installed and a fresh account signs in over
      # RDP, so the SCM creates a per-session instance in a second session. The
      # failing copy replaces the files and refuses before the commit, so
      # RemoveExistingProducts never runs. The package stops nothing: Restart
      # Manager stops the instance through the SCM. Rollback must leave the
      # predecessor registered with its service template, release the machine
      # exclusion and leave that instance running.
      - name: machine forced failed upgrade rolls back to the predecessor
        id: machine-failed-upgrade
        shell: pwsh
        timeout-minutes: 20
        run: |
          $predecessor = (Resolve-Path predecessor\abstraction-x64.msi).Path
          $failing = (Resolve-Path failing\abstraction-x64.msi).Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($predecessor, 0)
          $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property``='ProductCode'")
          [void]$view.Execute(); $code = $view.Fetch().StringData(1); [void]$view.Close()
          "predecessor=$code" >> $env:GITHUB_OUTPUT
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $predecessor, '/qn', '/norestart', 'ALLUSERS=1', 'MSIINSTALLPERUSER=', '/l*v', 'machine-predecessor-install.log')
          if ($p.ExitCode -ne 0) { throw "machine predecessor install exited $($p.ExitCode)" }
          $statePath = "$env:RUNNER_TEMP/oa-predecessor-session.json"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File test_service_session.ps1 -Mode Verify -StatePath $statePath -ExpectedImage jobdw.exe
          if ($LASTEXITCODE -ne 0) { throw "Predecessor session fixture exited $LASTEXITCODE" }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          function Get-SessionInstances {
            @(Get-CimInstance Win32_Service -Filter "Name LIKE 'OpenAbstractionsSupervisor_%'" | Where-Object {
              $_.State -eq 'Running' -and $_.ProcessId -ne 0 -and
              @(Get-CimInstance Win32_Process -Filter "ProcessId=$($_.ProcessId)" | Where-Object SessionId -eq $state.Session).Count
            })
          }
          $before = @(Get-SessionInstances)
          if ($before.Count -ne 1) { throw "expected one running instance in the second session $($state.Session) before the failing upgrade; observed $($before.Count)" }
          "instance before the failing upgrade: $($before[0].Name) pid $($before[0].ProcessId) in session $($state.Session)"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $failing, '/qn', '/norestart', 'ALLUSERS=1', 'MSIINSTALLPERUSER=', '/l*v', 'machine-failed-upgrade.log')
          if ($p.ExitCode -ne 1603) { throw "the forced machine upgrade failure exited $($p.ExitCode); it must end with 1603" }
          $log = Get-Content -LiteralPath machine-failed-upgrade.log -Raw -Encoding Unicode
          $files = [regex]::Match($log, 'Action start [^\r\n]*: InstallFiles\.')
          $failure = [regex]::Match($log, 'Action start [^\r\n]*: ForcedUpgradeFailure\.')
          if (-not $files.Success -or -not $failure.Success -or $failure.Index -lt $files.Index) { throw 'the forced failure did not follow the new files' }
          if ([regex]::IsMatch($log, 'StopPrevious(User)?Supervisor')) { throw 'the package ran a stop action; it stops nothing' }
          if ([regex]::IsMatch($log, 'Action start [^\r\n]*: RemoveExistingProducts\.')) { throw 'the failed machine upgrade removed the predecessor; the removal must follow the commit it never reached' }
          if ($log.IndexOf('RestartPreviousSupervisor', $failure.Index) -lt 0) { throw 'rollback did not run the machine activation' }
          Select-String -LiteralPath machine-failed-upgrade.log -Encoding Unicode -Pattern 'RESTART MANAGER' | ForEach-Object Line
          if ($installer.ProductState($code) -ne 5) { throw 'rollback did not leave the machine predecessor installed' }
          & sc.exe qc OpenAbstractionsSupervisor | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "rollback did not restore the predecessor service template: sc qc exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'OpenAbstractions\tools\jobdw.exe'))) { throw 'rollback did not restore the predecessor programs' }
          $record = Join-Path $env:ProgramData 'abstraction\upgrade-v1\exclusion.json'
          if (Test-Path -LiteralPath $record) { throw "the machine upgrade exclusion survived rollback: $record" }
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $after = @(Get-SessionInstances | Where-Object Name -eq $before[0].Name)
            if ($after.Count -eq 1) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if ($after.Count -ne 1) { throw "the predecessor instance $($before[0].Name) in session $($state.Session) is not running after rollback" }
          $restarted = [int]$after[0].ProcessId -ne [int]$before[0].ProcessId
          "instance after rollback: $($after[0].Name) pid $($after[0].ProcessId) ($(if ($restarted) { 'restarted' } else { 'the same process: Restart Manager did not stop it' }))"
          "machine-instance-restarted=$restarted" >> $env:GITHUB_STEP_SUMMARY
          'ok    a failed machine upgrade left the predecessor installed, registered, with no exclusion and its session instance running'
          exit 0
      - name: remove the predecessor test session
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          if (Test-Path test_service_session.ps1) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File test_service_session.ps1 -Mode Cleanup -StatePath "$env:RUNNER_TEMP/oa-predecessor-session.json" 2>&1 | Tee-Object predecessor-session-cleanup.log
            if ($LASTEXITCODE -ne 0) { throw "Predecessor session cleanup exited $LASTEXITCODE" }
          }
          exit 0
      - name: machine upgrade holds the exclusion, stops nothing, and removes the predecessor after the commit
        id: machine-install
        shell: pwsh
        timeout-minutes: 10
        run: |
          $msi = (Resolve-Path pkg\abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', '/norestart', 'ALLUSERS=1', 'MSIINSTALLPERUSER=', '/l*v', 'machine-install.log')
          if ($p.ExitCode -ne 0) {
            Select-String -Path machine-install.log -Pattern 'Return value 3','Error [0-9]+','CustomAction .* returned' -Context 12,4 | Out-String -Width 300 | Write-Output
            throw "machine upgrade exited $($p.ExitCode)"
          }
          $log = Get-Content -LiteralPath machine-install.log -Raw -Encoding Unicode
          $removal = [regex]::Match($log, 'Action start [^\r\n]*: RemoveExistingProducts\.')
          if (-not $removal.Success) { throw 'the machine upgrade never removed the predecessor' }
          $before = $log.Substring(0, $removal.Index)
          foreach ($action in 'BeginMachineUpgradeExclusion', 'InstallExecute') {
            if ($before -notmatch "Action ended [^\r\n]*: $action\. Return value 1\.") { throw "$action did not succeed before RemoveExistingProducts" }
          }
          if ([regex]::IsMatch($log, 'StopPrevious(User)?Supervisor')) { throw 'the package ran a stop action; it stops nothing' }
          if ($log -notmatch 'EndMachineUpgradeExclusion') { throw 'the machine exclusion release was not scheduled' }
          # The removal follows the commit, and the predecessor's own uninstall
          # deletes the shared service name, so registration must come after it.
          $finalize = [regex]::Match($log, 'Action start [^\r\n]*: InstallFinalize\.')
          if (-not $finalize.Success -or $removal.Index -lt $finalize.Index) { throw 'the machine upgrade removed the predecessor before its own commit' }
          if ($log.Substring($removal.Index) -notmatch "Action ended [^\r\n]*: RegisterSupervisorAfterRemoval\. Return value 1\.") { throw 'the machine supervisor was not registered after the predecessor removal' }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          if ($installer.ProductState('${{ steps.machine-failed-upgrade.outputs.predecessor }}') -eq 5) { throw 'the machine predecessor is still installed after upgrade' }
          if (Test-Path -LiteralPath (Join-Path $env:ProgramData 'abstraction\upgrade-v1\exclusion.json')) { throw 'the machine upgrade exclusion survived commit' }
          'ok    the machine upgrade held its exclusion, stopped nothing itself, released the exclusion and registered the host after the removal'
          exit 0
      - name: the supervisor is registered, and registered as what it claims
        shell: pwsh
        run: |
          $text = (& sc.exe qc OpenAbstractionsSupervisor) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "sc qc exited $LASTEXITCODE" }
          $text
          if ($text -notmatch 'TYPE\s*:\s*50\s+USER_OWN_PROCESS\s+TEMPLATE') { throw 'the service is not a SERVICE_USER_OWN_PROCESS template' }
          if ($text -notmatch 'START_TYPE\s*:\s*2\s+AUTO_START') { throw 'the template is not AUTO_START' }
          if ($text -notmatch 'openabstractionsw\.exe" serve host --service') { throw 'the registered image is not openabstractionsw.exe serve host --service' }
          $qf = (& sc.exe qfailure OpenAbstractionsSupervisor) -join "`n"
          if ($qf -notmatch 'RESET_PERIOD[^:]*:\s*3600') { throw 'the reset period is not 3600' }
          foreach ($ms in 3000, 10000, 30000) {
            if ($qf -notmatch "RESTART -- Delay = $ms milliseconds") { throw "the $ms ms restart action is not configured" }
          }
          if (((& sc.exe qfailureflag OpenAbstractionsSupervisor) -join "`n") -notmatch 'FAILURE_ACTIONS_ON_NONCRASH_FAILURES\s*:\s*TRUE') { throw 'the non-crash failure flag is not set' }
          exit 0
      - name: fresh interactive session and crash recovery
        shell: pwsh
        timeout-minutes: 5
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File test_service_session.ps1 -Mode Verify -StatePath "$env:RUNNER_TEMP/oa-service-session.json"
          if ($LASTEXITCODE -ne 0) { throw "Fresh logon/recovery fixture exited $LASTEXITCODE" }
          exit 0
      # The host records its token's TokenElevation and TokenElevationType at
      # start. Kept as evidence of what token a per-user service instance runs
      # with; it decides nothing here.
      - name: the session host's startup diagnostics
        if: always()
        shell: pwsh
        run: |
          $statePath = "$env:RUNNER_TEMP/oa-service-session.json"
          if (-not (Test-Path -LiteralPath $statePath)) { 'no session was created'; exit 0 }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          $profile = @(Get-CimInstance Win32_UserProfile | Where-Object { $_.SID -eq $state.Sid } | ForEach-Object LocalPath)
          $log = if ($profile.Count -eq 1) { Join-Path $profile[0] 'AppData\Local\openabstractions\host\host.log' } else { $null }
          if (-not $log -or -not (Test-Path -LiteralPath $log)) { "host.log absent for the session account"; exit 0 }
          Copy-Item -LiteralPath $log -Destination machine-host.log
          Select-String -LiteralPath $log -Pattern 'serve host start' | ForEach-Object Line
          exit 0
      - name: uninstall for everyone
        if: always() && steps.machine-install.outcome == 'success'
        shell: pwsh
        run: |
          $msi = (Resolve-Path pkg\abstraction-x64.msi).Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/x', $msi, '/qn', '/norestart', '/l*v', 'machine-uninstall.log')
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
          # A zero exit is not an honest removal: refuse a log in which the Restart Manager
          # could not stop a process or a reboot operation was left pending.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test_user_runtime.ps1 -Mode CheckLogs -RemovalLogs machine-uninstall.log
          if ($LASTEXITCODE -ne 0) { throw "the machine removal log is not an honest removal: exit $LASTEXITCODE" }
          & sc.exe qc OpenAbstractionsSupervisor | Out-Null
          if ($LASTEXITCODE -ne 1060) { throw "the service template survived uninstall or its absence was not established: exit $LASTEXITCODE" }
          if (@(Get-Service -Name 'OpenAbstractionsSupervisor_*' -ErrorAction SilentlyContinue).Count) { throw 'a per-session instance survived uninstall' }
          foreach ($path in @((Join-Path $env:ProgramFiles 'OpenAbstractions'), 'HKLM:\Software\OpenAbstractions', (Join-Path $env:ProgramData 'abstraction'))) {
            if (Test-Path -LiteralPath $path) {
            if (-not $path.StartsWith('HKLM:')) {
              Get-ChildItem -LiteralPath $path -Recurse -Force | ForEach-Object {
                "left: $($_.FullName) $($_.Length)"
                if (-not $_.PSIsContainer -and $_.Length -lt 8192) { Get-Content -LiteralPath $_.FullName | ForEach-Object { "      $_" } }
              }
            }
            throw "uninstall left $path"
          }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File test_service_session.ps1 -Mode VerifyRemoved -StatePath "$env:RUNNER_TEMP/oa-service-session.json"
          if ($LASTEXITCODE -ne 0) { throw "Runtime removal verification exited $LASTEXITCODE" }
          exit 0
      - name: remove the machine predecessor left by a failed step
        if: always() && steps.machine-failed-upgrade.outputs.predecessor != ''
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          if ($installer.ProductState('${{ steps.machine-failed-upgrade.outputs.predecessor }}') -eq 5) {
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList @('/x', '${{ steps.machine-failed-upgrade.outputs.predecessor }}', '/qn', '/norestart', '/l*v', 'machine-predecessor-cleanup.log')
            if ($p.ExitCode -ne 0) { throw "machine predecessor cleanup exited $($p.ExitCode)" }
          }
          exit 0
      - name: remove only the disposable test session
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          if (Test-Path test_service_session.ps1) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File test_service_session.ps1 -Mode Cleanup -StatePath "$env:RUNNER_TEMP/oa-service-session.json" 2>&1 | Tee-Object service-session-cleanup.log
            if ($LASTEXITCODE -ne 0) { throw "Session cleanup exited $LASTEXITCODE" }
          }
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-qualification-diagnostics
          path: |
            predecessor-source.json
            msi-policy.log
            ${{ runner.temp }}/oa-msi-policy.json
            user-runtime-diagnostics/
            user-upgrade-diagnostics/
            user-elsewhere-diagnostics/
            user-failed-upgrade-diagnostics/
            user-same-version-diagnostics/
            user-unscoped-diagnostics/
            hosted-log-checks.txt
            elevated-unscoped.log
            machine-predecessor-install.log
            machine-failed-upgrade.log
            machine-install.log
            machine-host.log
            predecessor-session-cleanup.log
            machine-uninstall.log
            machine-predecessor-cleanup.log
            service-session.log
            service-session-cleanup.log

  posix:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          platform: linux
        - runner: macos-latest
          platform: macos
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly -trimpath
      CGO_ENABLED: '0'
      REDIST_SHA: ${{ inputs.redist_sha }}
      CHARTER_SHA: ${{ inputs.charter_sha }}
      DOWNLOAD_SHA: ${{ inputs.download_sha }}
      JOB_SHA: ${{ inputs.job_sha }}
      CANDIDATE_VERSION: ${{ inputs.version }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
      GOTOOLCHAIN: local
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - name: validate immutable inputs
      shell: python
      run: |
        import os, re, subprocess
        for key in ('REDIST_SHA', 'CHARTER_SHA', 'DOWNLOAD_SHA', 'JOB_SHA'):
            if not re.fullmatch('[0-9a-f]{40}', os.environ[key]):
                raise SystemExit(f'{key} must be a full lowercase public commit SHA')
        if os.environ['REDIST_SHA'] != os.environ['GITHUB_SHA']:
            raise SystemExit('Dispatched redist commit differs from redist_sha')
        if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['REDIST_SHA']:
            raise SystemExit('Redist checkout differs from requested commit')
        version = os.environ['CANDIDATE_VERSION']
        if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
            raise SystemExit('MSI version must be MAJOR.MINOR.PATCH')
        if any(int(n) > bound for n, bound in zip(version.split('.'), (255, 255, 65535))):
            raise SystemExit('MSI version exceeds Windows Installer limits')
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        repository: openabstractions/abstractions
        ref: ${{ inputs.charter_sha }}
        path: source-charter
        persist-credentials: false
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        repository: openabstractions/abstraction-download
        ref: ${{ inputs.download_sha }}
        path: source-download
        persist-credentials: false
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        repository: openabstractions/abstraction-job
        ref: ${{ inputs.job_sha }}
        path: source-job
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.8'
        cache: false
    - name: record the Go toolchain
      shell: bash
      run: go version | tee go-version.txt
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: go-version-${{ matrix.platform }}
        path: go-version.txt
        if-no-files-found: error
    - name: verify source and dependency provenance
      shell: python
      run: |
        import json, os, pathlib, subprocess
        sources = {'source-charter': 'CHARTER_SHA', 'source-download': 'DOWNLOAD_SHA', 'source-job': 'JOB_SHA'}
        evidence = {'redist': os.environ['REDIST_SHA'], 'sources': {}, 'dependencies': {}}
        for directory, key in sources.items():
            actual = subprocess.check_output(['git', '-C', directory, 'rev-parse', 'HEAD'], text=True).strip()
            if actual != os.environ[key]:
                raise SystemExit(f'{directory} checkout differs from requested commit')
            evidence['sources'][directory] = actual
        def modules(raw):
            decoder = json.JSONDecoder()
            while raw.strip():
                value, end = decoder.raw_decode(raw.lstrip())
                yield value
                raw = raw.lstrip()[end:]
        expected = {'github.com/openabstractions/abstraction-download/go': os.environ['DOWNLOAD_SHA'],
                    'github.com/openabstractions/abstraction-job/go': os.environ['JOB_SHA']}
        for directory in ('source-charter/serve', 'source-charter/monitor', 'source-download/go', 'source-job/go'):
            selected = list(modules(subprocess.check_output(['go', 'list', '-m', '-json', 'all'], cwd=directory, text=True)))
            if not selected or sum(bool(item.get('Main')) for item in selected) != 1:
                raise SystemExit(f'{directory} must select one main module')
            if directory == 'source-charter/serve' and 'github.com/openabstractions/abstraction-download/go' not in {item.get('Path') for item in selected}:
                raise SystemExit(f'{directory} is missing its required download dependency')
            closure = []
            for item in selected:
                if item.get('Replace') or item.get('Error'):
                    raise SystemExit(f'{directory} has a replaced or unresolved module: {item.get("Path")}')
                if item.get('Main'):
                    closure.append(item)
                    continue
                if not item.get('Path') or not item.get('Version'):
                    raise SystemExit(f'{directory} dependency lacks an immutable module version')
                downloaded = json.loads(subprocess.check_output(['go', 'mod', 'download', '-json', item['Path']+'@'+item['Version']], cwd=directory, text=True))
                if downloaded.get('Replace') or downloaded.get('Error') or not downloaded.get('Sum') or not downloaded.get('GoModSum'):
                    raise SystemExit(f'{directory} dependency lacks verified downloaded content: {item["Path"]}')
                if item['Path'] in expected and downloaded.get('Origin', {}).get('Hash') != expected[item['Path']]:
                    raise SystemExit(f'{directory} dependency does not identify the requested source SHA: {item["Path"]}')
                closure.append({'selected': item, 'download': downloaded})
            evidence['dependencies'][directory] = closure
        pathlib.Path('dist').mkdir()
        pathlib.Path('dist/source-provenance.json').write_text(json.dumps(evidence, indent=2))
        pathlib.Path('dist/tools.tsv').write_bytes(pathlib.Path('tools.tsv').read_bytes())
    - name: native POSIX shell fixtures
      shell: bash
      run: |
        python3 posix/test_lifecycle.py
    - name: build POSIX programs from pinned public sources
      shell: python
      run: |
        import hashlib, importlib.util, json, os, pathlib, re, subprocess
        spec = importlib.util.spec_from_file_location('packager', 'posix/build.py')
        packager = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(packager)
        platform = os.environ['PACKAGE_PLATFORM']
        if platform not in ('linux', 'macos'):
            raise SystemExit('Unsupported POSIX package platform')
        items = packager.payload(platform)
        names = [pathlib.PurePosixPath(path).name for path, kind, *_ in items if kind == 'gobuild']
        if len(names) != len(set(names)) or 'openabstractions' not in names:
            raise SystemExit('Required POSIX runtime payload is missing or duplicated')
        rows = [[part.strip() for part in line.split('\t') if part.strip()] for line in pathlib.Path('tools.tsv').read_text().splitlines() if line.strip() and not line.startswith('>')][1:]
        if any(len(row) != 5 for row in rows) or len({row[0] for row in rows}) != len(rows):
            raise SystemExit('Invalid or duplicate tools.tsv rows')
        tools = {row[0]: row for row in rows}
        overrides = {'openabstractions': ('source-charter/serve', '.')}
        plan, pins = {}, {}
        for name in names:
            if name+'.exe' not in tools or tools[name+'.exe'][4] != 'console':
                raise SystemExit('POSIX payload requires an explicit console tools.tsv entry')
            plan[name] = overrides[name]
            directory, target = plan[name]
            source = directory.split('/')[0]
            source_key = {'source-charter': 'CHARTER_SHA'}[source]
            pins[name] = {'directory': directory, 'package': target, 'sha': os.environ[source_key]}
        goos = 'linux' if platform == 'linux' else 'darwin'
        hashes = {}
        for arch in ('amd64', 'arm64'):
            output = pathlib.Path('binaries', arch).resolve()
            output.mkdir(parents=True)
            env = dict(os.environ, GOOS=goos, GOARCH=arch)
            for name, (directory, target) in plan.items():
                subprocess.run(['go', 'build', '-ldflags=-s -w -buildid=', '-o', str(output/name), target], cwd=directory, env=env, check=True)
                hashes[arch+'/'+name] = hashlib.sha256((output/name).read_bytes()).hexdigest()
        if platform == 'macos':
            pathlib.Path('binaries/universal').mkdir()
            for name in names:
                output = 'binaries/universal/'+name
                subprocess.run(['lipo', '-create', 'binaries/amd64/'+name, 'binaries/arm64/'+name, '-output', output], check=True)
                subprocess.run(['lipo', output, '-verify_arch', 'x86_64', 'arm64'], check=True)
                hashes['universal/'+name] = hashlib.sha256(pathlib.Path(output).read_bytes()).hexdigest()
        provenance = pathlib.Path('dist/source-provenance.json')
        evidence = json.loads(provenance.read_text())
        evidence.update(platform=platform, tools=pins, binary_sha256=hashes)
        provenance.write_text(json.dumps(evidence, indent=2))
    - name: assemble and inspect POSIX packages
      shell: python
      run: |
        import hashlib, importlib.util, json, os, pathlib, subprocess, tarfile
        platform, version = os.environ['PACKAGE_PLATFORM'], os.environ['CANDIDATE_VERSION']
        if platform not in ('linux', 'macos'):
            raise SystemExit('Unsupported package platform')
        packages = []
        for arch in (('amd64', 'arm64') if platform == 'linux' else ('universal',)):
            command = ['python3', 'posix/build.py', '--platform', platform, '--version', version, '--out', 'dist', '--bin', 'binaries/'+arch, '--license', 'LICENSE']
            if platform == 'linux':
                command += ['--arch', arch]
            subprocess.run(command, check=True)
            name = f'abstraction-{version}-linux-{arch}.tar.gz' if platform == 'linux' else f'abstraction-{version}-macos-universal.pkg'
            artifact = pathlib.Path('dist', name)
            if not artifact.is_file() or artifact.stat().st_size == 0:
                raise SystemExit('Packager did not produce the expected artifact')
            if platform == 'linux':
                with tarfile.open(artifact) as archive:
                    for program in ('openabstractions',):
                        member = archive.getmember(f'abstraction-{version}-linux-{arch}/payload/.local/bin/'+program)
                        if not member.isfile() or member.mode & 0o111 != 0o111 or archive.extractfile(member).read() != pathlib.Path('binaries', arch, program).read_bytes():
                            raise SystemExit('Linux package executable differs from verified input')
            else:
                subprocess.run(['pkgutil', '--expand-full', str(artifact), 'package-inspect'], check=True)
                for program in ('openabstractions',):
                    matches = list(pathlib.Path('package-inspect').glob('*/Payload/.local/bin/'+program))
                    if len(matches) != 1 or matches[0].read_bytes() != pathlib.Path('binaries/universal', program).read_bytes():
                        raise SystemExit('macOS package executable differs from verified universal input')
            packages.append(name)
        pathlib.Path('dist/SHA256SUMS.'+platform).write_text(''.join(hashlib.sha256(pathlib.Path('dist', name).read_bytes()).hexdigest()+'  '+name+'\n' for name in packages))
        pathlib.Path('dist/package-verification.json').write_text(json.dumps({'platform': platform, 'package_build': 'passed', 'installed_lifecycle': 'pending' if platform == 'linux' else 'not_exercised', 'macos_limit': 'Unsigned package build and native shell fixtures; Aqua login lifecycle unproven' if platform == 'macos' else None, 'packages': packages}, indent=2))
    - name: Linux disposable-account installed lifecycle
      if: matrix.platform == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ "${RUNNER_OS:-}" = Linux ] || { echo 'Disposable GitHub Linux runner required'; exit 1; }
        account=oa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
        case "$account" in oa-ci-[0-9]*-[0-9]*) ;; *) exit 1;; esac
        if getent passwd "$account" >/dev/null; then echo 'Test account already exists'; exit 1; fi
        sudo useradd --user-group --create-home --shell /bin/sh "$account"
        uid=$(id -u "$account")
        printf '%s %s\n' "$account" "$uid" > "$RUNNER_TEMP/oa-posix-account"
        home=/home/$account
        sudo mkdir "$home/package" "$home/fixtures"
        sudo tar -xzf "dist/abstraction-$CANDIDATE_VERSION-linux-amd64.tar.gz" -C "$home/package" --no-same-owner
        sudo cp -R posix/. "$home/fixtures/"
        sudo chown -R "$account:$account" "$home/package" "$home/fixtures"
        sudo loginctl enable-linger "$account"
        sudo systemctl start "user@$uid.service"
        user() { sudo -u "$account" env HOME="$home" XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" "$@"; }
        configure_disposable_runtime_environment() {
          [ "$(id -u "$account")" = "$uid" ] || { echo 'Disposable account identity changed'; return 1; }
          expected=/run/user/$uid
          [ "$(stat -c '%F %u %a' "$expected")" = "directory $uid 700" ] || { echo 'Private account runtime directory unavailable'; return 1; }
          # Hosted Ubuntu globally exports the runner's XDG_RUNTIME_DIR (runner-images#14649).
          # Correct only this new account's manager; direct sudo env does not reach services.
          before=$(user timeout --kill-after=2s 10s systemctl --user show-environment | sed -n 's/^XDG_RUNTIME_DIR=//p') || return 1
          printf 'Disposable manager runtime directory: %s -> %s\n' "$before" "$expected"
          user timeout --kill-after=2s 10s systemctl --user set-environment "XDG_RUNTIME_DIR=$expected" || return 1
          after=$(user timeout --kill-after=2s 10s systemctl --user show-environment | sed -n 's/^XDG_RUNTIME_DIR=//p') || return 1
          [ "$after" = "$expected" ] || { echo 'Disposable manager runtime environment was not established'; return 1; }
        }
        {
          configure_disposable_runtime_environment
          user sh "$home/fixtures/test_systemd.sh" --run
          user mkdir -p "$home/.abstraction"
          user sh -c 'printf preserved > "$HOME/.abstraction/candidate-data"'
          user sh "$home/package/abstraction-$CANDIDATE_VERSION-linux-amd64/install.sh"
          user test -x "$home/.local/bin/openabstractions"
          for program in jobd dl jobctl; do user test ! -e "$home/.local/bin/$program"; done
          user "$home/.local/bin/openabstractions" status --timeout 5s
          # A download through the runtime, with no store named: the runtime
          # fetches and verifies, the command copies the result out, and jobs
          # show observes the same operation.
          user mkdir -p "$home/download-origin" "$home/download-out"
          user sh -c 'printf "bytes through the runtime" > "$HOME/download-origin/thing.bin"'
          user python3 -m http.server 8099 --bind 127.0.0.1 --directory "$home/download-origin" >/dev/null 2>&1 &
          origin=$!
          for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:8099/thing.bin && break; sleep 0.2; done
          user "$home/.local/bin/openabstractions" download http://127.0.0.1:8099/thing.bin --out "$home/download-out" --json --timeout 60s > "$RUNNER_TEMP/download.json"
          kill "$origin" || true
          user cmp "$home/download-out/thing.bin" "$home/download-origin/thing.bin"
          operation=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["receipt"]["operation_id"])' "$RUNNER_TEMP/download.json")
          [ -n "$operation" ]
          user "$home/.local/bin/openabstractions" jobs show "$operation" --json | python3 -c 'import json,sys; s=json.load(sys.stdin)["snapshot"]; sys.exit(0 if s["state"] == "complete" and s["receipt"]["operation_id"] == sys.argv[1] else 1)' "$operation"
          user sh "$home/.local/share/abstraction/uninstall.sh"
          user test ! -e "$home/.local/bin/openabstractions"
          user test ! -e "$home/.config/systemd/user/abstraction-runtime.service"
          [ "$(user cat "$home/.abstraction/candidate-data")" = preserved ]
          echo 'PASS Linux installed runtime readiness, a download through the runtime, native stop/removal and user-data preservation'
        } 2>&1 | tee dist/linux-installed-lifecycle.log
        python3 - <<'PY'
        import json, pathlib
        p = pathlib.Path('dist/package-verification.json')
        evidence = json.loads(p.read_text())
        evidence['installed_lifecycle'] = 'passed_disposable_user_systemd'
        p.write_text(json.dumps(evidence, indent=2))
        PY
    - name: capture disposable Linux runtime diagnostics
      if: always() && matrix.platform == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        state=$RUNNER_TEMP/oa-posix-account
        [ -f "$state" ] || exit 0
        [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ "${RUNNER_OS:-}" = Linux ] || exit 1
        read -r account uid < "$state"
        [ "$account" = "oa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ] && [ "$(id -u "$account")" = "$uid" ] || exit 1
        {
          printf 'Disposable principal: '; id "$account"
          # Inspect only identity/runtime settings; never dump the full manager environment.
          sudo -u "$account" env HOME="/home/$account" XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            timeout --kill-after=2s 10s systemctl --user show-environment | grep -E '^(HOME|USER|LOGNAME|XDG_RUNTIME_DIR)=' || true
          # Include the exact directory named by failed run 34693195412.
          for directory in "/run/user/$uid" /run/user/1001; do
            sudo stat -c '%A %u:%g %n' "$directory" "$directory/openabstractions-logging-v1.sock.lock" 2>&1 || true
          done
          # status returns nonzero for stopped/failed units; retain that diagnostic
          # without changing the preceding install step's failure conclusion.
          sudo -u "$account" env HOME="/home/$account" XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            timeout --kill-after=2s 10s systemctl --user status abstraction-runtime.service --no-pager --full || true
          sudo timeout --kill-after=2s 10s journalctl --no-pager -n 60 "_UID=$uid" _SYSTEMD_USER_UNIT=abstraction-runtime.service
        } 2>&1 | tee dist/linux-runtime-diagnostics.log
    - name: remove only the disposable Linux account
      if: always() && matrix.platform == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        state=$RUNNER_TEMP/oa-posix-account
        [ -f "$state" ] || exit 0
        [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ "${RUNNER_OS:-}" = Linux ] || exit 1
        read -r account uid < "$state"
        [ "$account" = "oa-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ] && [ "$(id -u "$account")" = "$uid" ] || exit 1
        {
          # Cleanup after a failed assertion is explicit containment, not lifecycle PASS.
          sudo loginctl disable-linger "$account"
          sudo systemctl stop "user@$uid.service"
          # Stopping the user manager may leave its session scope exiting for a
          # short time. Terminate only this verified disposable login, then wait
          # for the kernel's UID process inventory to drain before userdel.
          # An earlier lifecycle failure may leave no registered login; the UID
          # inventory below remains the authoritative cleanup condition.
          sudo loginctl terminate-user "$account" || true
          for _ in $(seq 1 50); do
            if ! sudo pgrep -u "$uid" >/dev/null; then break; fi
            sleep 0.2
          done
          if sudo pgrep -u "$uid" >/dev/null; then
            echo "Disposable account still owns processes after bounded shutdown:"
            sudo ps -o user:24,pid,ppid,stat,etimes,comm,args -u "$uid"
            exit 1
          fi
          sudo userdel --remove "$account"
          if getent passwd "$account" >/dev/null; then echo 'Disposable account survived cleanup'; exit 1; fi
          rm "$state"
          echo 'PASS disposable account cleanup'
        } 2>&1 | tee dist/linux-account-cleanup.log
    - name: record candidate proof scope
      if: always()
      shell: python
      run: |
        import os, pathlib
        path = pathlib.Path('dist/package-verification.json')
        if path.exists():
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                summary.write('\nPOSIX candidate evidence (unsigned, no release tag):\n```json\n'+path.read_text()+'\n```\n')
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: abstraction-${{ matrix.platform }}-unsigned
        path: dist/*.*
        if-no-files-found: error
