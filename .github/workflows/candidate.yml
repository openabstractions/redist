name: verified release candidate
run-name: candidate ${{ inputs.version }} [oa-job:${{ inputs.oa_job_intent }}]${{ inputs.producer_mode == 'train-graph' && ' [oa-mode:train-graph]' || inputs.producer_mode == 'train' && ' [oa-mode:train]' || '' }}${{ inputs.app_delivery_only == 'comfyui' && ' [oa-app-delivery:comfyui]' || '' }}${{ inputs.core_only && ' [core-only diagnostic; nonpromotable]' || '' }} ${{ inputs.windows_tail_only && ' [windows-tail retained:445994]' || '' }}

on:
  workflow_dispatch:
    inputs:
      windows_tail_only:
        description: Rebuild core MSI containers and Setup using fixed signed run 445994 input roles
        type: boolean
        default: false
      windows_tail_ba_only:
        description: Rebuild and sign only the Setup BA, retaining signed core and app MSI bytes from run 44642911527
        type: boolean
        default: false
      windows_tail_bundle_resume:
        description: Resume Setup assembly using the completed signed MSI and BA carrier from run 44736549944
        type: boolean
        default: false
      windows_tail_sign_resume:
        description: Resume signing and verification using the completed raw Setup bundle from run 44647416372
        type: boolean
        default: false
      core_only:
        description: Core-only signed installer diagnostic; excludes all applications and cannot be promoted
        type: boolean
        default: false
      diagnostic_host_sign_only:
        description: Sign only the exact reviewed ComfySelf1829 host copy; no build or release
        type: boolean
        default: false
      diagnostic_input_release_id:
        description: Same-repository unpublished exact-host staging draft ID
        type: string
        default: ''
      diagnostic_input_asset_id:
        description: Exact reviewed host asset ID in that draft
        type: string
        default: ''
      producer_mode:
        description: Train producer; train-graph checks inputs; legacy is reserved for the exact-host diagnostic
        type: choice
        options: [legacy, train-graph, train]
        default: train
      source_sha:
        description: Exact prepared public redist commit for this dispatch
        type: string
        required: true
      version:
        description: Candidate version (vMAJOR.MINOR.PATCH); no tag or release is created
        type: string
        required: true
      signing_probe_only:
        description: Fixed Windows signing smoke before release qualification; never a release candidate
        type: boolean
        default: false
      preview:
        description: >-
          Retain a verified preview artifact when the machine scope was not proven
          on this run. An incomplete candidate is something a person asked for by
          name and never something a run decided.
        type: boolean
        default: false
      pytorch_input_release_id:
        description: Authorized exact reviewed PyTorch draft input release ID; required when tools.tsv selects pytorchd
        type: string
        required: false
        default: ''
      pytorch_input_bundle_asset_id:
        description: Exact retained reviewed input ZIP asset ID in that draft
        type: string
        required: false
        default: ''
      pytorch_input_manifest_asset_id:
        description: Exact retained same-source owner manifest asset ID in that draft
        type: string
        required: false
        default: ''
      pytorch_input_source_asset_id:
        description: Exact retained corresponding-source ZIP asset ID in that draft
        type: string
        required: false
        default: ''
      app_producer_only:
        description: Explicit first app producer; measures artifacts without enabling Setup or drafting a release
        type: choice
        options: [none, comfyui]
        default: none
      app_delivery_only:
        description: Complete only the selected Comfy final delivery and authenticated Panel pin input; no core, draft or publication
        type: choice
        options: [none, comfyui]
        default: none
      comfyui_producer_adopter_commit:
        description: Exact approved public ComfyUI adopter commit for producer-only mode
        type: string
        default: ''
      oa_job_intent:
        description: Stable OA Job intent ID for exact dispatch recovery
        type: string
        required: false
        default: ''

concurrency:
  # One cloud-signing account is shared by every candidate version and probe.
  group: redist-candidate-signing
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  WIX_VERSION: '5.0.2'
  # SDK shared components retain the existing manylinux 2.28 / macOS 11 floors.
  # Resolved manifest and config are retained in PosixNative1743 image provenance.
  CLIENT_MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:e0adf18521ad35192df733a6c62d35df7801957d24e0470238aacecfab2188a3
  CLIENT_MANYLINUX_CONFIG: sha256:e9156ba0a5e68ec0da2eac7253109eea135e52291ffac058c26cd770685a684d
  # C declares P here only after real producer review. Empty means the strict
  # legacy same-run path. IDs/digests/inputs and derived evidence are literal
  # reviewed source inputs, never downloaded sidecar authority.
  CORE_ONLY: ${{ inputs.core_only && 'true' || 'false' }}
  COMFYUI_DELIVERY: official-extension
  APP_PRODUCERS: '{}'
  APP_PRODUCER_ONLY: ${{ inputs.app_producer_only || 'none' }}
  APP_DELIVERY_ONLY: ${{ inputs.app_delivery_only || 'none' }}
  PRODUCER_MODE: ${{ inputs.producer_mode }}
  SIGNING_PROBE_ONLY: ${{ inputs.signing_probe_only }}
  DIAGNOSTIC_HOST_SIGN_ONLY: ${{ inputs.diagnostic_host_sign_only }}
  COMFYUI_PRODUCER_ADOPTER_COMMIT: ${{ inputs.comfyui_producer_adopter_commit }}

jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: verify the exact prepared public source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          WINDOWS_TAIL_ONLY: ${{ inputs.windows_tail_only }}
          WINDOWS_TAIL_BA_ONLY: ${{ inputs.windows_tail_ba_only }}
          WINDOWS_TAIL_BUNDLE_RESUME: ${{ inputs.windows_tail_bundle_resume }}
          WINDOWS_TAIL_SIGN_RESUME: ${{ inputs.windows_tail_sign_resume }}
          TAIL_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo 'FAIL dispatch requires the exact prepared public redist SHA'
            exit 1
          fi
          if [ "$WINDOWS_TAIL_BUNDLE_RESUME" = true ] && [ "$WINDOWS_TAIL_ONLY" != true ]; then
            echo 'FAIL windows_tail_bundle_resume requires windows_tail_only'
            exit 1
          fi
          if [ "$WINDOWS_TAIL_SIGN_RESUME" = true ]; then
            [ "$WINDOWS_TAIL_ONLY" = true ] && [ "$WINDOWS_TAIL_BUNDLE_RESUME" != true ] || {
              echo 'FAIL windows_tail_sign_resume requires windows_tail_only and excludes windows_tail_bundle_resume'
              exit 1
            }
          fi
          if [ "$WINDOWS_TAIL_BA_ONLY" = true ]; then
            [ "$WINDOWS_TAIL_ONLY" = true ] && [ "$WINDOWS_TAIL_BUNDLE_RESUME" != true ] && [ "$WINDOWS_TAIL_SIGN_RESUME" != true ] || {
              echo 'FAIL windows_tail_ba_only requires windows_tail_only and excludes bundle/sign resume'
              exit 1
            }
          fi
          if [ "$WINDOWS_TAIL_ONLY" = true ]; then
            [ "$TAIL_VERSION" = v0.8.0 ] && [ "$PRODUCER_MODE" = train ] &&
              [ "$CORE_ONLY" != true ] && [ "$SIGNING_PROBE_ONLY" != true ] &&
              [ "$DIAGNOSTIC_HOST_SIGN_ONLY" != true ] &&
              [ "$APP_PRODUCER_ONLY" = none ] && [ "$APP_DELIVERY_ONLY" = none ] || {
                echo 'FAIL windows_tail_only requires the exact full-scope 0.8.0 retained-input branch'
                exit 1
              }
          fi
  diagnostic-host-intake:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (inputs.app_delivery_only != 'comfyui' && (inputs.diagnostic_host_sign_only && !inputs.signing_probe_only && inputs.producer_mode == 'legacy' && inputs.app_producer_only == 'none' && inputs.version == 'v0.8.0' && github.repository == 'openabstractions/redist' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/0.8.0' && github.actor == 'ReinisLusis' && github.triggering_actor == 'ReinisLusis'))) }}
    needs: source-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The existing draft canary proved contents:read receives HTTP 403.
      # This isolated job has no signing secrets or mutation commands.
      contents: write
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: admit exact reviewed unsigned host before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_ID: ${{ inputs.diagnostic_input_release_id }}
          INPUT_ASSET_ID: ${{ inputs.diagnostic_input_asset_id }}
        run: >-
          python3 windows/windows_signing.py diagnostic-host intake --root diagnostic-host
          --source "$GITHUB_SHA" --release-id "$INPUT_RELEASE_ID" --asset-id "$INPUT_ASSET_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: diagnostic-comfy-self1829-unsigned-${{ github.run_attempt }}
          path: diagnostic-host/
          if-no-files-found: error
  diagnostic-host-sign:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (inputs.app_delivery_only != 'comfyui' && (inputs.diagnostic_host_sign_only))) }}
    needs: [source-guard, diagnostic-host-intake]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: signing
    permissions:
      contents: read
      actions: read
    env:
      OA_CERTUM_SIGNING_ONLY: '1'
      INTAKE_ATTEMPT: ${{ needs.diagnostic-host-intake.outputs.artifact-attempt }}
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      intake-attempt: ${{ needs.diagnostic-host-intake.outputs.artifact-attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: consume exact same-run unsigned artifact before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.diagnostic-host-intake.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.diagnostic-host-intake.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.diagnostic-host-intake.outputs.artifact-attempt }}
        run: >-
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID"
          --digest "$ARTIFACT_DIGEST" --name "diagnostic-comfy-self1829-unsigned-$ARTIFACT_ATTEMPT"
          --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out diagnostic-host
      - name: revalidate exact unsigned host before credentials
        run: >-
          python3 windows/windows_signing.py diagnostic-host check --root diagnostic-host --source "$GITHUB_SHA"
          --intake-attempt "$INTAKE_ATTEMPT"
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: download pinned SimplySign Desktop installer
        shell: pwsh
        run: |
          $policy = Get-Content windows/certum_simplysign.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $policy.installer.url -OutFile "$env:RUNNER_TEMP/simplysign.msi"
      - name: connect exact reviewed signing identity
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: >-
          ./windows/certum_simplysign.ps1 -Mode Connect
          -InstallerPath "$env:RUNNER_TEMP/simplysign.msi"
          -SessionPath "$env:RUNNER_TEMP/signing-session.json"
      - name: sign only the admitted copy and compare every payload byte
        run: >-
          python3 windows/windows_signing.py diagnostic-host sign --root diagnostic-host
          --source "$GITHUB_SHA" --intake-attempt "$INTAKE_ATTEMPT" --policy windows/certum_simplysign.json --signtool "$SIGNTOOL"
      - name: disconnect owned signing session
        if: always()
        shell: pwsh
        run: >-
          ./windows/certum_simplysign.ps1 -Mode Disconnect
          -SessionPath "$env:RUNNER_TEMP/signing-session.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: diagnostic-comfy-self1829-signed-${{ github.run_attempt }}
          path: diagnostic-host/
          if-no-files-found: error
  diagnostic-host-verify:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (inputs.app_delivery_only != 'comfyui' && (inputs.diagnostic_host_sign_only))) }}
    needs: [source-guard, diagnostic-host-sign]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      INTAKE_ATTEMPT: ${{ needs.diagnostic-host-sign.outputs.intake-attempt }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: consume exact same-run signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.diagnostic-host-sign.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.diagnostic-host-sign.outputs.artifact-digest }}
          ARTIFACT_ATTEMPT: ${{ needs.diagnostic-host-sign.outputs.artifact-attempt }}
        run: >-
          python3 windows/windows_signing.py consume --artifact-id "$ARTIFACT_ID"
          --digest "$ARTIFACT_DIGEST" --name "diagnostic-comfy-self1829-signed-$ARTIFACT_ATTEMPT"
          --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$ARTIFACT_ATTEMPT" --out diagnostic-host
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: independent normal signature and unchanged payload resource verification
        run: >-
          python3 windows/windows_signing.py diagnostic-host verify --root diagnostic-host
          --source "$GITHUB_SHA" --intake-attempt "$INTAKE_ATTEMPT" --policy windows/certum_simplysign.json --signtool "$SIGNTOOL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-comfy-self1829-verified-${{ github.run_attempt }}
          path: diagnostic-host/
          if-no-files-found: error
  train-graph:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (inputs.app_delivery_only != 'comfyui' && (!inputs.diagnostic_host_sign_only && (inputs.producer_mode == 'train-graph')))) }}
    needs: source-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - name: validate the exact source-bound graph candidate branch
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [ "$GITHUB_REPOSITORY" = openabstractions/redist ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || exit 1
          [ "$GITHUB_ACTOR" = ReinisLusis ] && [ "$GITHUB_TRIGGERING_ACTOR" = ReinisLusis ] || exit 1
          [ "$GITHUB_REF" = "refs/heads/release/${RELEASE_VERSION#v}" ] && [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false
      - name: verify source-bound unpublished module graph
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: local
          GOENV: 'off'
          GOWORK: 'off'
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: python3 scripts/module_provenance.py --prepared-graph public-go-graph.zip --prepared-sidecar public-go-graph.json --release-version "$RELEASE_VERSION" --output graph-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staged-go-graph-${{ github.run_attempt }}
          path: public-go-graph.zip
          if-no-files-found: error
  candidate:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && ((!inputs.diagnostic_host_sign_only && inputs.producer_mode != 'train-graph') || inputs.app_delivery_only == 'comfyui')) }}
    needs: source-guard
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      comfyui: ${{ steps.optional-apps.outputs.comfyui }}
      comfyui-predecessor: ${{ steps.optional-apps.outputs.comfyui-predecessor }}
      opencode: ${{ steps.optional-apps.outputs.opencode }}
      lemonade: ${{ steps.optional-apps.outputs.lemonade }}
      required-products: ${{ steps.optional-apps.outputs.required-products }}
      installer-comfyui: ${{ steps.optional-apps.outputs.installer-comfyui }}
      native-comfyui: ${{ steps.optional-apps.outputs.native-comfyui }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
      - name: validate an untagged candidate
        id: candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PRODUCER_MODE: ${{ inputs.producer_mode }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'FAIL version must be vMAJOR.MINOR.PATCH'; exit 1;
          }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'FAIL source must be a full lowercase public commit SHA'; exit 1;
          }
          IFS=. read -r major minor patch <<< "${RELEASE_VERSION#v}"
          [ "$major" -le 255 ] && [ "$minor" -le 255 ] && [ "$patch" -le 65535 ] || {
            echo 'FAIL version exceeds Windows Installer limits'; exit 1;
          }
          # The release version comes from the dispatch input alone; the
          # branch must be release/<version>. Releases before 0.8.0 rebuild
          # from their own release tag tooling.
          [ "$major" -gt 0 ] || [ "$minor" -ge 8 ] || {
            echo 'FAIL this workflow packages 0.8.0 and later; rebuild historical releases from their release tag tooling'; exit 1;
          }
          [ "$PRODUCER_MODE" = train ] || { echo 'FAIL release packages require train mode'; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/release/${RELEASE_VERSION#v}" ] || {
            echo 'FAIL release packages require the release/<version> branch of the dispatched version'; exit 1;
          }
          [ "$GITHUB_REF_TYPE" != tag ] || { echo 'FAIL dispatch from a branch, not an existing tag'; exit 1; }
          sha=$(git rev-parse HEAD)
          [ "$sha" = "$GITHUB_SHA" ] || { echo 'FAIL checkout differs from dispatch commit'; exit 1; }
          # A failed lookup must not be confused with an absent tag.
          refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION")
          [ -z "$refs" ] || { echo 'FAIL release tag already exists; choose a new version'; exit 1; }
          printf 'sha=%s\nversion=%s\n' "$sha" "${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: select authored optional app producers
        id: optional-apps
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          python3 scripts/train/steps/select_app_producers.py

  # A-SIGN1: owned drafts require contents:write (read-only canary returned 403).
  # Intake jobs have no secrets or mutation commands; build consumers stay read-only.
  pytorch-input:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (inputs.app_delivery_only != 'comfyui' && (!inputs.diagnostic_host_sign_only && (inputs.producer_mode != 'train-graph' && (!inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '')))))) }}
    needs: [source-guard, candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.inputs.outputs.artifact-id }}
      artifact-digest: ${{ steps.inputs.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: select the authored PyTorch executable
        id: selected
        run: |
          python3 scripts/train/steps/select_pytorch_executable.py
      - name: intake exact reviewed draft input assets
        if: steps.selected.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
          INPUT_RELEASE_ID: ${{ inputs.pytorch_input_release_id }}
          INPUT_BUNDLE_ID: ${{ inputs.pytorch_input_bundle_asset_id }}
          INPUT_MANIFEST_ID: ${{ inputs.pytorch_input_manifest_asset_id }}
          INPUT_SOURCE_ID: ${{ inputs.pytorch_input_source_asset_id }}
        run: |
          python3 windows/pytorch_engine.py intake --sources windows/sources.tsv \
            --source "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" \
            --release-id "$INPUT_RELEASE_ID" --bundle-asset-id "$INPUT_BUNDLE_ID" \
            --manifest-asset-id "$INPUT_MANIFEST_ID" --source-asset-id "$INPUT_SOURCE_ID" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --output pytorch-input
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: inputs
        if: steps.selected.outputs.enabled == 'true'
        with:
          name: abstraction-pytorch-inputs-${{ github.run_attempt }}
          path: pytorch-input/
          compression-level: 0
          if-no-files-found: error
  windows-app-delivery:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (!inputs.core_only && !inputs.diagnostic_host_sign_only && (inputs.producer_mode == 'train' && !inputs.signing_probe_only && needs.candidate.outputs.native-comfyui == 'true'))) }}
    needs: [source-guard, candidate, windows-app-sign]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      comfyui-artifact: ${{ steps.comfy-final.outputs.artifact }}
      comfyui-source-commit: ${{ steps.comfy-final.outputs.source_commit }}
      comfyui-artifact-id: ${{ steps.comfy-artifact.outputs.artifact-id }}
      comfyui-artifact-digest: ${{ steps.comfy-artifact.outputs.artifact-digest }}
      comfyui-artifact-attempt: ${{ github.run_attempt }}
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: exact pinned Microsoft signature tools
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"
      - name: assemble authenticated application delivery before Panel compilation
        id: comfy-final
        if: inputs.producer_mode == 'train' && needs.candidate.outputs.native-comfyui == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          APP_CONTEXT_ARTIFACT_ID: ${{ needs.windows-app-sign.outputs.artifact-id }}
          APP_CONTEXT_ARTIFACT_DIGEST: ${{ needs.windows-app-sign.outputs.artifact-digest }}
          APP_CONTEXT_ARTIFACT_ATTEMPT: ${{ needs.windows-app-sign.outputs.artifact-attempt }}
          DESKTOP_SIGNED_RECEIPT_SHA256: ${{ needs.windows-app-sign.outputs.desktop-receipt-sha256 }}
          DESKTOP_SIGNED_RECEIPT_BYTES: ${{ needs.windows-app-sign.outputs.desktop-receipt-bytes }}
          DESKTOP_SIGNER_ATTEMPT: ${{ needs.windows-app-sign.outputs.desktop-signer-attempt }}
        run: |
          python3 windows/windows_signing.py consume --artifact-id "$APP_CONTEXT_ARTIFACT_ID" --digest "$APP_CONTEXT_ARTIFACT_DIGEST" \
            --name "windows-app-signed-$APP_CONTEXT_ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$APP_CONTEXT_ARTIFACT_ATTEMPT" --out signed-msis --receipt signed-msis/artifact-intake.json
          python3 scripts/train/steps/build_application_msis.py --phase assemble-final
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: comfy-artifact
        if: inputs.producer_mode == 'train' && needs.candidate.outputs.native-comfyui == 'true'
        with:
          name: ${{ steps.comfy-final.outputs.artifact }}
          path: final-apps/comfyui/
          if-no-files-found: error


  backend-data:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (!inputs.core_only && inputs.producer_mode == 'train' && needs.candidate.outputs.native-comfyui == 'true' && needs.windows-app-delivery.result == 'success' && (needs.app_comfyui.result == 'success' || (needs.candidate.outputs.native-comfyui != 'true' && needs.app_comfyui.result == 'skipped')) && !inputs.diagnostic_host_sign_only && !inputs.signing_probe_only && inputs.app_producer_only == 'none')) }}
    needs: [source-guard, candidate, windows-app-delivery, app_comfyui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMFY_FINAL_ARTIFACT_ID: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-id }}
      COMFY_FINAL_ARTIFACT_DIGEST: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-digest }}
      COMFY_FINAL_ARTIFACT_ATTEMPT: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-attempt }}
      COMFY_BACKEND_ARTIFACT_ID: ${{ needs.app_comfyui.outputs.artifact-id }}
      COMFY_BACKEND_ARTIFACT_DIGEST: ${{ needs.app_comfyui.outputs.artifact-digest }}
      COMFY_BACKEND_ARTIFACT_ATTEMPT: ${{ needs.app_comfyui.outputs.artifact-attempt }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: publish exact DATA parts after signed application producer verification
        run: python3 scripts/train/steps/build_application_msis.py --phase publish-data

  windows-app-catalogue:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (!inputs.core_only && needs.backend-data.result == 'success' && !inputs.diagnostic_host_sign_only && inputs.producer_mode == 'train' && !inputs.signing_probe_only && inputs.app_producer_only == 'none' && inputs.app_delivery_only == 'comfyui' && needs.candidate.outputs.native-comfyui == 'true')) }}
    needs: [source-guard, candidate, windows-app-delivery, backend-data]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: receive exact successful final delivery through authenticated API intake
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMFY_FINAL_ARTIFACT_ID: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-id }}
          COMFY_FINAL_ARTIFACT_DIGEST: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-digest }}
          COMFY_FINAL_ARTIFACT_ATTEMPT: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-attempt }}
        run: python3 scripts/train/steps/build_application_msis.py --phase stage-final
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: panel-catalogue-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/panel-catalogue/panel-catalogue.json
            ${{ runner.temp }}/panel-catalogue/panel-catalogue-input.json
          if-no-files-found: error

  installer-prior-input:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (inputs.app_delivery_only != 'comfyui' && (!inputs.diagnostic_host_sign_only && (inputs.producer_mode != 'train-graph' && (!inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '')))))) }}
    needs: [source-guard, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # A-SIGN1 isolated owned-draft reader; no signing secrets or mutation commands.
      contents: write
      actions: read
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.inputs.outputs.artifact-id }}
      artifact-digest: ${{ steps.inputs.outputs.artifact-digest }}
      runtime-artifact-attempt: ${{ github.run_attempt }}
      runtime-artifact-id: ${{ steps.runtime-input.outputs.artifact-id }}
      runtime-artifact-digest: ${{ steps.runtime-input.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: select source-authored installer predecessor descriptor
        id: select
        run: |
          if [ -f installer-priors.json ]; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; fi
      - name: receive original installer predecessor bundles from owned draft
        if: steps.select.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 windows/windows_signing.py intake-installer-priors
          --prior-descriptor installer-priors.json --out installer-prior-input
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: inputs
        if: steps.select.outputs.enabled == 'true'
        with:
          name: abstraction-installer-prior-inputs-${{ github.run_attempt }}
          path: installer-prior-input/
          compression-level: 0
          if-no-files-found: error

      - name: receive the exact app-local VC runtime from its owned unpublished input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir vc-runtime-input
          runtime_asset=$(python3 -c 'import sys; sys.path.insert(0,"windows"); import modelhost_engine as owner; from pathlib import Path; print(owner.runtime_asset(Path("windows/vc-runtime.json"))["archive"]["name"])')
          runtime_tag=$(python3 -c 'import sys; sys.path.insert(0,"windows"); import modelhost_engine as owner; from pathlib import Path; print(owner.runtime_input_tag(owner.runtime_asset(Path("windows/vc-runtime.json"))))')
          gh release download "$runtime_tag" --repo openabstractions/redist --pattern "$runtime_asset" --dir vc-runtime-input
          python3 -c 'import sys; sys.path.insert(0,"windows"); import modelhost_engine as owner; from pathlib import Path; asset=owner.runtime_asset(Path("windows/vc-runtime.json")); owner.runtime_asset_bytes(Path("vc-runtime-input")/asset["archive"]["name"],asset)'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: runtime-input
        with:
          name: vc-runtime-input-${{ github.run_attempt }}
          path: vc-runtime-input/
          compression-level: 0
          if-no-files-found: error

  windows-build:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && ((inputs.core_only && !cancelled() && inputs.producer_mode == 'train' && !inputs.signing_probe_only && !inputs.diagnostic_host_sign_only && inputs.app_producer_only == 'none' && inputs.app_delivery_only == 'none' && needs.candidate.result == 'success' && needs.pytorch-input.result == 'success' && needs.installer-prior-input.result == 'success') || (!inputs.core_only && needs.windows-app-sign.result == 'success' && (inputs.app_delivery_only != 'comfyui' && (!inputs.diagnostic_host_sign_only && (!cancelled() && needs.candidate.result == 'success' && needs.pytorch-input.result == 'success' && needs.installer-prior-input.result == 'success' && ((inputs.producer_mode == 'train' && needs.candidate.outputs.native-comfyui == 'true' && needs.windows-app-delivery.result == 'success' && needs.backend-data.result == 'success') || ((inputs.producer_mode != 'train' || needs.candidate.outputs.native-comfyui != 'true') && needs.windows-app-delivery.result == 'skipped' && needs.backend-data.result == 'skipped')) && inputs.producer_mode != 'train-graph' && (!inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '')))))))) }}
    needs: [source-guard, candidate, pytorch-input, installer-prior-input, windows-app-delivery, windows-app-sign, backend-data]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
      GOTOOLCHAIN: local
    outputs:
      panel-catalogue-artifact-id: ${{ steps.panel-catalogue.outputs.artifact-id }}
      panel-catalogue-artifact-digest: ${{ steps.panel-catalogue.outputs.artifact-digest }}
      panel-catalogue-artifact-attempt: ${{ github.run_attempt }}
      engine-artifact-id: ${{ steps.engines.outputs.artifact-id }}
      engine-artifact-digest: ${{ steps.engines.outputs.artifact-digest }}
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: verify and consume the exact immutable PyTorch input artifact
        if: needs.pytorch-input.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          INPUT_ARTIFACT_ID: ${{ needs.pytorch-input.outputs.artifact-id }}
          INPUT_RELEASE_ID: ${{ inputs.pytorch_input_release_id }}
          INPUT_BUNDLE_ID: ${{ inputs.pytorch_input_bundle_asset_id }}
          INPUT_MANIFEST_ID: ${{ inputs.pytorch_input_manifest_asset_id }}
          INPUT_SOURCE_ID: ${{ inputs.pytorch_input_source_asset_id }}
        run: |
          python3 windows/pytorch_engine.py consume --sources windows/sources.tsv \
            --source "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" \
            --release-id "$INPUT_RELEASE_ID" --bundle-asset-id "$INPUT_BUNDLE_ID" \
            --manifest-asset-id "$INPUT_MANIFEST_ID" --source-asset-id "$INPUT_SOURCE_ID" --artifact-id "$INPUT_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output pytorch-input

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.pytorch-input.outputs.artifact-id != ''
        with:
          name: abstraction-pytorch-consumption-${{ github.run_attempt }}
          path: pytorch-input/pytorch-consumer-receipt.json
          if-no-files-found: error

      # Windows uses the pinned scoped SDK with the reviewed duplex-pipe fix.
      # Its recipe/source identity and race smoke are retained below.
      # GOTOOLCHAIN=local stops a go.mod line from fetching another SDK.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: select verified Windows Go SDK and smoke duplex pipes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 tools/windows_go_sdk.py --cache-dir "$RUNNER_TEMP/windows-go-sdk" --github-env --smoke-dir "$RUNNER_TEMP/windows-go-smoke" > windows-go-sdk-proof.json
          printf '\n### Verified Windows Go SDK and duplex race smoke\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat windows-go-sdk-proof.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: preserve Windows Go SDK source identity and smoke
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-go-sdk-${{ github.job }}-${{ github.run_attempt }}
          path: |
            windows-go-sdk-proof.json
            ${{ runner.temp }}/windows-go-smoke/named-pipe-race.log
            ${{ runner.temp }}/windows-go-smoke/smoke-receipt.json
          if-no-files-found: error

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          go version | tee go-version.txt
          dotnet --version
          git rev-parse HEAD

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-version-windows-${{ github.run_attempt }}
          path: go-version.txt
          if-no-files-found: error

      # candidate.json source is this exact redist commit. Program inputs come from
      # the immutable published module versions in tools.tsv; their repository tags
      # and public proxy resolution are checked below rather than represented as
      # source commits of this redist repository.
      #
      # Every version named here must exist before anything is built. This is
      # the whole point of the repository: the package is made of our published
      # artifacts, so a tag we deleted or never pushed stops the release here,
      # by name, instead of shipping.
      #
      # The repository is asked first and it is the authority: proxy.golang.org
      # serves a deleted tag forever, and it served service-jobd v0.2.0 for a
      # repository that has never had a tag â€” a release built on that answer is
      # built out of a cache. The proxy is asked second, and answers a different
      # question: whether `go install` can reach the version a stranger is told
      # to install.
      - name: verify and record selected module provenance
        env:
          PRODUCER_MODE: ${{ inputs.producer_mode }}
          TRAIN_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/module_provenance.py --prepared-graph public-go-graph.zip --prepared-sidecar public-go-graph.json --release-version "$TRAIN_VERSION" --prepared-directory "$RUNNER_TEMP/prepared-go-inputs" --workflow-environment --output module-provenance.json


      - name: prepare signature verification for signed OpenCode catalogue intake
        if: inputs.producer_mode == 'train'
        run: python3 windows/windows_signing.py prepare-tools --root "$RUNNER_TEMP/signing-tools" --github-env "$GITHUB_ENV"

      - name: pinned WiX packages for Panel predecessor extraction
        if: inputs.producer_mode == 'train'
        run: python3 windows/wix_packages.py --dest wix-packages --env "$GITHUB_ENV"
      - name: select pinned WiX before Panel predecessor extraction
        if: inputs.producer_mode == 'train'
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION" --configfile "$WIX_NUGET_CONFIG"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: receive completed application delivery and generate Panel catalogue input
        if: inputs.producer_mode == 'train' && needs.candidate.outputs.native-comfyui == 'true'
        env:
          PANEL_OPENCODE_SIGNED: '1'
          OPENCODE_SIGNED_ID: ${{ needs.windows-app-sign.outputs.artifact-id }}
          OPENCODE_SIGNED_DIGEST: ${{ needs.windows-app-sign.outputs.artifact-digest }}
          OPENCODE_SIGNED_ATTEMPT: ${{ needs.windows-app-sign.outputs.artifact-attempt }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          COMFY_FINAL_ARTIFACT_ID: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-id }}
          COMFY_FINAL_ARTIFACT_DIGEST: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-digest }}
          COMFY_FINAL_ARTIFACT_ATTEMPT: ${{ needs.windows-app-delivery.outputs.comfyui-artifact-attempt }}
        run: python3 scripts/train/steps/build_application_msis.py --phase stage-final
      - name: generate explicit passive Panel catalogue input
        if: inputs.producer_mode == 'train' && needs.candidate.outputs.native-comfyui != 'true'
        env:
          OPENCODE_SIGNED_ID: ${{ needs.windows-app-sign.outputs.artifact-id }}
          OPENCODE_SIGNED_DIGEST: ${{ needs.windows-app-sign.outputs.artifact-digest }}
          OPENCODE_SIGNED_ATTEMPT: ${{ needs.windows-app-sign.outputs.artifact-attempt }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: python3 scripts/train/steps/build_application_msis.py --phase panel-inputs
      - name: consume and revalidate immutable installer predecessor input before Panel compilation
        if: inputs.producer_mode == 'train'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARTIFACT_ID: ${{ needs.installer-prior-input.outputs.artifact-id }}
          INPUT_ARTIFACT_DIGEST: ${{ needs.installer-prior-input.outputs.artifact-digest }}
          INPUT_ARTIFACT_ATTEMPT: ${{ needs.installer-prior-input.outputs.artifact-attempt }}
        run: |
          if [ -f installer-priors.json ]; then
            python3 windows/windows_signing.py consume \
              --artifact-id "$INPUT_ARTIFACT_ID" --digest "$INPUT_ARTIFACT_DIGEST" \
              --name "abstraction-installer-prior-inputs-$INPUT_ARTIFACT_ATTEMPT" \
              --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$INPUT_ARTIFACT_ATTEMPT" \
              --out "$RUNNER_TEMP/panel-catalogue/installer-priors"
            python3 windows/windows_signing.py check-installer-priors \
              --prior-descriptor installer-priors.json --root "$RUNNER_TEMP/panel-catalogue/installer-priors" \
              --artifact-attempt "$INPUT_ARTIFACT_ATTEMPT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: panel-catalogue
        if: inputs.producer_mode == 'train'
        with:
          name: panel-catalogue-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/panel-catalogue/panel-catalogue.json
            ${{ runner.temp }}/panel-catalogue/panel-catalogue-input.json
            ${{ runner.temp }}/panel-catalogue/installer-priors/
          if-no-files-found: error

      - name: build from selected verified module inputs
        env:
          CGO_ENABLED: '0'
          PRODUCER_MODE: ${{ inputs.producer_mode }}
          GOOS: windows
          GOFLAGS: -trimpath
          PANEL_APPS: ${{ needs.candidate.outputs.native-comfyui == 'true' && '["comfyui"]' || '[]' }}
        run: |
          python3 scripts/module_provenance.py --tools tools.tsv --observe-windows-builds . \
            --provenance module-provenance.json --output windows-build-observation.json --build-phase providers \
            --panel-catalogue-directory "$RUNNER_TEMP/panel-catalogue" \
            --panel-proxy "$RUNNER_TEMP/prepared-go-inputs/proxy" \
            --panel-apps "$PANEL_APPS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: module-provenance-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            module-provenance.json
            windows-build-observation.json
          if-no-files-found: error


      # The publisher ZIP is an input only. The helper uses the same-source
      # modelhostd pin to check its exact digest and each kept file, then
      # creates the separately pinned 24 publisher + 3 runtime file bundle;
      # excluded RPC/CLI tools
      # never enter the MSI payload directory.
      - name: derive exact reviewed ModelHost engine bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          RUNTIME_ARTIFACT_ID: ${{ needs.installer-prior-input.outputs.runtime-artifact-id }}
          RUNTIME_ARTIFACT_DIGEST: ${{ needs.installer-prior-input.outputs.runtime-artifact-digest }}
          RUNTIME_ARTIFACT_ATTEMPT: ${{ needs.installer-prior-input.outputs.runtime-artifact-attempt }}
        run: |
          if [ -f a/amd64/modelhostd.exe ]; then
            mkdir -p engine-input publisher-input
            python3 windows/windows_signing.py consume --artifact-id "$RUNTIME_ARTIFACT_ID" --digest "$RUNTIME_ARTIFACT_DIGEST" \
              --name "vc-runtime-input-$RUNTIME_ARTIFACT_ATTEMPT" --source "$CANDIDATE_SHA" \
              --run-id "$GITHUB_RUN_ID" --attempt "$RUNTIME_ARTIFACT_ATTEMPT" --out runtime-input --receipt runtime-input/artifact-intake.json
            a/amd64/modelhostd.exe engine pin --json > engine-input/pin.json
            runtime_asset=$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("windows/vc-runtime.json").read_text())["archive"]["name"])')
            runtime_folder=$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("windows/vc-runtime.json").read_text())["runtime"]["folder"])')
            runtime="runtime-input/$runtime_folder"
            python3 windows/modelhost_engine.py runtime \
              --pin engine-input/pin.json \
              --runtime-pin windows/vc-runtime.json \
              --runtime-asset "runtime-input/$runtime_asset" \
              --runtime "$runtime"
            python3 windows/modelhost_engine.py fetch \
              --pin engine-input/pin.json \
              --source publisher-input/llama-b10825-bin-win-vulkan-x64.zip
            python3 windows/modelhost_engine.py derive \
              --pin engine-input/pin.json \
              --source publisher-input/llama-b10825-bin-win-vulkan-x64.zip \
              --bundle engine-input/llama-b10825-oa-win-vulkan-x64.zip \
              --receipt engine-input/llama-b10825-oa-win-vulkan-x64.receipt.json \
              --runtime "$runtime"
          else
            printf 'note  no qualified modelhostd binary; ModelHost is gated out of the x64 MSI\n'
          fi

      # Genuine native inputs and their reviewed artifact provenance remain a
      # release hold. This guard consumes the explicit prepared directory; it
      # does not discover personal Python/wheels or invent an artifact receipt.
      - name: require reviewed PyTorch runtime inputs
        run: |
          if [ -f a/amd64/pytorchd.exe ]; then
            bundle=pytorch-input/pytorch-2.11.0-rocm7.13.0-cpython3.12.10-gfx1151-inputs.zip
            manifest=pytorch-input/pytorch-2.11.0-rocm7.13.0-cpython3.12.10-gfx1151-inputs.manifest.json
            if [ ! -f "$bundle" ] || [ ! -f "$manifest" ] || [ ! -f pytorch-input/pytorch-consumer-receipt.json ]; then
              printf 'FAIL  PyTorch requires genuine prepared native inputs and the same-source owner manifest; input provenance remains a release hold\n'
              exit 1
            fi
            python3 windows/pytorch_engine.py verify --manifest "$manifest" --bundle "$bundle"
          else
            printf 'note  no qualified pytorchd binary; PyTorchImage is gated out of the MSI\n'
          fi

      # windows/wix_packages.py fetches wix.5.0.2.nupkg and the extension
      # packages from nuget.org and refuses any whose size or SHA-256 differs
      # from its record; the tool installs through a nuget.config whose only
      # source is that checked folder (<clear/> drops nuget.org), and the
      # extension DLLs are passed by path.
      - name: retain only runtime build and reviewed engine inputs
        env:
          PRODUCER_MODE: ${{ inputs.producer_mode }}
        run: |
          mkdir raw-windows
          cp -r a raw-windows/
          cp module-provenance.json windows-build-observation.json raw-windows/
          mkdir windows-engine-inputs
          printf 'Reviewed optional engine inputs from this Windows build.\n' > windows-engine-inputs/README.txt
          for directory in engine-input pytorch-input; do
            if [ -d "$directory" ]; then cp -r "$directory" windows-engine-inputs/; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-raw-${{ github.run_attempt }}
          path: raw-windows/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: engines
        with:
          name: windows-engine-inputs-${{ github.run_attempt }}
          path: windows-engine-inputs/
          if-no-files-found: error
  windows-native-build:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (!inputs.diagnostic_host_sign_only && (inputs.producer_mode != 'train-graph' && (!inputs.signing_probe_only && (inputs.app_producer_only == 'none' || inputs.app_producer_only == '' || inputs.app_producer_only == 'comfyui'))))) }}
    needs: [source-guard, candidate]
    runs-on: windows-latest
    env:
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.23.3'

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          node --version
          npm --version
          cmake --version | head -1

      # A commit is the identity of a JavaScript directory here: these
      # directories carry no tag of their own, and a release built from a moving
      # ref is a release nobody can rebuild. Each checkout is checked against
      # the row that asked for it.
      - name: check out the published JavaScript sources
        run: |
          python3 scripts/release_tsv_rows.py npm.tsv --output npm.rows
          while IFS= read -r -d '' package && IFS= read -r -d '' repository &&
                IFS= read -r -d '' commit && IFS= read -r -d '' directory; do
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'FAIL  %s names %s, which is not a full lowercase commit\n' "$package" "$commit"
              exit 1
            fi
            name=${repository#*/}
            [ -d "sources/$name" ] || git clone --quiet "https://github.com/$repository.git" "sources/$name"
            git -C "sources/$name" checkout --quiet "$commit"
            head=$(git -C "sources/$name" rev-parse HEAD)
            if [ "$head" != "$commit" ]; then
              printf 'FAIL  %s checked out %s, not %s\n' "$repository" "$head" "$commit"
              exit 1
            fi
            if [ ! -f "sources/$name/$directory/package.json" ]; then
              printf 'FAIL  %s has no package.json in %s\n' "$repository" "$directory"
              exit 1
            fi
            printf 'ok    %s from %s %s\n' "$package" "$repository" "$commit"
          done < npm.rows

      - name: validate selected native source families
        run: python3 windows/windows_signing.py check-native-source --pypi pypi.tsv --npm npm.tsv --native-roster pypi.tsv --root sources --github-env "$GITHUB_ENV"

      # Exact Node-API header tarball and, on Windows, the matching official
      # Node runtime ZIP and its separately published same-version win-x64
      # import library. All three inputs are bounded and SHA-checked
      # before a compiler sees them; the archives travel with the npm artifact.
      - name: pinned Node-API and import-library build inputs
        run: |
          test "$(node --version)" = v22.23.3 || { printf 'FAIL  Node build version changed\n'; exit 1; }
          options=()
          if [ "$RUNNER_OS" = Windows ]; then options=(--windows); fi
          python3 sources/abstractions/adopters/opencode/node_build_inputs.py \
            --output-root build/node-inputs "${options[@]}"
          printf 'NODE_INCLUDE_DIR=%s\n' "$PWD/build/node-inputs/node-api-headers/include" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            printf 'NODE_IMPORT_LIBRARY=%s\n' "$PWD/build/node-inputs/node.lib" >> "$GITHUB_ENV"
          fi

      # Two builds of one source: the shared library Bun opens through bun:ffi,
      # and the static archive the Node addon links into itself. The addon's
      # CMakeLists refuses a shared package for exactly that reason.
      - name: build the shared C ABI library and the Node addon
        env:
          ARCHITECTURES: ''
        run: |
          identity=sources/abstraction-identity
          arch=()
          [ -z "$ARCHITECTURES" ] || arch=(-DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURES")
          node_lib=()
          [ -z "${NODE_IMPORT_LIBRARY:-}" ] || node_lib=(-DNODE_IMPORT_LIBRARY="$NODE_IMPORT_LIBRARY")
          portable=()
          if [ "$RUNNER_OS" = Windows ]; then portable=(-DABSTRACTION_IPC_PORTABLE_WINDOWS=ON); fi
          cmake -S "$identity/cpp" -B build/shared -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DABSTRACTION_IPC_BUILD_TESTS=OFF "${arch[@]}" "${portable[@]}"
          cmake --build build/shared --config Release
          cmake -S "$identity/cpp" -B build/static -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DABSTRACTION_IPC_BUILD_TESTS=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix" "${arch[@]}"
          cmake --build build/static --config Release
          cmake --install build/static --config Release
          cmake -S "$identity/javascript" -B build/addon -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix" -DNODE_INCLUDE_DIR="$NODE_INCLUDE_DIR" \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            "${node_lib[@]}" "${arch[@]}"
          cmake --build build/addon --config Release
          case "$RUNNER_OS" in
            Windows) library=abstraction_ipc.dll ;;
            Linux) library=libabstraction_ipc.so ;;
            macOS) library=libabstraction_ipc.dylib ;;
          esac
          mkdir -p native
          cp "$(find build/shared -name "$library" -type f | head -1)" "native/$library"
          cp "$(find build/addon -name oa_ipc_node.node -type f | head -1)" native/oa_ipc_node.node
          printf 'IPC_LIBRARY=%s\n' "$PWD/native/$library" >> "$GITHUB_ENV"
          printf 'IPC_ADDON=%s\n' "$PWD/native/oa_ipc_node.node" >> "$GITHUB_ENV"
          ls -l native

      # One object compilation feeds the client C ABI DLL and static Node addon.
      - name: build the shared AppModel client once
        if: env.OA_FACADE_NATIVE == '1'
        run: |
          cmake -S sources/abstraction-facade/cpp -B build/facade-appmodel -A x64 -DCMAKE_BUILD_TYPE=Release \
            -DABSTRACTION_FACADE_BUILD_AGGREGATE=OFF -DABSTRACTION_FACADE_BUILD_APPMODEL=ON \
            -DABSTRACTION_FACADE_NODE_APPMODEL=ON -DABSTRACTION_FACADE_APPMODEL_PORTABLE_WINDOWS=ON \
            -DNODE_INCLUDE_DIR="$NODE_INCLUDE_DIR" -DNODE_IMPORT_LIBRARY="$NODE_IMPORT_LIBRARY"
          cmake --build build/facade-appmodel --config Release --target abstraction_facade_appmodel oa_appmodel_node
          for name in abstraction_facade_appmodel.dll oa_appmodel_node.node; do
            mapfile -t outputs < <(find build/facade-appmodel -name "$name" -type f)
            [ "${#outputs[@]}" -eq 1 ] || { printf 'FAIL  ambiguous AppModel native output %s\n' "$name"; exit 1; }
            cp "${outputs[0]}" "native/$name"
          done
          cmake -S sources/abstraction-facade/cpp -B build/facade-appmodel-arm64 -A ARM64 -DCMAKE_BUILD_TYPE=Release \
            -DABSTRACTION_FACADE_BUILD_AGGREGATE=OFF -DABSTRACTION_FACADE_BUILD_APPMODEL=ON \
            -DABSTRACTION_FACADE_NODE_APPMODEL=OFF -DABSTRACTION_FACADE_APPMODEL_PORTABLE_WINDOWS=ON
          cmake --build build/facade-appmodel-arm64 --config Release --target abstraction_facade_appmodel
          mapfile -t outputs < <(find build/facade-appmodel-arm64 -name abstraction_facade_appmodel.dll -type f)
          [ "${#outputs[@]}" -eq 1 ] || { printf 'FAIL  ambiguous ARM64 AppModel DLL output\n'; exit 1; }
          mkdir -p native/arm64
          cp "${outputs[0]}" native/arm64/abstraction_facade_appmodel.dll

      - name: validate portable AppModel producer outputs
        if: env.OA_FACADE_NATIVE == '1'
        run: |
          PYTHONPATH=scripts python3 -c 'from pathlib import Path; from windows_native import validate_portable_windows_dll; validate_portable_windows_dll(Path("native/abstraction_facade_appmodel.dll"), "win32-x64"); validate_portable_windows_dll(Path("native/arm64/abstraction_facade_appmodel.dll"), "win32-arm64")'

      - name: bind the canonical DLL to the Python and npm source pins
        run: |
          mkdir -p native/build-inputs
          cp build/node-inputs/node-api-headers-1.9.0.tgz build/node-inputs/node-v22.23.3-win-x64.zip \
            build/node-inputs/node-v22.23.3-win-x64.lib build/node-inputs/receipt.json native/build-inputs/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: windows-native-raw-${{ github.run_attempt }}
          path: native/
          if-no-files-found: error

  windows-sdk-sign:
    if: ${{ !inputs.windows_tail_only && (needs.source-guard.result == 'success' && (!inputs.diagnostic_host_sign_only && (inputs.producer_mode != 'train-graph' && (always() && !inputs.signing_probe_only && needs.windows-native-build.result == 'success' && github.repository == 'openabstractions/redist' && github.event_name == 'workflow_dispatch' && (inputs.producer_mode == 'train' && github.ref == format('refs/heads/release/{0}', needs.candidate.outputs.version)) && github.actor == 'ReinisLusis' && github.triggering_actor == 'ReinisLusis')))) }}
